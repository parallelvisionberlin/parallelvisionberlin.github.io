name = "parallel-vision-lab"
main = "worker.mjs"
compatibility_date = "2026-09-26"
workers_dev = true

[vars]
LAB_CUSTOMER_SIGNUPS_ENABLED = "true"
# Allow only verified new-Clerk sessions on their own domain; unlinked users must opt into an account.
# Account links are one-time verified, existing wallets preserved. Rollback: set false and redeploy.
LAB_STUDIO_AUTH_ENABLED = "true"
# One-time 200-credit gift, using the ordinary per-customer wallet ledger.
LAB_WELCOME_CREDITS_ENABLED = "false"
# Separate, narrow 40-credit / first-image trial. Off until reviewed and launched.
# Migration 0051 establishes the no-backfill signup cutoff.
LAB_IMAGE_TRIAL_ENABLED = "false"
# First-account onboarding email only. Enable AFTER verifying pvlab.studio in
# Resend and configuring LAB_RESEND_API_KEY as a Cloudflare Worker secret.
# Default off: existing users and sign-ins are never backfilled or emailed.
LAB_WELCOME_EMAIL_ENABLED = "true"
# Temporarily pause generation funded solely by free/promotional credits.
LAB_FREE_TRIAL_PAUSED = "true"
# Hold unpaid generation for existing disposable-email free-trial accounts; checkout stays open.
LAB_PROMO_HOLDS_ENABLED = "true"
LAB_PUBLIC_GENERATION_ENABLED = "true"
# Private proxy previews become visible only after provider completion, before archival.
LAB_EARLY_PREVIEW_ENABLED = "true"
LAB_CHECKOUT_ENABLED = "true"
LAB_PUBLIC_APP_URL = "https://pvlab.studio/studio.html"
# Phase 1 text screening enabled for customer generation only. Owner tools unaffected.
LAB_MINOR_PROMPT_SAFETY_ENABLED = "true"
# Customer Higgsfield endpoints still use provider authentication and safeguards.
LAB_CUSTOMER_HIGGSFIELD_ENABLED = "true"

[ai]
binding = "AI"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = false

[[d1_databases]]
binding = "LAB_DB"
database_name = "parallel-vision-lab"
database_id = "36e13edc-1557-48a3-a49c-08bbc0f9618f"

# This binding is only queried for existing owner authorization.
# Do not migrate or mutate Nina's tables from the Lab.
[[d1_databases]]
binding = "OWNER_DB"
database_name = "nina-fok-memory"
database_id = "9f31c8a3-8101-408d-a002-22188c67b3b0"

[[r2_buckets]]
binding = "LAB_MEDIA"
bucket_name = "parallel-vision-lab-private"

# Resizes private originals into cached gallery WebP previews. Existing originals
# remain in R2; first 5,000 unique transformations/month are included on Free.
[images]
binding = "IMAGES"

# SPICY_WEBHOOK_SECRET is a separate Cloudflare secret copied from SpicyAPI Console > Webhooks.
# Completion webhooks remain disabled until it is explicitly provisioned.
# LAB_SECRET is a Cloudflare secret, never a committed variable.
# Preserve it across deployments or existing API credentials cannot be decrypted.
# FAL_KEY is also a Cloudflare secret. It is used only for PV Soul character training.


# HF_CREDENTIALS is a Cloudflare secret: Higgsfield KEY_ID:KEY_SECRET.
# Soul 2 stays unavailable until configured. Never commit its value.
