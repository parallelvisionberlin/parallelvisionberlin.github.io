name = "parallel-vision-lab"
main = "worker.mjs"
compatibility_date = "2026-09-26"
workers_dev = true

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = false

[[d1_databases]]
binding = "LAB_DB"
database_name = "parallel-vision-lab"
database_id = "36e13edc-1557-48a3-a49c-08bbc0f9618f"

# This binding is only queried for existing owner authorization.
# Do not migrate or mutate Nina's tables from the Lab.
[[d1_databases]]
binding = "OWNER_DB"
database_name = "nina-fok-memory"
database_id = "9f31c8a3-8101-408d-a002-22188c67b3b0"

[[r2_buckets]]
binding = "LAB_MEDIA"
bucket_name = "parallel-vision-lab-private"

# LAB_SECRET is a Cloudflare secret, never a committed variable.
# Preserve it across deployments or existing API credentials cannot be decrypted.
