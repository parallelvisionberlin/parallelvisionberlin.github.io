name = "parallel-vision-lab"
main = "worker.mjs"
compatibility_date = "2026-09-26"
workers_dev = true

[vars]
LAB_CUSTOMER_SIGNUPS_ENABLED = "true"
LAB_PUBLIC_GENERATION_ENABLED = "false"
LAB_CHECKOUT_ENABLED = "false"
LAB_PUBLIC_APP_URL = "https://parallelvisionlabel.com/lab/studio.html"

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = false

[[d1_databases]]
binding = "LAB_DB"
database_name = "parallel-vision-lab"
database_id = "36e13edc-1557-48a3-a49c-08bbc0f9618f"

# This binding is only queried for existing owner authorization.
# Do not migrate or mutate Nina's tables from the Lab.
[[d1_databases]]
binding = "OWNER_DB"
database_name = "nina-fok-memory"
database_id = "9f31c8a3-8101-408d-a002-22188c67b3b0"

[[r2_buckets]]
binding = "LAB_MEDIA"
bucket_name = "parallel-vision-lab-private"

# LAB_SECRET is a Cloudflare secret, never a committed variable.
# Preserve it across deployments or existing API credentials cannot be decrypted.
# FAL_KEY is also a Cloudflare secret. It is used only for PV Soul character training.


# HF_CREDENTIALS is a Cloudflare secret: Higgsfield KEY_ID:KEY_SECRET.
# Soul 2 stays unavailable until configured. Never commit its value.
