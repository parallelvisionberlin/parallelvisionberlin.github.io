name: Hong Kong three reference source audit
on:
  push:
    branches: ['codex/hk-three-original-refs-20261022']
    paths: ['.github/workflows/hk-three-reference-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            lab
            lab-worker
            tests
            js
            sandbox
            .github
            tools
      - name: Package only tracked source and existing Mood reference assets
        run: |
          set -euo pipefail
          mkdir -p /tmp/hk-source
          git rev-parse HEAD > /tmp/hk-source/source-commit.txt
          python3 - <<'PY'
          import subprocess, zipfile
          files=subprocess.check_output(['git','ls-files','lab','lab-worker','tests','js','sandbox','.github','tools','package.json','package-lock.json','AGENTS.md']).decode().splitlines()
          with zipfile.ZipFile('/tmp/hk-source/source.zip','w',zipfile.ZIP_DEFLATED) as z:
            for p in files:
              if p.endswith(('.js','.mjs','.json','.toml','.html','.css','.yml','.yaml','.md','.sql')) or '/mood-references/' in p:
                z.write(p)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hk-three-reference-source
          path: /tmp/hk-source/
          retention-days: 3
