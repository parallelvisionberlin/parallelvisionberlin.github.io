name: Nina conversion hardening source
on:
  push:
    branches: [nina-conversion-hardening-20260910]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package focused source
        run: |
          mkdir -p /tmp/nina-conversion-src
          cp -a anam-token-worker /tmp/nina-conversion-src/
          mkdir -p /tmp/nina-conversion-src/js /tmp/nina-conversion-src/scripts /tmp/nina-conversion-src/css
          cp js/nina-access.js js/nina-web-flow.js /tmp/nina-conversion-src/js/
          cp scripts/test-nina-web-browser.py /tmp/nina-conversion-src/scripts/ || true
          cp css/nina.css /tmp/nina-conversion-src/css/ 2>/dev/null || true
          cp index.html nina-project.html package.json /tmp/nina-conversion-src/ 2>/dev/null || true
          tar --exclude=node_modules -C /tmp/nina-conversion-src -czf /tmp/nina-conversion-source-small.tgz .
          git rev-parse HEAD > /tmp/commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nina-conversion-hardening-source-small
          path: |
            /tmp/nina-conversion-source-small.tgz
            /tmp/commit.txt
          retention-days: 2
