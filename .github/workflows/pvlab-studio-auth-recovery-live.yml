name: PV LAB signed-in Studio recovery live check
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pvlab-studio-auth-recovery-live.yml'
      - 'lab/studio.html'
      - 'lab/native-account.js'
      - 'lab/lab.js'
permissions:
  contents: read
jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Confirm current Studio HTML, Clerk SDK and app JS on pvlab.studio
        shell: bash
        run: |
          set -u
          for attempt in $(seq 1 22); do
            ready=1
            for item in image video; do
              code="$(curl -sSL --retry 1 --connect-timeout 8 --max-time 16 -H 'Cache-Control: no-cache'                 -o "/tmp/pv-studio-$item.html" -w '%{http_code}'                 "https://pvlab.studio/studio?tool=$item&authverify=20261017-v2-$attempt" || true)"
              if [ "$code" != 200 ]; then echo "$item Studio HTTP: $code"; ready=0; fi
            done
            for file in native-account.js lab.js; do
              code="$(curl -sSL --retry 1 --connect-timeout 8 --max-time 16 -H 'Cache-Control: no-cache'                 -o "/tmp/pv-$file" -w '%{http_code}'                 "https://pvlab.studio/$file?authverify=20261017-v2-$attempt" || true)"
              if [ "$code" != 200 ]; then echo "$file HTTP: $code"; ready=0; fi
            done
            check(){
              local label="$1" needle="$2" file="$3"
              if [ ! -f "$file" ] || ! grep -Fq "$needle" "$file"; then
                echo "NOT LIVE: $label"
                ready=0
              fi
            }
            check "Image boot recovery code" "window.__pvLabBootRecover=" /tmp/pv-studio-image.html
            check "Video boot recovery code" "window.__pvLabBootRecover=" /tmp/pv-studio-video.html
            check "Image failure stage" "Studio setup stalled during" /tmp/pv-studio-image.html
            check "Image new auth cache marker" "studioAuthRecovery=20261017-3" /tmp/pv-studio-image.html
            check "Video new auth cache marker" "studioAuthRecovery=20261017-3" /tmp/pv-studio-video.html
            check "Clerk bounded setup" "boundedSetup(Promise.all([sdk,ui]),12000" /tmp/pv-native-account.js
            check "Clerk hydrate timeout" "boundedSetup(clerk.load(" /tmp/pv-native-account.js
            check "Nonblocking referral" "if(customerMode)void claimReferral" /tmp/pv-lab.js
            check "History startup deadline" "await Promise.race([historyReady,new Promise(resolve=>setTimeout(resolve,5000))]);" /tmp/pv-lab.js
            if [ "$ready" = 1 ]; then
              echo "PASS: both pvlab.studio Studio entry points and signed-in loader recovery code are LIVE."
              exit 0
            fi
            echo "Waiting for custom domain source update (attempt $attempt/22)."
            sleep 12
          done
          echo "FAIL: current signed-in Studio recovery code was not verified on the public domain."
          exit 1
