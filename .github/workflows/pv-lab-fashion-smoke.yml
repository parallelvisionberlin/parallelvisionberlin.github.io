name: PV Lab Fashion public smoke (read only)
on:
  pull_request:
    paths:
      - 'lab/fashion.*'
      - 'lab-worker/fashion-tools.mjs'
      - '.github/workflows/pv-lab-fashion-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report latest Lab deployment runs (GitHub metadata only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-lab-worker.yml/runs?per_page=8" --jq '.workflow_runs[] | [.id,.created_at,.head_sha,.status,(.conclusion // "pending")] | @tsv'
      - name: Verify deployed Worker version without credentials
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 18 \
            https://parallel-vision-lab.parallelvision.workers.dev/health -o /tmp/pv-lab-health.json
          node -e "const x=require('/tmp/pv-lab-health.json');if(x.ok!==true||!/^pv-lab-20\\d{2}-\\d{2}-\\d{2}[.-][A-Za-z0-9][A-Za-z0-9.-]*$/.test(x.version)){console.error('Worker health is not valid:',x.version);process.exit(1)}console.log('Worker healthy:',x.version)"
      - name: Verify owner-only API rejects anonymous calls
        shell: bash
        run: |
          set -euo pipefail
          for path in /api/fashion/models /api/fashion/balance; do
            code="$(curl --silent --show-error --max-time 18 -o /tmp/response.json -w '%{http_code}' \
              "https://parallel-vision-lab.parallelvision.workers.dev$path")"
            test "$code" = '401' || { echo "Owner-only route $path returned HTTP $code, expected 401"; exit 1; }
          done
          echo "Fashion API correctly rejects anonymous requests."
      - name: Verify published Fashion template and its declared assets
        shell: bash
        run: |
          set -euo pipefail
          published=0
          for attempt in $(seq 1 12); do
            curl --location --fail --silent --show-error --max-time 18 \
              -H 'Cache-Control: no-cache' \
              "https://pvlab.studio/fashion.html?pv-check=public-contract-${attempt}" -o /tmp/pv-fashion.html
            if grep -Fq 'id="fashion-form"' /tmp/pv-fashion.html && grep -Eq 'fashion\.css\?v=' /tmp/pv-fashion.html; then
              published=1; break
            fi
            echo "Waiting for the canonical Fashion template (attempt ${attempt}/12)"
            sleep 5
          done
          if [ "$published" != 1 ]; then echo "Canonical Fashion template is unavailable."; exit 1; fi
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const page=new URL('https://pvlab.studio/fashion.html');
          const html=readFileSync('/tmp/pv-fashion.html','utf8');
          for(const marker of [
            'Replace <em>outfit.</em>','<option value="fashnmax" selected>',
            '<meta name="theme-color" content="#101114">',
            'class="empty-art empty-art-person"','class="empty-art empty-art-garment"',
            'class="empty-art empty-art-result"','<path d="M25 24h55v72H25Z"/>',
            'id="person-slot"','id="garment-slot"','id="result-stage"',
            'id="fashion-gallery"','id="fashion-history"','id="fashion-more"'
          ])assert.ok(html.includes(marker),'Published Fashion contract missing: '+marker);
          assert.ok(!html.includes('class="recent-work"'),'Old nested archive must remain absent');
          assert.ok(!html.includes('editorial-reference'),'Decorative reference must not replace the actual result panel');
          const css=html.match(/<link[^>]+href="([^"]*fashion\.css\?[^"]+)"[^>]*>/);
          const js=html.match(/<script[^>]+src="([^"]*fashion\.js\?[^"]+)"[^>]*>/);
          assert.ok(css&&js,'Published template declares both versioned assets');
          assert.ok(css[0].includes('rel="stylesheet"')&&js[0].includes('type="module"'));
          async function asset(href,name){
            const url=new URL(href.replaceAll('&amp;','&'),page);
            assert.equal(url.origin,page.origin,'Assets stay on the canonical Studio domain');
            assert.ok(url.pathname.endsWith('/'+name)&&url.searchParams.get('v'),'Declared asset has a version');
            const response=await fetch(url,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(18000)});
            assert.equal(response.status,200,'Declared asset must be readable: '+url);
            return response.text();
          }
          const stylesheet=await asset(css[1],'fashion.css');
          assert.ok(stylesheet.includes('.fashion-gallery{grid-column:1 / -1;grid-row:3'),'Full-width gallery contract');
          assert.ok(stylesheet.includes('max-height:none;overflow:visible'),'History must not regain its tiny scrollbar');
          const module=await asset(js[1],'fashion.js');
          assert.ok(module.includes('loadGalleryThumbnails'),'Published gallery retains thumbnail loading');
          assert.ok(module.includes('export function createFashionStudio'),'Published module exposes the canonical controller');
          assert.ok(module.includes('/api/fashion/quote'),'Price review retains its real quote endpoint');
          console.log('Canonical Fashion template and declared CSS/module are healthy; this is not a release check for the PR.');
          NODE
