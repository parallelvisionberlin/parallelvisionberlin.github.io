name: PV Lab Fashion public smoke (read only)
on:
  pull_request:
    paths:
      - 'lab/fashion.*'
      - 'lab-worker/fashion-tools.mjs'
      - '.github/workflows/pv-lab-fashion-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report latest Lab deployment runs (GitHub metadata only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-lab-worker.yml/runs?per_page=8" --jq '.workflow_runs[] | [.id,.created_at,.head_sha,.status,(.conclusion // "pending")] | @tsv'
      - name: Verify deployed Worker version without credentials
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 18 \
            https://parallel-vision-lab.parallelvision.workers.dev/health -o /tmp/pv-lab-health.json
          node -e "const x=require('/tmp/pv-lab-health.json');if(x.ok!==true||!/^pv-lab-2026-10-09\\.13-fashion-balance/.test(x.version)){console.error('Worker not on expected fashion integration:',x.version);process.exit(1)}console.log('Worker healthy:',x.version)"
      - name: Verify owner-only API rejects anonymous calls
        shell: bash
        run: |
          set -euo pipefail
          for path in /api/fashion/models /api/fashion/balance; do
            code="$(curl --silent --show-error --max-time 18 -o /tmp/response.json -w '%{http_code}' \
              "https://parallel-vision-lab.parallelvision.workers.dev$path")"
            test "$code" = '401' || { echo "Owner-only route $path returned HTTP $code, expected 401"; exit 1; }
          done
          echo "Fashion API correctly rejects anonymous requests."
      - name: Verify Fashion page HTML is published
        shell: bash
        run: |
          set -euo pipefail
          published=0
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error --max-time 18 \
              -H 'Cache-Control: no-cache' \
              "https://parallelvisionlabel.com/lab/fashion.html?pv-check=ghost-icons-20261010-${attempt}" -o /tmp/pv-fashion.html
            if grep -Fq 'fashion.css?v=20261010-fashion-ghost01' /tmp/pv-fashion.html; then
              published=1; break
            fi
            echo "Waiting for GitHub Pages to publish Fashion ghost icons (attempt ${attempt}/12)"
            sleep 5
          done
          if [ "$published" != 1 ]; then echo "The live HTML remains the prior version."; exit 1; fi
          echo "Live page metadata:"
          grep -o '<title>[^<]*' /tmp/pv-fashion.html | head -1 || true
          grep -o 'fashion.css?v=[^"]*' /tmp/pv-fashion.html | head -1 || true
          grep -Fq 'Replace <em>outfit.</em>' /tmp/pv-fashion.html
          grep -Fq '<option value="fashnmax" selected>' /tmp/pv-fashion.html
          grep -Fq 'fashion.css?v=20261010-fashion-ghost01' /tmp/pv-fashion.html
          grep -Fq '<meta name="theme-color" content="#101114">' /tmp/pv-fashion.html
          grep -Fq 'class="empty-art empty-art-person"' /tmp/pv-fashion.html
          grep -Fq 'class="empty-art empty-art-garment"' /tmp/pv-fashion.html
          grep -Fq 'class="empty-art empty-art-result"' /tmp/pv-fashion.html
          grep -Fq 'id="person-slot"' /tmp/pv-fashion.html
          grep -Fq 'id="garment-slot"' /tmp/pv-fashion.html
          grep -Fq 'id="result-stage"' /tmp/pv-fashion.html
          if grep -Fq 'editorial-reference' /tmp/pv-fashion.html; then
            echo "Unexpected decorative image in actual result panel"; exit 1
          fi
          echo "Published Fashion ghost icons verified. No paid provider calls."
