name: PV Lab Fashion public smoke (read only)
on:
  pull_request:
    paths:
      - 'lab/fashion.*'
      - 'lab-worker/fashion-tools.mjs'
      - '.github/workflows/pv-lab-fashion-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Report latest Lab deployment runs (GitHub metadata only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-lab-worker.yml/runs?per_page=8" --jq '.workflow_runs[] | [.id,.created_at,.head_sha,.status,(.conclusion // "pending")] | @tsv'
      - name: Verify deployed Worker version without credentials
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 2 --max-time 18 \
            https://parallel-vision-lab.parallelvision.workers.dev/health -o /tmp/pv-lab-health.json
          node -e "const x=require('/tmp/pv-lab-health.json');if(x.ok!==true||!/^pv-lab-20\\d{2}-\\d{2}-\\d{2}[.-]/.test(x.version)){console.error('Worker health is not valid:',x.version);process.exit(1)}console.log('Worker healthy:',x.version)"
      - name: Verify owner-only API rejects anonymous calls
        shell: bash
        run: |
          set -euo pipefail
          for path in /api/fashion/models /api/fashion/balance; do
            code="$(curl --silent --show-error --max-time 18 -o /tmp/response.json -w '%{http_code}' \
              "https://parallel-vision-lab.parallelvision.workers.dev$path")"
            test "$code" = '401' || { echo "Owner-only route $path returned HTTP $code, expected 401"; exit 1; }
          done
          echo "Fashion API correctly rejects anonymous requests."
      # This PR is deliberately unmerged. Validate the currently published
      # Fashion contract; the approved candidate is checked by mock browsers.
      # Never require an unmerged PR version to be present on production.
      - name: Verify canonical production Fashion route and published component
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const origin='https://pvlab.studio';
          async function publicText(path){
            const url=new URL(path,origin);
            assert.equal(url.origin,origin,'Only public PV LAB static assets are inspected');
            const response=await fetch(url,{method:'GET',cache:'no-store',signal:AbortSignal.timeout(18000)});
            assert.equal(response.status,200,'Published route is available: '+url.pathname);
            assert.equal(new URL(response.url).origin,origin,'Static asset stays on the production origin');
            return response.text();
          }
          const studio=await publicText('/studio?tool=fashion');
          assert.ok(studio.includes('id="tool-fashion"'),'Canonical Studio retains Fashion navigation');
          const html=await publicText('/fashion.html');
          assert.ok(html.includes('Replace <em>outfit.</em>')||html.includes('<span>Replace</span><em>outfit.</em>'),'Published Fashion title is present in classic or Runway presentation');
          assert.ok(html.includes('<meta name="theme-color" content="#101114">'),'Fashion keeps the dark theme');
          for(const id of ['fashion-form','person-slot','person-file','garment-slot','garment-file',
            'model-select','max-resolution','max-mode','direction','quote','result-stage',
            'fashion-gallery','fashion-history','fashion-more']){
            assert.ok(html.includes('id="'+id+'"'),'Published Fashion retains '+id);
          }
          assert.ok(!html.includes('id="quote-box"'),'Obsolete Review charge popup is removed');
          assert.ok(!html.includes('id="confirm"'),'Generate is the single paid action');
          for(const model of ['fashnmax','fashn16','fluxvto']){
            assert.ok(html.includes('value="'+model+'"'),'Published Fashion retains model '+model);
          }
          assert.ok(html.includes('<option value="fashnmax" selected>'),'Default model is preserved');
          assert.ok(!html.includes('class="recent-work"'),'No obsolete nested archive');
          assert.ok(!html.includes('id="editorial-reference"'),'No decorative photo masquerades as an output');
          // Production may still have the prior ghost cards until this PR is
          // authorized and merged. Both versions retain real person/garment inputs.
          for(const kind of ['person','garment']){
            assert.ok(html.includes('empty-art empty-art-'+kind)||html.includes('slot-example '+kind+'-example'),
              'Published '+kind+' card retains its intended artwork');
          }
          assert.ok(html.includes('class="empty-art empty-art-result"'),'Result artwork remains distinct');
          function asset(expression,label){
            const matched=html.match(expression);
            assert.ok(matched,'Published '+label+' reference is present');
            return new URL(matched[1],origin+'/fashion.html').href;
          }
          const css=await publicText(asset(/href="([^" ]*fashion\.css\?[^" ]+)"/,'Fashion stylesheet'));
          assert.ok(css.includes('.fashion-gallery{grid-column:1 / -1;grid-row:3'),'Full-width private gallery retained');
          assert.ok(css.includes('max-height:none;overflow:visible'),'Gallery has no miniature scrolling limit');
          const js=await publicText(asset(/src="([^" ]*fashion\.js\?[^" ]+)"/,'Fashion controller'));
          for(const marker of ['createFashionStudio','loadGalleryThumbnails','/api/fashion/quote','/api/fashion/submit']){
            assert.ok(js.includes(marker),'Published controller retains '+marker);
          }
          assert.ok(js.includes("'Generate · '")&&js.includes('quote.creditCost.toLocaleString()'),'Generate displays the server-confirmed credit price');
          assert.ok(js.includes('body:{quoteId:quoted.id,confirm:true}'),'Paid submission retains explicit server-bound confirmation');
          console.log('PASS canonical production Fashion route, inputs, models, private gallery and published asset references. GET only; no paid calls.');
          NODE
