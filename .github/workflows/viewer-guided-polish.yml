name: Guided Replace final wording check
on:
  push:
    branches: [feat/viewer-guided-replace-20261107]
    paths: ['.github/workflows/viewer-guided-polish.yml']
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/viewer-guided-replace-20261107
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply narrowly scoped wording and type treatment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lab/precision-edit.js');s=p.read_text()
          old="if(base&&next==='brush')setStatus('Brush active. Click and drag directly on the photograph to paint your selection.');"
          assert s.count(old)==1
          s=s.replace(old,"if(base&&next==='magic'&&view.classList.contains('is-guided-replace'))setStatus('Click what you want to replace.');\n    "+old)
          old="setStatus('Object selected. Click another garment to add it, or refine with the brush.');"
          assert s.count(old)==1
          s=s.replace(old,"setStatus(view.classList.contains('is-guided-replace')?'Selection ready. Choose a replacement or describe it.':'Object selected. Click another garment to add it, or refine with the brush.');")
          p.write_text(s)
          p=Path('lab/viewer-guided-replace.css');s=p.read_text()
          s+="\n#image-lightbox .is-guided-replace .viewer-reference-picker{letter-spacing:normal;text-transform:none;font:500 12px/1.4 'DM Sans',sans-serif}\n"
          p.write_text(s)
          p=Path('tests/lab-image-replacement-flow-ui.mjs');s=p.read_text()
          anchor="await page.screenshot({path:`test-results/pv-guided-enter-${width}.png`});"
          a=s.index(anchor);pre=s[:a];post=s[a:]
          old="document.querySelector('#precision-status-text').textContent.includes('Object selected')"
          assert post.count(old)==1
          post=post.replace(old,"document.querySelector('#precision-status-text').textContent.includes('Selection ready.')")
          p.write_text(pre+post)
          PY
          node --check lab/precision-edit.js
          git diff --check
          node --test tests/lab-approved-image-ui-contract.test.mjs tests/lab-guided-replace.test.mjs tests/lab-viewer-inline.test.mjs tests/lab-precision-edit.test.mjs
      - name: Verify affected browser behavior
        shell: bash
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-guided-final/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          npm install --prefix /tmp/pv-guided-final --no-save playwright@1.57.0
          node /tmp/pv-guided-final/node_modules/playwright/cli.js install --with-deps chromium
          node tests/lab-precision-edit-ui.mjs
          node tests/lab-image-replacement-flow-ui.mjs
      - name: Commit only verified source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PV LAB verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lab/precision-edit.js lab/viewer-guided-replace.css tests/lab-image-replacement-flow-ui.mjs
          git rm .github/workflows/viewer-guided-polish.yml
          git diff --cached --check
          git commit -m 'fix: keep guided selection instructions consistent'
          git push origin HEAD:feat/viewer-guided-replace-20261107
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guided-replace-final-preview
          path: |
            test-results/pv-guided-*.png
            test-results/pv-viewer-*.png
          retention-days: 2
