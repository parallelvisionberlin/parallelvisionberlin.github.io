name: Nina website conversion checks
on:
  push:
    branches: [nina-web-conversion-20260909]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bbe528ad35a9306e35844d3afe5f016228a5e0e5
          sparse-checkout: |
            js
            css
            anam-token-worker
            nina-admin
            scripts
            .github
            docs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: |
          npm install -g pnpm@10.15.1
          pnpm --dir anam-token-worker install --frozen-lockfile
      - name: Record baseline tests without altering source
        run: |
          npm run check --prefix anam-token-worker > /tmp/syntax.log 2>&1
          npm test --prefix anam-token-worker > /tmp/tests.log 2>&1 || true
      - name: Package public source and dependency for offline testing
        if: always()
        run: |
          mkdir -p /tmp/nina-review/dependency/node_modules
          tar --exclude=node_modules --exclude=.git --exclude=.wrangler -czf /tmp/nina-review/website-source.tar.gz js css anam-token-worker nina-admin scripts .github docs *.html package*.json
          cp -rL anam-token-worker/node_modules/stripe /tmp/nina-review/dependency/node_modules/stripe
          tar -C /tmp/nina-review/dependency -czf /tmp/nina-review/stripe-dependency.tar.gz node_modules
          rm -rf /tmp/nina-review/dependency
          cp /tmp/tests.log /tmp/syntax.log /tmp/nina-review/ 2>/dev/null || true
          git rev-parse HEAD > /tmp/nina-review/base-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nina-current-baseline
          path: /tmp/nina-review/
          retention-days: 2
