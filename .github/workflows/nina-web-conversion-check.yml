name: Nina website conversion checks
on:
  push:
    branches: [nina-web-conversion-20260909]
permissions:
  contents: write
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nina-web-conversion-20260909
          sparse-checkout: |
            js
            css
            anam-token-worker
            nina-admin
            scripts
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed website patch when present
        run: |
          if [ -f scripts/nina-web-conversion.patch ]; then
            if git apply --reverse --check scripts/nina-web-conversion.patch 2>/dev/null; then
              echo 'Changes already applied'
            else
              git apply --check scripts/nina-web-conversion.patch
              git apply scripts/nina-web-conversion.patch
            fi
          fi
      - name: Install Worker dependencies using the existing lock
        run: |
          npm install -g pnpm@10.15.1
          pnpm --dir anam-token-worker install --frozen-lockfile
      - name: Check Worker syntax and tests
        run: |
          npm run check --prefix anam-token-worker
          npm test --prefix anam-token-worker > /tmp/nina-worker-tests.log 2>&1 || { cat /tmp/nina-worker-tests.log; exit 1; }
          tail -15 /tmp/nina-worker-tests.log
      - name: Export source and test results for review
        if: always()
        run: |
          mkdir -p /tmp/nina-review
          tar --exclude=node_modules --exclude=.git --exclude=.wrangler -czf /tmp/nina-review/website-source.tar.gz js css anam-token-worker nina-admin scripts .github *.html package*.json
          cp /tmp/nina-worker-tests.log /tmp/nina-review/worker-tests.log 2>/dev/null || true
          git diff --stat > /tmp/nina-review/diff-stat.txt
          git diff > /tmp/nina-review/website.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nina-website-review
          path: /tmp/nina-review/
          retention-days: 2
      - name: Commit only reviewed website paths to this isolated branch
        if: success()
        run: |
          if [ -f scripts/nina-web-conversion.patch ]; then
            git add js/nina-access.js js/nina-web-flow.js js/nina-admin.js css/nina-access.css anam-token-worker/src/index.js anam-token-worker/src/meta-capi.js anam-token-worker/src/web-conversation.js anam-token-worker/migrations/20260909_nina_web_conversations.sql anam-token-worker/test anam-token-worker/WEBSITE_CONVERSION_CHECKLIST.md index.html nina-project.html nina-admin/index.html
            if ! git diff --cached --quiet; then
              git config user.name 'Nina website checks'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Implement tested Nina website conversation and continuation flow'
              git push origin HEAD:nina-web-conversion-20260909
            fi
          fi
