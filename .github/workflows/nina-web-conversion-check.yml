name: Nina website conversion checks
on:
  push:
    branches: [nina-web-conversion-20260909]
permissions:
  contents: write
jobs:
  website:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nina-web-conversion-20260909
          sparse-checkout: |
            js
            css
            anam-token-worker
            scripts
            .github
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed website-only changes when present
        run: |
          if [ -f scripts/nina-apply-web-conversion.mjs ]; then
            node scripts/nina-apply-web-conversion.mjs
          fi
      - name: Install Worker dependencies
        run: npm ci --prefix anam-token-worker
      - name: Check Worker syntax and tests
        run: |
          npm run check --prefix anam-token-worker
          npm test --prefix anam-token-worker > /tmp/nina-worker-tests.log 2>&1 || { cat /tmp/nina-worker-tests.log; exit 1; }
          tail -15 /tmp/nina-worker-tests.log
      - name: Export source and test results for review
        if: always()
        run: |
          mkdir -p /tmp/nina-review
          tar --exclude=node_modules --exclude=.git --exclude=.wrangler -czf /tmp/nina-review/website-source.tar.gz js css anam-token-worker scripts .github *.html package*.json
          cp /tmp/nina-worker-tests.log /tmp/nina-review/worker-tests.log 2>/dev/null || true
          git diff --stat > /tmp/nina-review/diff-stat.txt
          git diff > /tmp/nina-review/website.patch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nina-website-review
          path: /tmp/nina-review/
          retention-days: 2
      - name: Commit only reviewed website paths to this isolated branch
        if: success()
        run: |
          if [ -f scripts/nina-apply-web-conversion.mjs ]; then
            git add js css anam-token-worker scripts index.html nina-project.html account.html
            if ! git diff --cached --quiet; then
              git config user.name 'Nina website checks'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Implement tested Nina website conversation and continuation flow'
              git push origin HEAD:nina-web-conversion-20260909
            fi
          fi
