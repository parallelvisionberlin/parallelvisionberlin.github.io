name: ALTER Hair Skin photographic preview review
on:
  push:
    branches: [fix/alter-hair-skin-preview-photos-20261107]
    paths: [.github/workflows/alter-hair-skin-review.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Import exact cropped previews and retain original control behavior
        run: |
          curl --fail --location --silent --show-error 'https://at.adobe.com/7hBIu6B3zbxQ3ggr' -o /tmp/alter-hair-skin.zip
          echo '3a1483dce1b655dc9bbab745ae3474c5552bf24d62c18b72d2fb16c56dc0a40d  /tmp/alter-hair-skin.zip' | sha256sum --check
          mkdir -p /tmp/alter-hair-skin
          unzip -q /tmp/alter-hair-skin.zip -d /tmp/alter-hair-skin
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path('/tmp/alter-hair-skin');entries=json.loads((root/'manifest.json').read_text())['files']
          assert len(entries)==16 and len({e['sha256'] for e in entries})==16
          for e in entries:
            p=e['path']
            assert p.startswith('lab/visuals/beauty/atelier/alter-') and p.endswith('-20261107.webp') and '..' not in Path(p).parts
            data=(root/p).read_bytes()
            assert len(data)>5000 and data[:4]==b'RIFF' and data[8:12]==b'WEBP' and hashlib.sha256(data).hexdigest()==e['sha256']
            dst=Path(p)
            assert not dst.exists(), 'Asset collision: '+p
            dst.parent.mkdir(parents=True,exist_ok=True);dst.write_bytes(data)
          for p in ['lab/beauty-editorial-final.css','lab/beauty-flow-refinement.css','lab/visuals/beauty/atelier/hero.webp','lab/beauty-settings.js','lab/beauty.js']:
            Path('/tmp/'+p.replace('/','_')+'.sha').write_text(hashlib.sha256(Path(p).read_bytes()).hexdigest())
          PY
          python3 /tmp/alter-hair-skin/apply.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re
          for p in ['lab/beauty-editorial-final.css','lab/beauty-flow-refinement.css','lab/visuals/beauty/atelier/hero.webp','lab/beauty-settings.js','lab/beauty.js']:
            assert hashlib.sha256(Path(p).read_bytes()).hexdigest()==Path('/tmp/'+p.replace('/','_')+'.sha').read_text(),p
          h=Path('lab/beauty.html').read_text();c=Path('lab/beauty-look-catalog.js').read_text()
          assert h.count('data-beauty-original')==5
          assert '<h1>ALTER <br>Studio.</h1>' in h
          for s in [h,c]: assert len(re.findall(r'alter-(?:hair|skin)-[\w-]+-20261107\.webp',s))==16
          PY
          git diff --check
      - name: Existing quote, ID and preset controls
        run: |
          node --check lab/beauty-look-catalog.js
          node --test tests/lab-approved-image-ui-contract.test.mjs tests/lab-beauty.test.mjs tests/lab-beauty-atelier.test.mjs tests/lab-beauty-category-contract.test.mjs
          node --test --test-name-pattern='Beauty Studio binds' tests/lab-worker.test.mjs
      - name: Existing browser regression, no provider calls
        run: |
          npm install --prefix /tmp/pv-beauty --no-audit --no-fund playwright@1.57.0
          node /tmp/pv-beauty/node_modules/playwright/cli.js install chromium
          PV_PLAYWRIGHT_MODULE=/tmp/pv-beauty/node_modules/playwright/index.mjs node tests/lab-beauty-ui.mjs
      - name: Save tested patch to review branch only
        run: |
          test "$GITHUB_REF" = refs/heads/fix/alter-hair-skin-preview-photos-20261107
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lab/beauty.html lab/beauty-look-catalog.js lab/visuals/beauty/atelier/alter-hair-*20261107.webp lab/visuals/beauty/atelier/alter-skin-*20261107.webp
          test "$(git diff --cached --name-only | wc -l)" -eq 18
          git diff --cached --check
          git commit -m 'Replace ALTER Hair and Skin presets with distinct photographic references'
          git push origin HEAD:refs/heads/fix/alter-hair-skin-preview-photos-20261107
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alter-hair-skin-evidence
          path: test-results/beauty-*.png
          retention-days: 3
