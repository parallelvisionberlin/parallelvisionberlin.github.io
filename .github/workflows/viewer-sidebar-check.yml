name: Verify single-sidebar viewer
on:
  push:
    branches: [fix/viewer-single-sidebar-20261107]
    paths: ['.github/workflows/viewer-sidebar-check.yml', '.github/scripts/viewer-sidebar.patch']
permissions:
  contents: write
jobs:
  sidebar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/viewer-single-sidebar-20261107
          sparse-checkout: |
            AGENTS.md
            package.json
            lab
            lab-worker
            tests
            scripts
            .github
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply reviewed sidebar patch and precise fitted-photo dimensions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/viewer-sidebar-evidence
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/viewer-sidebar.patch');s=p.read_text()
          old="textContent.includes('Object selected')"
          assert s.count(old)==1
          p.write_text(s.replace(old,"textContent.includes('Selection ready.')"))
          PY
          git apply --check .github/scripts/viewer-sidebar.patch
          git apply .github/scripts/viewer-sidebar.patch
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lab/precision-edit.js');s=p.read_text()
          old='  function syncPreviewFit(){\n    if(!isOpen())return;'
          assert s.count(old)==1
          p.write_text(s.replace(old,old+"\n    if(base&&view.closest('#image-lightbox'))view.style.setProperty('--viewer-source-aspect',String(base.width/base.height));"))
          p=Path('lab/image-viewer-editor.css')
          p.write_text(p.read_text()+"#image-lightbox.is-viewer-editing .precision-stage{width:100%;max-width:min(100%,calc(var(--precision-source-fit-height,100vh)*var(--viewer-source-aspect,1)))}\n#image-lightbox.is-viewer-editing #precision-source-canvas{width:100%;height:auto}\n")
          p=Path('lab/studio.html');s=p.read_text()
          old='image-viewer-editor.css?v=20261107-inline-editor2'
          assert s.count(old)==1
          s=s.replace(old,'image-viewer-editor.css?v=20261107-viewer-sidebar1')
          needle='<script type="module" src="./lab.js?';assert s.count(needle)==1
          end=s.index(chr(34),s.index(needle)+len(needle))
          p.write_text(s[:end]+'&viewerSidebar=20261107-viewer-sidebar1'+s[end:])
          PY
          node --check lab/lab.js
          node --check lab/image-viewer-editor.js
          node --check lab/precision-edit.js
          git diff --check
      - name: Verify existing Image and replacement safeguards
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/lab-approved-image-ui-contract.test.mjs tests/lab-guided-replace.test.mjs tests/lab-viewer-inline.test.mjs tests/lab-precision-edit.test.mjs tests/lab-image-replacement-intent.test.mjs tests/lab-image-replacement-composite.test.mjs tests/lab-image-replacement-backend.test.mjs tests/lab-image-replacement-draft.test.mjs | tee /tmp/viewer-sidebar-evidence/unit.log
      - name: Prepare pinned Playwright with hosted Chrome
        run: |
          npm install --prefix /tmp/viewer-sidebar-browser --no-save playwright@1.57.0
          test -x /usr/bin/google-chrome
          cat > /tmp/viewer-sidebar-browser/runtime.mjs <<'JS'
          import * as pw from './node_modules/playwright/index.mjs';
          export const chromium=new Proxy(pw.chromium,{get(target,key){return key==='launch'?(options={})=>target.launch({...options,executablePath:'/usr/bin/google-chrome'}):Reflect.get(target,key);}});
          JS
      - name: Verify sizing, masks, saved references, generation and restoration
        shell: bash
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/viewer-sidebar-browser/runtime.mjs
        run: |
          set -euo pipefail
          node tests/lab-image-replacement-flow-ui.mjs 2>&1 | tee /tmp/viewer-sidebar-evidence/sidebar-flow.log
          node tests/lab-precision-edit-ui.mjs 2>&1 | tee /tmp/viewer-sidebar-evidence/precision.log
          PV_RETOUCH_NAV_ONLY=1 node tests/lab-image-oneclick-ui.mjs 2>&1 | tee /tmp/viewer-sidebar-evidence/navigation.log
      - name: Record evidence and commit only the verified feature branch
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,appendFileSync} from 'node:fs';
          const record=JSON.parse(readFileSync('lab/owner-work-records.json','utf8')).records.find(r=>r.id==='image-viewer-replace-edit-actions');
          if(!record)throw Error('Missing existing viewer record');
          const run='https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID;
          Object.assign(record,{status:'needs_verification',updatedAt:new Date().toISOString(),baselineSha:'5f226c95947d8f31a9651e7c18b6b8a988187315',reviewedSha:null,branch:'fix/viewer-single-sidebar-20261107',summary:'Edit/Replace swaps the original right-hand Image details sidebar for editing controls. No third column or smaller photo; leaving editing restores metadata/actions. Guided selection, saved references and generation behavior are unchanged.',nextAction:'Review the PR and verify exact Cloudflare production assets after merge. No real-account or paid edit has been run.'});
          record.tests=[{label:'70 focused Image and replacement safeguards',result:'passed',scope:'Existing provider-free tests including saved Character bundles, quotes and duplicate protection.'},{label:'Single-sidebar complete browser flow',result:'passed',scope:'390px, 1440px and 1728px: photo-size parity, correct mask alignment, saved references, explicit mocked Generate, unchanged Image draft and restored sidebar.'},{label:'Precision and standalone Retouch regression',result:'passed',scope:'Existing mocked selection, zoom/pan and safe navigation tests.'}];
          record.deployment={state:'not_started',environment:'Cloudflare Pages pvlab-studio',sourceSha:null,limitations:['Sidebar correction is not yet published.','No real-account or paid generation was run.','Saved Location reference swaps remain unsupported.']};
          record.links.push({label:'Single-sidebar verification',url:run});
          record.evidence.push({kind:'automated_test',summary:'Single-sidebar mode switch and fitted-photo dimensions passed with existing selection, generation and Retouch regressions.',scope:'Synthetic media and intercepted APIs at phone and desktop widths',source:run,limitations:['Not a live signed-in or paid generation test.']});
          record.blockers=['PR and production asset verification pending.'];
          writeFileSync('/tmp/sidebar-record.json',JSON.stringify(record));
          appendFileSync('lab/IMAGE-REPLACEMENT-WORK-STATE.md','\n\n## Single-sidebar mode switch, 2026-11-07\n\nEditing now replaces Image details in the existing right-hand sidebar rather than adding a middle panel. The photograph retains normal viewer fit, including small originals. Exit restores metadata/actions. Guided selection, saved references, provider/model and billing behavior are unchanged.\n\n70 focused unit tests and the full mocked flow at 390px, 1440px and 1728px passed, including photo-size parity and masks. Existing Precision and standalone Retouch regression checks passed. No paid or real-account edit was run. Production verification remains separate.\n');
          JS
          node scripts/owner-work-state.mjs upsert /tmp/sidebar-record.json
          node scripts/owner-work-state.mjs validate
          git config user.name 'PV LAB verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lab/image-viewer-editor.js lab/image-viewer-editor.css lab/precision-edit.js lab/lab.js lab/studio.html tests/lab-image-replacement-flow-ui.mjs lab/owner-work-records.json lab/IMAGE-REPLACEMENT-WORK-STATE.md
          git rm -f .github/scripts/viewer-sidebar.patch .github/workflows/viewer-sidebar-check.yml
          git diff --cached --check
          git commit -m 'fix: swap viewer sidebar without shrinking the photograph'
          git rev-parse HEAD > /tmp/viewer-sidebar-evidence/source-sha.txt
          git push origin HEAD:fix/viewer-single-sidebar-20261107
      - name: Retain verification evidence
        if: always()
        run: |
          mkdir -p /tmp/viewer-sidebar-evidence
          cp test-results/pv-sidebar-*.png /tmp/viewer-sidebar-evidence/ 2>/dev/null || true
          cp test-results/pv-guided-saved-*.png /tmp/viewer-sidebar-evidence/ 2>/dev/null || true
          tar -czf /tmp/viewer-sidebar-evidence/source.tar.gz lab/image-viewer-editor.js lab/image-viewer-editor.css lab/precision-edit.js lab/lab.js lab/studio.html tests/lab-image-replacement-flow-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: single-sidebar-evidence
          path: /tmp/viewer-sidebar-evidence/
          retention-days: 2
