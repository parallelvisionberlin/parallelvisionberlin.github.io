name: Lab tests
on:
  pull_request:
    paths:
      - 'lab/**'
      - 'lab-worker/**'
      - 'tests/lab*.mjs'
      - '.github/workflows/lab-tests.yml'
  push:
    branches: [main]
    paths:
      - 'lab/**'
      - 'lab-worker/**'
      - 'tests/lab*.mjs'
      - '.github/workflows/lab-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            lab
            lab-worker
            sandbox
            tests
            .github/scripts
            js/pv-auth.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Check JavaScript syntax
        run: |
          find lab lab-worker -type f \( -name '*.js' -o -name '*.mjs' \) -exec node --check {} \;
      - name: Test owner access, quote confirmation and private archive
        run: node --test tests/lab*.test.mjs
      - name: Export source-only verification bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab-source-verification
          retention-days: 1
          path: |
            lab/*.html
            lab/*.css
            lab/*.js
            lab/README.md
            lab-worker/*.mjs
            lab-worker/*.sql
            lab-worker/*.toml
            lab-worker/migrations/*.sql
            tests/lab*.mjs
            js/pv-auth.js

  gallery-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            lab
            tests
            js/pv-auth.js
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned browser test runtime
        run: |
          npm install --prefix /tmp/pv-lab-browser --no-audit --no-fund playwright@1.62.1
          /tmp/pv-lab-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify built-in Berlin Rave references on desktop and mobile
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-lab-browser/node_modules/playwright/index.mjs
        run: node tests/lab-berlin-rave-browser.mjs
      - name: Verify smart Elements @mentions without any paid generation
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-lab-browser/node_modules/playwright/index.mjs
        run: node tests/lab-elements-smart-browser.mjs
      - name: Verify desktop and mobile gallery, original downloads and account cache
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-lab-browser/node_modules/playwright/index.mjs
        run: node tests/lab-image-viewer-browser.mjs
      - name: Retain Video card control previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-card-control-previews
          path: test-results/video-card-controls-*.png
          retention-days: 1

  kling-worker-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Build exact Worker bundle without deploying
        run: |
          cd lab-worker
          npx --yes wrangler@4 deploy --dry-run --outdir ../.pv-kling-worker-build
          test -s ../.pv-kling-worker-build/worker.js || test -s ../.pv-kling-worker-build/worker.mjs
      - name: Upload Worker bundle for direct reviewed Cloudflare deployment
        uses: actions/upload-artifact@v4
        with:
          name: pvlab-kling-903-worker-bundle
          path: .pv-kling-worker-build/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true
      - name: Stage temporary compressed bundle on PR branch for Cloudflare connection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64,gzip,pathlib
          p=pathlib.Path('.pv-kling-worker-build/worker.js')
          if not p.exists(): p=pathlib.Path('.pv-kling-worker-build/worker.mjs')
          encoded=base64.b64encode(gzip.compress(p.read_bytes(),compresslevel=9)).decode('ascii')
          out=pathlib.Path('.pv-release-transfer')
          out.mkdir(exist_ok=True)
          for i in range(0,len(encoded),180000):
              (out/f'kling-903-{i//180000:03d}.txt').write_text(encoded[i:i+180000])
          (out/'manifest.json').write_text(__import__('json').dumps({'source_sha':'${{ github.event.pull_request.head.sha }}','bytes':p.stat().st_size,'parts':(len(encoded)+179999)//180000}))
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add .pv-release-transfer
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: stage temporary reviewed Worker bundle for direct deployment"
          git push origin HEAD:refs/heads/${{ github.head_ref }}
