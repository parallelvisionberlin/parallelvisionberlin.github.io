name: Lab asset library tests
on:
  push:
    paths: ['lab/assets.*', 'lab/lab.js', 'lab/index.html', 'lab/studio.html', 'lab/landing.*', 'lab/video-refresh.css', 'lab-worker/asset-library.mjs', 'tests/lab-assets*', 'tests/lab-reference-mode*', 'tests/lab-image-models*', 'tests/lab-image-runtime*', 'lab-worker/image-models.mjs', 'lab/reference-guidance.js', '.github/workflows/lab-assets-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/lab-assets.test.mjs
      - run: node --test tests/lab-reference-mode.test.mjs
      - run: node tests/lab-image-models.test.mjs
      - run: npm install --no-save --package-lock=false playwright miniflare@4
      - run: node tests/lab-image-runtime.mjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/lab-assets-ui.cjs
        env:
          CODEX_PRIMARY_RUNTIME_NODE_MODULES: '${{ github.workspace }}/node_modules'
