name: ALTER 20-look gallery review
on:
  push:
    branches: [feature/alter-twenty-looks-four-card-gallery-20261107]
    paths: [.github/workflows/alter-gallery-20-review.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Preserve unrelated main work and lock existing photo treatment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --depth=100
          git merge --no-ff --no-commit origin/main
          sha256sum lab/visuals/beauty/atelier/hero.webp lab/beauty-editorial-final.css lab/beauty-flow-refinement.css lab/beauty-panel-widen-20261107.css lab/beauty-approved-20261029.js lab/beauty.js lab/beauty-settings.js > /tmp/alter-locked.sha256
      - name: Apply only seven supplied-image gallery cards and responsive layout
        run: |
          curl --fail --silent --show-error --location 'https://at.adobe.com/MiIBMWgxKQHwLZ3h' -o /tmp/alter-gallery.zip
          echo 'db05882931e649984d7ae2815cbc88c7c336f09175b4566197a5500668629cb6  /tmp/alter-gallery.zip' | sha256sum --check
          mkdir -p /tmp/alter-gallery-package
          unzip -q /tmp/alter-gallery.zip -d /tmp/alter-gallery-package
          python3 /tmp/alter-gallery-package/apply.py
          sha256sum --check /tmp/alter-locked.sha256
          node --check lab/beauty-look-catalog.js
          node --check tests/lab-beauty-ui.mjs
          node --check tests/lab-beauty-gallery-twenty.test.mjs
          git diff --check
      - name: All 20 looks, existing editor, Image and native Worker quote safety
        run: |
          node --test tests/lab-beauty-gallery-twenty.test.mjs tests/lab-beauty-archive-curation.test.mjs tests/lab-beauty-atelier.test.mjs tests/lab-beauty-category-contract.test.mjs tests/lab-beauty.test.mjs tests/lab-approved-image-ui-contract.test.mjs
          node --test --test-name-pattern='Beauty Studio binds' tests/lab-worker.test.mjs
      - name: Pinned browser runtime
        run: |
          npm install --prefix /tmp/pv-beauty --no-audit --no-fund playwright@1.57.0
          node /tmp/pv-beauty/node_modules/playwright/cli.js install chromium
      - name: Complete Studio and ALTER desktop / phone browser QA, including four-plus-peek
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-beauty/node_modules/playwright/index.mjs
        run: |
          node tests/lab-studios-menu-ui.mjs
          node tests/lab-beauty-ui.mjs
      - name: Scope-check and commit exact reviewed gallery files
        run: |
          test "$GITHUB_REF" = refs/heads/feature/alter-twenty-looks-four-card-gallery-20261107
          git add lab/beauty.html lab/beauty-look-catalog.js lab/beauty-gallery-20261107.css tests/lab-beauty-ui.mjs tests/lab-beauty-archive-curation.test.mjs tests/lab-beauty-gallery-twenty.test.mjs tests/lab-beauty-atelier.test.mjs lab/visuals/beauty/atelier/archive-*-20261107.webp
          python3 - <<'PY'
          import subprocess
          changed=set(subprocess.check_output(['git','diff','--name-only','origin/main'],text=True).splitlines())
          expected={'lab/beauty.html','lab/beauty-look-catalog.js','lab/beauty-gallery-20261107.css','tests/lab-beauty-ui.mjs','tests/lab-beauty-archive-curation.test.mjs','tests/lab-beauty-gallery-twenty.test.mjs','tests/lab-beauty-atelier.test.mjs'}
          expected|={'lab/visuals/beauty/atelier/archive-'+s+'-20261107.webp' for s in ['goldenhour','skinstudy','windowstudy','softfocus','velvet','silverhalo','windblown']}
          assert changed==expected,(changed-expected,expected-changed)
          PY
          git diff --check
          git commit -m 'Expand ALTER photographic archive to twenty functional looks with four-card gallery'
          git push origin HEAD:refs/heads/feature/alter-twenty-looks-four-card-gallery-20261107
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alter-twenty-looks-visual-review
          path: |
            test-results/beauty-fit-*.png
            test-results/beauty-category-*.png
          retention-days: 3
