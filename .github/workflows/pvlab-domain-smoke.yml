name: PV LAB domain live readiness
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pvlab-domain-smoke.yml'
      - 'lab/welcome.html'
      - 'lab/welcome.js'
      - 'lab/session-request.js'
      - 'lab/studio.html'
      - 'lab/customer-entry.js'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check public new and legacy site
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --retry-delay 2 --max-time 20 \
            "https://parallelvisionlabel.com/lab/connect-account.html" -o /tmp/old-link.html
          grep -Fq 'Keep your work.' /tmp/old-link.html
          grep -Fq './connect-account.js?v=' /tmp/old-link.html
          curl -fsSL --retry 2 --retry-delay 2 --max-time 20 \
            "https://pvlab-studio.pages.dev/connect-account.html" -o /tmp/new-link.html
          grep -Fq 'Link existing account' /tmp/new-link.html
          curl -fsSL --retry 2 --retry-delay 2 --max-time 20 \
            "https://pvlab-studio.pages.dev/" -o /tmp/home.html
          grep -Fq 'Fashion.' /tmp/home.html
          echo "PASS: old website, Cloudflare Pages, and secure transfer entry published."
      - name: Verify first-sign-in welcome is published on the custom domain
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 12); do
            if curl -fsSL --connect-timeout 6 --max-time 20 "https://pvlab.studio/welcome.html?verify=20261015" -o /tmp/live-welcome.html \
              && curl -fsSL --connect-timeout 6 --max-time 20 "https://pvlab.studio/welcome.js?verify=20261015" -o /tmp/live-welcome.js \
              && curl -fsSL --connect-timeout 6 --max-time 20 "https://pvlab.studio/session-request.js?verify=20261015" -o /tmp/live-session-request.js \
              && grep -Fq 'id="credit-toast"' /tmp/live-welcome.html \
              && grep -Fq 'Enter the Studio' /tmp/live-welcome.html \
              && grep -Fq '200 credits added' /tmp/live-welcome.html \
              && ! grep -Fq 'YOUR WELCOME GIFT' /tmp/live-welcome.html \
              && grep -Fq 'showCreditToast()' /tmp/live-welcome.js \
              && grep -Fq '/api/migration/new' /tmp/live-welcome.js \
              && grep -Fq "new URL('/welcome.html',origin)" /tmp/live-session-request.js; then
              ready=1
              break
            fi
            echo "Cloudflare Pages welcome has not reached the custom domain (attempt $attempt)."
            sleep 15
          done
          if [ "$ready" != "1" ]; then
            echo 'FAIL: new-account welcome files were not confirmed on pvlab.studio.'
            exit 1
          fi
          echo 'PASS: pvlab.studio serves the new welcome and first-sign-in routing assets.'
      - name: Verify deployed backend migration and domain-origin preflight
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --retry-delay 2 --max-time 20 \
            "https://parallel-vision-lab.parallelvision.workers.dev/health" -o /tmp/health.json
          node -e "const x=require('/tmp/health.json');if(!x.ok||x.version!=='pv-lab-2026-10-15.1-studio-account-linking')process.exit(1);console.log('PASS backend version',x.version)"
          curl -fsSL --retry 2 --max-time 20 -X OPTIONS \
            -H 'Origin: https://pvlab.studio' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization' \
            -D /tmp/cors-head -o /dev/null \
            "https://parallel-vision-lab.parallelvision.workers.dev/api/session"
          grep -Eiq '^access-control-allow-origin: https://pvlab.studio' /tmp/cors-head
          echo 'PASS: new-domain CORS allows only the configured PV LAB frontend.'
      - name: Report custom domain status without declaring it active
        shell: bash
        run: |
          set +e
          status="$(curl -LsS --connect-timeout 6 --max-time 12 -o /tmp/root.html -w '%{http_code}' 'https://pvlab.studio/')"
          echo "pvlab.studio HTTP status: $status"
          if [ "$status" = "200" ] && grep -Fq 'Fashion.' /tmp/root.html; then
            echo 'PV LAB public home appears to be connected.'
          else
            echo 'Custom domain is not confirmed. Finish the Cloudflare Pages custom-domain setup.'
          fi
