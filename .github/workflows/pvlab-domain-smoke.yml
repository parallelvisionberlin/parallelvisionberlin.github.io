name: PV LAB domain live readiness
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pvlab-domain-smoke.yml'
      - 'lab/welcome.html'
      - 'lab/welcome.js'
      - 'lab/session-request.js'
      - 'lab/studio.html'
      - 'lab/_redirects'
      - 'lab/lab/studio.html'
      - 'lab/customer-entry.js'
      - 'lab/index.html'
      - 'lab/lab.js'
      - 'lab/studio-credit-toast.css'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check public new and legacy site
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --retry-delay 2 --max-time 20 \
            "https://parallelvisionlabel.com/lab/connect-account.html" -o /tmp/old-link.html
          grep -Fq 'Keep your work.' /tmp/old-link.html
          grep -Fq './connect-account.js?v=' /tmp/old-link.html
          curl -fsSL --retry 2 --retry-delay 2 --max-time 20 \
            "https://pvlab-studio.pages.dev/connect-account.html" -o /tmp/new-link.html
          grep -Fq 'Link existing account' /tmp/new-link.html
          curl -fsSL --retry 2 --retry-delay 2 --max-time 20 \
            "https://pvlab-studio.pages.dev/" -o /tmp/home.html
          grep -Fq 'Fashion.' /tmp/home.html
          echo "PASS: old website, Cloudflare Pages, and secure transfer entry published."
      - name: Verify direct Studio welcome and canonical hero
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 12); do
            if curl -fsSL --connect-timeout 6 --max-time 20 "https://pvlab.studio/welcome?verify=20261015" -o /tmp/live-legacy-welcome.html \
              && curl -fsSL --connect-timeout 6 --max-time 20 "https://pvlab.studio/studio.html?verify=20261015" -o /tmp/live-studio.html \
              && curl -fsSL --connect-timeout 6 --max-time 20 "https://pvlab.studio/studio?tool=image&verify=20261015-canonical" -o /tmp/live-canonical-studio.html \
              && curl -fsSL --connect-timeout 6 --max-time 20 "https://pvlab.studio/studio?tool=fashion&verify=20261015-splash-lock" -o /tmp/live-fashion-studio.html \
              && curl -fsSL --connect-timeout 6 --max-time 20 "https://pvlab.studio/studio-credit-toast.css?verify=20261015" -o /tmp/live-toast.css \
              && curl -fsSL --connect-timeout 6 --max-time 20 "https://pvlab.studio/session-request.js?verify=20261015" -o /tmp/live-session-request.js \
              && curl -fsSL --connect-timeout 6 --max-time 20 "https://pvlab.studio/lab.js?verify=20261015-direct-tool" -o /tmp/live-studio-js \
              && curl -fsSL --connect-timeout 6 --max-time 20 "https://parallelvisionlabel.com/lab/?verify=20261015" -o /tmp/live-old-entry.html \
              && curl -fsSL --connect-timeout 6 --max-time 20 "https://pvlab.studio/?verify=20261015" -o /tmp/live-root.html \
              && grep -Fq "location.replace('./studio.html?tool=image')" /tmp/live-legacy-welcome.html \
              && grep -Fq 'id="pv-credit-toast"' /tmp/live-studio.html \
              && grep -Fq '<div class="lab-boot-architecture" aria-hidden="true">' /tmp/live-studio.html \
              && grep -Fq 'pv-architecture-reveal' /tmp/live-studio.html \
              && ! grep -Fq 'lab-boot-fluid' /tmp/live-studio.html \
              && grep -Fq '#lab-boot{position:fixed;inset:0;width:100vw;' /tmp/live-studio.html \
              && grep -Fq 'pv-boot-dismiss .24s ease-out both' /tmp/live-studio.html \
              && grep -Fq 'id="history-preview-toggle"' /tmp/live-studio.html \
              && grep -Fq 'image-discreet.css?v=20261017-transient-message1' /tmp/live-studio.html \
              && grep -Fq 'image-discreet.js?v=20261017-transient-message1' /tmp/live-studio.html \
              && grep -Fq 'image-moods-return.css?v=20261017-hidden-inspiration1' /tmp/live-studio.html \
              && curl -fsSL --connect-timeout 6 --max-time 20 "https://pvlab.studio/image-discreet.js?verify=20261017-transient-message1" -o /tmp/live-image-discreet.js \
              && grep -Fq 'pv-lab-image-previews-hidden-v1' /tmp/live-image-discreet.js \
              && grep -Fq 'setTimeout(()=>{noticeTimer=null;dismissNotice();},1600)' /tmp/live-image-discreet.js \
              && curl -fsSL --connect-timeout 6 --max-time 20 "https://pvlab.studio/image-moods-return.css?verify=20261017-hidden-inspiration1" -o /tmp/live-image-moods-return.css \
              && grep -Fq 'html.pv-image-previews-hidden #app.image-studio-active #history-moods-toggle' /tmp/live-image-moods-return.css \
              && curl -fsSL --connect-timeout 6 --max-time 20 "https://pvlab.studio/image-discreet.css?verify=20261017-transient-message1" -o /tmp/live-image-discreet.css \
              && grep -Fq 'pv-image-previews-hidden' /tmp/live-image-discreet.css \
              && grep -Fq 'grid-template-columns:54px 62px 12px 34px' /tmp/live-image-discreet.css \
              && grep -Fq '#history-preview-toggle{' /tmp/live-image-discreet.css \
              && grep -Fq 'grid-column:4;grid-row:1;justify-self:end' /tmp/live-image-discreet.css \
              && grep -Fq '.image-discreet-message svg{' /tmp/live-image-discreet.css \
              && grep -Fq "font:600 12px/1.5 'DM Sans'" /tmp/live-image-discreet.css \
              && grep -Fq 'visibility:hidden!important' /tmp/live-image-discreet.css \
              && grep -Fq 'radial-gradient(ellipse 115% 85%' /tmp/live-image-discreet.css \
              && grep -Fq 'id="gate"' /tmp/live-canonical-studio.html \
              && grep -Fq 'canonicalStudio=20261015-1' /tmp/live-canonical-studio.html \
              && grep -Fq 'pv-studio-route-pending' /tmp/live-canonical-studio.html \
              && grep -Fq '<html lang="en" class="pv-studio-boot-lock">' /tmp/live-fashion-studio.html \
              && grep -Fq 'html.pv-studio-boot-lock{scroll-behavior:auto!important}' /tmp/live-fashion-studio.html \
              && grep -Fq "history.scrollRestoration='manual';" /tmp/live-fashion-studio.html \
              && grep -Fq "document.documentElement.classList.add('pv-studio-route-pending')" /tmp/live-studio-js \
              && grep -Fq "document.documentElement.classList.add('pv-studio-boot-lock')" /tmp/live-studio-js \
              && grep -Fq "browser.pathname!=='/studio'" /tmp/live-session-request.js \
              && grep -Fq 'pv-credit-toast.is-visible' /tmp/live-toast.css \
              && grep -Fq '/api/migration/new' /tmp/live-session-request.js \
              && grep -Fq "location.replace('https://pvlab.studio/'" /tmp/live-old-entry.html \
              && grep -Fq 'visuals/leather-editorial/hero-desktop.webp' /tmp/live-root.html \
              && ! grep -Fq 'YOUR WELCOME GIFT' /tmp/live-legacy-welcome.html; then
              ready=1
              break
            fi
            echo "PV LAB Pages direct entry still publishing (attempt $attempt)."
            sleep 15
          done
          if [ "$ready" != "1" ]; then
            echo 'FAIL: the old-domain redirect and direct Studio toast were not both verified live.'
            exit 1
          fi
          echo 'PASS: old PV LAB landing forwards to the new domain; Studio handles welcome toast.'
      - name: Verify new Generate and Exact layout assets reached pvlab.studio
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 12); do
            curl -fsSL --connect-timeout 6 --max-time 20 \
              "https://pvlab.studio/studio?tool=image&verify=20261016-f02906" \
              -o /tmp/live-pv-studio-exact.html || true
            if grep -Fq 'assets.css?v=20261016-exact-tooltip4' /tmp/live-pv-studio-exact.html \
              && grep -Fq 'studio-finish-v2.css?v=20261016-generate-always3' /tmp/live-pv-studio-exact.html \
              && grep -Fq 'id="composer-exact-prompt-option"' /tmp/live-pv-studio-exact.html; then
              curl -fsSL --connect-timeout 6 --max-time 20 \
                "https://pvlab.studio/studio-finish-v2.css?v=20261016-generate-always3" \
                -o /tmp/live-pv-generate-style.css || true
              curl -fsSL --connect-timeout 6 --max-time 20 \
                "https://pvlab.studio/assets.css?v=20261016-exact-tooltip4" \
                -o /tmp/live-pv-toolbar-style.css || true
              if grep -Fq 'visibility:visible;' /tmp/live-pv-generate-style.css \
                && ! grep -Fq 'visibility:hidden}' /tmp/live-pv-generate-style.css \
                && grep -Fq '.composer-controls #composer-exact-prompt-option' /tmp/live-pv-toolbar-style.css \
                && grep -Fq '.composer-exact-tooltip' /tmp/live-pv-toolbar-style.css; then
                echo "PASS: canonical PV LAB Studio serves permanent Generate and aligned Exact assets."
                ready=1
                break
              fi
            fi
            echo "Waiting for PV LAB custom domain to serve updated Generate/Exact design (attempt $attempt)."
            sleep 10
          done
          if [ "$ready" != 1 ]; then echo "FAIL: custom domain is serving stale Generate or Exact assets."; exit 1; fi
      - name: Verify shared legacy Studio URL opens the correct page
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 12); do
            final="$(curl -sSL --connect-timeout 6 --max-time 16 \
              -o /tmp/pv-legacy-studio.html -w '%{url_effective}' \
              'https://pvlab.studio/lab/studio?tool=image&utm_source=chatgpt.com')" || true
            if [[ "$final" == https://pvlab.studio/studio* ]]; then
              echo "PASS: old link redirects to $final"
              ready=1
              break
            fi
            if grep -Fq 'PV LAB legacy Studio alias' /tmp/pv-legacy-studio.html \
              && grep -Fq 'window.location.replace(next.href)' /tmp/pv-legacy-studio.html; then
              echo "PASS: old link serves dedicated no-dependency redirect shim."
              ready=1
              break
            fi
            echo "Old Studio URL still serves the wrong document (attempt $attempt, final ${final:-unknown})."
            sleep 10
          done
          if [ "$ready" != 1 ]; then echo 'FAIL: old Studio path did not load the redirect shim or forward to canonical Studio.'; exit 1; fi
      - name: Verify deployed backend migration and domain-origin preflight
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --retry-delay 2 --max-time 20 \
            "https://parallel-vision-lab.parallelvision.workers.dev/health" -o /tmp/health.json
          node -e "const x=require('/tmp/health.json');const v=String(x.version||'');const m=v.match(/^pv-lab-(\d{4}-\d{2}-\d{2})\.(\d+)-/);if(!x.ok||!m||m[1]<'2026-10-15'||(m[1]==='2026-10-15'&&Number(m[2])<1)){console.error('FAIL: incompatible backend health version',v);process.exit(1)}console.log('PASS backend version',v)"
          curl -fsSL --retry 2 --max-time 20 -X OPTIONS \
            -H 'Origin: https://pvlab.studio' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization' \
            -D /tmp/cors-head -o /dev/null \
            "https://parallel-vision-lab.parallelvision.workers.dev/api/session"
          grep -Eiq '^access-control-allow-origin: https://pvlab.studio' /tmp/cors-head || { echo 'FAIL: PV LAB production CORS origin missing'; exit 1; }
          echo 'PASS: new-domain CORS allows only the configured PV LAB frontend.'
      - name: Report custom domain status without declaring it active
        shell: bash
        run: |
          set +e
          status="$(curl -LsS --connect-timeout 6 --max-time 12 -o /tmp/root.html -w '%{http_code}' 'https://pvlab.studio/')"
          echo "pvlab.studio HTTP status: $status"
          if [ "$status" = "200" ] && grep -Fq 'Fashion.' /tmp/root.html; then
            echo 'PV LAB public home appears to be connected.'
          else
            echo 'Custom domain is not confirmed. Finish the Cloudflare Pages custom-domain setup.'
          fi
