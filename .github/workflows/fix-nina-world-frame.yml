name: Fix Nina world frame

on:
  push:
    paths:
      - '.github/workflows/fix-nina-world-frame.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore full world image framing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('nina-project.html')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(r"\n\s*/\* NINA_WORLD_DESKTOP_COMPACT_20260906.*?@media \(min-width: 901px\) \{.*?\n\s*\}\n\s*", re.S)
          replacement = "\n\n    /* NINA_WORLD_DESKTOP_BALANCED_20260906 */\n    @media (min-width: 901px) {\n      .n-world {\n        width: 94%;\n        max-width: 1390px;\n        height: auto;\n        aspect-ratio: auto;\n        margin: 0 auto;\n        overflow: visible;\n      }\n      .n-world img {\n        display: block;\n        width: 100%;\n        height: auto;\n        object-fit: contain;\n        object-position: center;\n      }\n      .n-world-note {\n        width: 94%;\n        max-width: 1390px;\n        margin: 14px auto 56px;\n        padding-top: 14px;\n      }\n    }\n"
          new_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected to replace one old Nina world block, replaced {count}')
          path.write_text(new_text, encoding='utf-8')
          PY

      - name: Commit change and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/fix-nina-world-frame.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nina-project.html .github/workflows/fix-nina-world-frame.yml
          git commit -m "Restore Nina world image framing"
          git push
