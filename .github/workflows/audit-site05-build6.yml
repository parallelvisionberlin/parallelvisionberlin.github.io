name: Read-only Site05 build 6 verification
on:
  push:
    branches: [audit-site05-build5]
    paths: ['.github/workflows/audit-site05-build6.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public build metadata and IPA without executing application code
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, html, json, os, pathlib, plistlib, re, tempfile, urllib.request, urllib.parse, zipfile
          build_id='f0bed316-e29e-408a-bf40-2d3baa42a829'
          report={'build_id':build_id,'operation':'Read-only inspection; no app code, Worker, EAS build or account modified','verified':False}
          headers={'User-Agent':'ParallelVision-Build-Verification','Accept':'application/json'}
          try:
            query='query ($buildId: ID!) { builds { byId(buildId: $buildId) { id status appVersion appBuildVersion appIdentifier artifacts { buildUrl applicationArchiveUrl } } } }'
            req=urllib.request.Request('https://api.expo.dev/graphql',data=json.dumps({'query':query,'variables':{'buildId':build_id}}).encode(),headers={**headers,'Content-Type':'application/json'})
            meta={}
            try:
              with urllib.request.urlopen(req,timeout=25) as r: payload=json.load(r)
              meta=((payload.get('data') or {}).get('builds') or {}).get('byId') or {}
            except Exception as e: report['metadata_attempt']=type(e).__name__
            artifact=(meta.get('artifacts') or {}).get('applicationArchiveUrl') or (meta.get('artifacts') or {}).get('buildUrl')
            if not artifact:
              page='https://expo.dev/accounts/parallel63/projects/parallel-vision/builds/'+build_id
              with urllib.request.urlopen(urllib.request.Request(page,headers={'User-Agent':'Mozilla/5.0'}),timeout=25) as r: text=r.read(10000000).decode('utf-8')
              text=html.unescape(text).replace('\\/','/').replace('\\u0026','&')
              candidates=re.findall(r'https://expo\.dev/artifacts/eas/[A-Za-z0-9_-]+\.ipa',text)
              if len(set(candidates))==1: artifact=candidates[0]
            if not artifact: raise RuntimeError('Public metadata did not expose the installation archive. Do not infer package contents.')
            u=urllib.parse.urlparse(artifact)
            if u.scheme!='https' or not (u.hostname=='expo.dev' or u.hostname.endswith('.expo.dev')): raise RuntimeError('Unexpected initial artifact origin')
            with tempfile.TemporaryDirectory() as d:
              archive=pathlib.Path(d)/'build6.ipa'
              with urllib.request.urlopen(urllib.request.Request(artifact,headers={'User-Agent':'ParallelVision-Build-Verification'}),timeout=60) as r,archive.open('wb') as out:
                count=0
                while True:
                  block=r.read(1048576)
                  if not block: break
                  count+=len(block)
                  if count>300*1048576: raise RuntimeError('Archive exceeds inspection limit')
                  out.write(block)
              with zipfile.ZipFile(archive) as z:
                names=z.namelist()
                plists=[n for n in names if n.startswith('Payload/') and n.endswith('.app/Info.plist') and n.count('/')==2]
                if len(plists)!=1: raise RuntimeError('Expected one app Info.plist')
                info=plistlib.loads(z.read(plists[0]))
                report.update(version=info.get('CFBundleShortVersionString'),build_number=info.get('CFBundleVersion'),identifier=info.get('CFBundleIdentifier'))
                markers=['SITE COHESION / 05.1','native-account','REDEEM CODE','Berlin 2063 motorbike and city film']
                report['markers']={m:False for m in markers}
                report['bundle_sha256']=[]
                for n in names:
                  if n.endswith(('main.jsbundle','.hbc')) and z.getinfo(n).file_size<20000000:
                    b=z.read(n)
                    report['bundle_sha256'].append(hashlib.sha256(b).hexdigest())
                    for m in markers: report['markers'][m] |= m.encode() in b
                expected={'berlin_city':'171751015a40394583d899236b7bf732efe41ea0','nina_room':'b1fd4a52f1a0c74d7a70baf4d6aa92819e3fb880'}
                report['canonical_films']={k:False for k in expected}
                report['video_files']=[]
                for n in names:
                  if n.lower().endswith('.mp4') and z.getinfo(n).file_size<30000000:
                    b=z.read(n);sha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
                    report['video_files'].append({'bytes':len(b),'git_blob_sha':sha})
                    for k,v in expected.items(): report['canonical_films'][k] |= sha==v
                report['verified']=report['identifier']=='com.parallelvision.app' and str(report['build_number'])=='6' and all(report['canonical_films'].values()) and all(report['markers'].values())
          except Exception as e: report['error']=str(e)[:300]
          text=json.dumps(report,indent=2)
          print('BUILD6_AUDIT_BEGIN\n'+text+'\nBUILD6_AUDIT_END')
          pathlib.Path('/tmp/build6-verification.json').write_text(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f: f.write('## Build 6 verification\n\n```json\n'+text+'\n```\n')
          if not report['verified']: raise SystemExit('Archive verification was not established. Refer to report; do not infer success.')
          PY
      - name: Save sanitized report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build6-verification
          path: /tmp/build6-verification.json
          retention-days: 3
