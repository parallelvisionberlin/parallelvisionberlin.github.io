name: PV LAB live authentication diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pvlab-auth-live-diagnostics.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Inspect published public sites without credentials
        shell: bash
        run: |
          set -uo pipefail
          probe(){
            local label="$1" url="$2" out="$3"
            local code
            code="$(curl -LsS --retry 2 --retry-delay 1 --connect-timeout 8 --max-time 25 -o "$out" -w '%{http_code}' "$url")" || code="network-error"
            printf '%s: %s\n' "$label" "$code"
            printf '%s\n' "$code" > "$out.status"
          }
          probe "pvlab.studio homepage" "https://pvlab.studio/" /tmp/pv-custom-home
          probe "pvlab.studio account SDK" "https://pvlab.studio/native-account.js" /tmp/pv-custom-account
          probe "Pages default homepage" "https://pvlab-studio.pages.dev/" /tmp/pv-pages-home
          probe "Pages default account SDK" "https://pvlab-studio.pages.dev/native-account.js" /tmp/pv-pages-account
          probe "Clerk account portal" "https://accounts.pvlab.studio/sign-in" /tmp/pv-portal
          probe "Clerk Frontend API environment" "https://clerk.pvlab.studio/v1/environment" /tmp/pv-clerk
          probe "Legacy site homepage" "https://parallelvisionlabel.com/lab/" /tmp/pv-legacy-home
          for entry in "Custom:/tmp/pv-custom-account" "Pages:/tmp/pv-pages-account"; do
            label="${entry%%:*}"
            path="${entry#*:}"
            if [ "$(cat "$path.status")" = "200" ]; then
              if cmp -s "$path" lab/native-account.js; then
                echo "$label account SDK: EXACT MATCH with repo"
              else
                echo "$label account SDK: NOT CURRENT (different from repo)"
                echo "$label public SDK sha256: $(sha256sum "$path" | cut -d' ' -f1)"
                echo "Repository SDK sha256: $(sha256sum lab/native-account.js | cut -d' ' -f1)"
              fi
            fi
          done
          for entry in "Custom:/tmp/pv-custom-home" "Pages:/tmp/pv-pages-home"; do
            label="${entry%%:*}"
            path="${entry#*:}"
            if [ "$(cat "$path.status")" = "200" ]; then
              if grep -Fq 'providerPolicy=20261015-google-only1' "$path"; then
                echo "$label homepage: new auth provider cache marker PRESENT"
              else
                echo "$label homepage: new auth provider cache marker MISSING"
              fi
            fi
          done
      - name: Check browser sign-in entry and Google OAuth redirect without an account
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix /tmp/pv-auth --no-audit --no-fund playwright@1.62.1
          /tmp/pv-auth/node_modules/.bin/playwright install --with-deps chromium
          cat > /tmp/pv-auth-check.mjs <<'EOF'
          import {chromium} from '/tmp/pv-auth/node_modules/playwright/index.mjs';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1420,height:900}});
          page.on('pageerror',e=>console.log('Browser JS error category:',e.name));
          try {
            const response=await page.goto('https://pvlab.studio/',{waitUntil:'domcontentloaded',timeout:30000});
            console.log('PV LAB browser homepage status:',response?.status());
            if(response?.status()!==200)process.exitCode=1;
            else{
              const signin=page.locator('#lab-header-signin');
              await signin.waitFor({state:'visible',timeout:20000});
              await signin.click();
              const google=page.getByRole('button',{name:/google/i}).first();
              await google.waitFor({state:'visible',timeout:20000});
              console.log('Google social sign-in control: VISIBLE');
              console.log('GitHub social sign-in visible:',await page.getByRole('button',{name:/github/i}).first().isVisible().catch(()=>false));
              await google.click();
              await page.waitForTimeout(3500);
              const final=new URL(page.url());
              console.log('After clicking Google, current HOST only:',final.hostname);
              const errorText=await page.getByText('Unable to complete action at this time',{exact:false}).count();
              console.log('Clerk generic failure visible:',Boolean(errorText));
            }
          }catch(err){console.log('PUBLIC SIGN-IN CHECK FAILED:',err.name,err.message.slice(0,250));process.exitCode=1;}
          finally{await browser.close()}
          EOF
          node /tmp/pv-auth-check.mjs

      - name: Check Clerk Account Portal on a fresh browser
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pv-clerk-portal-check.mjs <<'EOF'
          import {chromium} from '/tmp/pv-auth/node_modules/playwright/index.mjs';
          import {readFileSync} from 'node:fs';
          const env=JSON.parse(readFileSync('/tmp/pv-clerk','utf8'));
          const auth=env.auth_config??{};
          console.log('Clerk public environment keys:',Object.keys(env).sort().join(','));
          console.log('Clerk public auth mode:',auth.sign_up?.mode??auth.sign_up_mode??'not exposed');
          console.log('Clerk public application display name:',env.display_config?.application_name??env.display_config?.instance_environment_type??'not exposed');
          const browser=await chromium.launch({headless:true});
          try{
            for(const route of ['sign-up','sign-in']){
              const context=await browser.newContext({viewport:{width:1380,height:850}});
              const page=await context.newPage();
              const errors=[];
              page.on('response',resp=>{
                let url;
                try{url=new URL(resp.url())}catch{return}
                if((url.hostname==='clerk.pvlab.studio'||url.hostname==='accounts.pvlab.studio')&&
                    (/\/v1\/(client|environment|sign_ins|sign_ups)/.test(url.pathname)||resp.status()>=400)){
                    if(errors.length<15)errors.push({host:url.hostname,path:url.pathname,status:resp.status()});
                }
              });
              const src='https://accounts.pvlab.studio/'+route+'?sign_in_fallback_redirect_url=https%3A%2F%2Fpvlab.studio%2F&sign_up_fallback_redirect_url=https%3A%2F%2Fpvlab.studio%2F';
              try{
                const response=await page.goto(src,{waitUntil:'domcontentloaded',timeout:25000});
                await page.waitForTimeout(5000);
                console.log(route+' portal HTTP status:',response?.status());
                console.log(route+' fresh portal generic error visible:',await page.getByText('Unable to complete action at this time',{exact:false}).first().isVisible().catch(()=>false));
                console.log(route+' Google button visible:',await page.getByRole('button',{name:/google/i}).first().isVisible().catch(()=>false));
                console.log(route+' Clerk endpoint statuses:',JSON.stringify(errors));
                if(route==='sign-up'&&await page.getByRole('button',{name:/google/i}).first().isVisible().catch(()=>false)){
                  await page.getByRole('button',{name:/google/i}).first().click();
                  await page.waitForTimeout(5000);
                  const location=new URL(page.url());
                  console.log('Fresh portal Google redirect host:',location.hostname);
                  if(location.hostname==='accounts.google.com'){
                    const title=await page.title().catch(()=>'');
                    console.log('Google page title hints:',title.slice(0,80));
                    console.log('Google 400 error visible:',await page.getByText(/Error 400|invalid_request|redirect_uri_mismatch|Access blocked/i).first().isVisible().catch(()=>false));
                  }
                }
              }catch(e){console.log(route+' browser test:',e.name,e.message.slice(0,240));}
              finally{await context.close()}
            }
          }finally{await browser.close()}
          EOF
          node /tmp/pv-clerk-portal-check.mjs

      - name: Live Studio Image and Video boot watchdog
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f /tmp/pv-auth/node_modules/playwright/index.mjs || npm install --prefix /tmp/pv-auth --no-audit --no-fund playwright@1.62.1
          /tmp/pv-auth/node_modules/.bin/playwright install chromium
          cat > /tmp/pv-studio-boot-check.mjs <<'EOF'
          import {chromium} from '/tmp/pv-auth/node_modules/playwright/index.mjs';
          const browser=await chromium.launch({headless:true});
          try{
            for(const tool of ['image','video']){
              const page=await browser.newPage({viewport:{width:1440,height:900}});
              const exceptions=[],failedRequests=[],httpErrors=[];
              page.on('pageerror',error=>exceptions.push(String(error.stack||error).slice(0,1100)));
              page.on('requestfailed',req=>{if(failedRequests.length<12)failedRequests.push({host:new URL(req.url()).hostname,path:new URL(req.url()).pathname,reason:req.failure()?.errorText});});
              page.on('response',response=>{if(response.status()>=400&&httpErrors.length<12)httpErrors.push({host:new URL(response.url()).hostname,path:new URL(response.url()).pathname,status:response.status()});});
              try{
                const response=await page.goto('https://pvlab.studio/studio?tool='+tool,{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(20000);
                const state=await page.evaluate(()=>{
                  const boot=document.getElementById('lab-boot'),app=document.getElementById('app'),gate=document.getElementById('gate'),retry=document.getElementById('lab-boot-retry');
                  const css=boot?getComputedStyle(boot):null;
                  return {root:document.documentElement.className,body:document.body.className,overlay:!!boot&&css.display!=='none'&&css.visibility!=='hidden'&&Number(css.opacity)>0.05,overlayOpacity:css?.opacity,appHidden:app?.hidden,gateHidden:gate?.hidden,retryHidden:retry?.hidden,bootStatus:document.getElementById('lab-boot-status')?.textContent,href:location.pathname+location.search};
                });
                console.log('PV LAB live Studio',tool,'HTTP',response?.status(),'state',JSON.stringify(state));
                console.log('PV LAB live Studio',tool,'exceptions',JSON.stringify(exceptions),'networkFailures',JSON.stringify(failedRequests),'httpErrors',JSON.stringify(httpErrors));
                if(response?.status()!==200||state.overlay)process.exitCode=1;
              }catch(error){
                console.log('PV LAB live Studio',tool,'NAVIGATION FAILURE',String(error.stack||error).slice(0,800));
                process.exitCode=1;
              }finally{await page.close();}
            }
          }finally{await browser.close();}
          EOF
          node /tmp/pv-studio-boot-check.mjs
