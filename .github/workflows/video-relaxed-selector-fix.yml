name: Repair Video layout selector
on:
  push:
    branches: [codex/video-relaxed-20261024]
    paths: [.github/workflows/video-relaxed-selector-fix.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'parallelvisionberlin/parallelvisionberlin.github.io' && github.ref == 'refs/heads/codex/video-relaxed-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/video-relaxed-20261024
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Use the existing visible CSS selectors without reconstructing them
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('tests/lab-studio-layout-ui.mjs');s=p.read_text()
          lines=s.splitlines(keepends=True)
          matches=[i for i,line in enumerate(lines) if re.search(r'const\s+point\s*=\s*await\s+x\.page\.evaluate\(selector',line)]
          assert len(matches)==1,('Expected one wheel target position statement',matches)
          i=matches[0]
          print('Replacing:',lines[i].rstrip())
          context=''.join(lines[max(0,i-5):i+3])
          assert "'.controls>.generate-zone'" in context and "'#video-inspector'" in context,context
          indent=re.match(r'\s*',lines[i]).group()
          lines[i]=(indent+"const rect=await x.page.locator(selector).boundingBox();\n"+
                    indent+"assert.ok(rect,'Wheel target is visible: '+selector);\n"+
                    indent+"const point={x:rect.x+Math.min(90,rect.width/2),y:rect.y+Math.min(24,rect.height/2)};\n")
          p.write_text(''.join(lines))
          PY
          node --check tests/lab-studio-layout-ui.mjs
          node --test tests/lab-video-relaxed.test.mjs tests/lab-video-compact.test.mjs tests/lab-video-approved-design.test.mjs tests/lab-approved-image-ui-contract.test.mjs
          git diff --check
          git diff -- tests/lab-studio-layout-ui.mjs
      - name: Exercise full layout and original scrolling assertions
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-selector-check/node_modules/playwright/index.mjs
        run: |
          npm install --prefix /tmp/pv-selector-check --no-audit --no-fund playwright@1.57.0
          node /tmp/pv-selector-check/node_modules/playwright/cli.js install chromium --only-shell
          node tests/lab-studio-layout-ui.mjs
      - name: Commit only the verified test correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = 'tests/lab-studio-layout-ui.mjs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/lab-studio-layout-ui.mjs
          git commit -m 'Use visible target bounds in Video wheel regression without altering scroll assertions'
          git push origin HEAD:codex/video-relaxed-20261024
          echo "VERIFIED_HEAD=$(git rev-parse HEAD)"
