name: Agency public launch verification
on:
  push:
    branches: [agency/public-launch-20261025]
    paths:
      - '.github/workflows/agency-public-launch.yml'
      - 'scripts/agency-launch-payload.*'
permissions:
  contents: write
concurrency:
  group: agency-public-launch-20261025
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/agency/public-launch-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact reviewed patch and apply in isolated checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib,subprocess
          files=sorted(Path('scripts').glob('agency-launch-payload.*'))
          assert len(files)==5
          data=base64.b64decode(''.join(p.read_text() for p in files),validate=True)
          assert hashlib.sha256(data).hexdigest()=='1a0d0b782008909a0f7651b2df50fe5b96d4dc7b86614ac2f4b9f9e73b8c4194'
          patch=gzip.decompress(data)
          subprocess.run(['git','apply','--check'],input=patch,check=True)
          subprocess.run(['git','apply','--index'],input=patch,check=True)
          PY
      - name: Install verification dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Correct intrinsic image dimensions and capture loaded artwork
        run: |
          node --input-type=module <<'JS'
          import sharp from 'sharp';
          import {readFile,writeFile} from 'node:fs/promises';
          import assert from 'node:assert/strict';
          const meta=await sharp('assets/optimized/LOOK03.webp').metadata();
          const html=await readFile('index.html','utf8');
          const target='<img src="./assets/optimized/LOOK03.webp" alt="Sculptural chrome fashion from Parallel Vision\'s Fashion After Fabric project" loading="lazy" decoding="async">';
          assert.equal(html.split(target).length,2);
          await writeFile('index.html',html.replace(target,target.replace('>',` width="${meta.width}" height="${meta.height}">`)));
          console.log('Homepage image intrinsic size:',meta.width,meta.height);
          const path='tests/agency-browser-smoke.mjs';let test=await readFile(path,'utf8');
          test=test.replace("    await page.screenshot({path:'agency-test-artifacts/agency-'", "    await page.locator('img').evaluateAll(async images=>{images.forEach(image=>image.loading='eager');await Promise.all(images.map(image=>image.decode().catch(()=>{})));});\n    assert.deepEqual(await page.locator('img').evaluateAll(images=>images.filter(image=>!image.naturalWidth).map(image=>image.getAttribute('src'))),[],'agency artwork failed to load');\n    await page.screenshot({path:'agency-test-artifacts/agency-'");
          test=test.replace("    await page.locator('#agency').scrollIntoViewIfNeeded();", "    if(await toggle.isVisible())await toggle.click();\n    await page.locator('#agency').scrollIntoViewIfNeeded();\n    await page.locator('#agency img').evaluate(image=>image.decode());");
          await writeFile(path,test);
          JS
          git add index.html tests/agency-browser-smoke.mjs
      - name: Build preview and run enquiry regressions
        run: |
          node scripts/agency-social-image.mjs
          node --test tests/agency-enquiries.test.mjs
          node --check agency/agency.js
          node --check agency/inbox.js
          node --check lab-worker/agency-enquiries.mjs
          node --check lab-worker/worker.mjs
          npm run build
      - name: Verify desktop, phone, retry and signed-out behavior
        run: |
          python3 -m http.server 8799 --bind 127.0.0.1 >/tmp/agency-http.log 2>&1 &
          node tests/agency-browser-smoke.mjs
      - name: Prepare reviewed source commit without publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,json,base64,subprocess,urllib.request,re
          old=subprocess.check_output(['git','show','HEAD:agency/index.html']).decode()
          new=Path('agency/index.html').read_text()
          pattern=r'<section class="hero"[\s\S]*?</section>'
          assert re.search(pattern,old).group()==re.search(pattern,new).group(),'Original agency hero changed'
          p=Path('agency/WORK-STATE.md'); text=p.read_text()
          text=text.replace('- Pending: review rendered screenshots, merge verified branch, confirm public custom-domain content and API status.', '- Chromium checks passed at 1440, 390 and 320px, including failure/retry receipts and signed-out inbox.\n- Static build and all 15 SQLite-backed enquiry tests passed in the launch workflow.\n- Pending: visual screenshot review, merge and production custom-domain/API verification.')
          p.write_text(text)
          subprocess.run(['git','add','agency/WORK-STATE.md','assets/optimized/agency/agency-social-20261025.jpg'],check=True)
          payloads=sorted(str(p) for p in Path('scripts').glob('agency-launch-payload.*'))
          subprocess.run(['git','rm','.github/workflows/agency-public-launch.yml',*payloads],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          entries=[]
          repo=os.environ['GITHUB_REPOSITORY']; parent=os.environ['GITHUB_SHA']
          def api(path,data):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=45) as response:return json.load(response)
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().strip('\0').split('\0')
          allowed={'.github/workflows/agency-checks.yml','.github/workflows/deploy-lab-worker.yml','.github/workflows/agency-public-launch.yml','index.html','language.js','sitemap.xml','lab/owner.html','lab-worker/worker.mjs','lab-worker/agency-enquiries.mjs','lab-worker/migrations/0040-agency-enquiries.sql','css/agency-feature.css','scripts/agency-social-image.mjs','tests/agency-enquiries.test.mjs','tests/agency-browser-smoke.mjs','assets/optimized/agency/agency-social-20261025.jpg',*payloads}
          for path in paths:
              assert path.startswith('agency/') or path in allowed,path
              if not Path(path).exists():entries.append({'path':path,'mode':'100644','type':'blob','sha':None});continue
              content=subprocess.check_output(['git','show',':'+path])
              blob=api('/git/blobs',{'content':base64.b64encode(content).decode(),'encoding':'base64'})
              entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=api('/git/trees',{'base_tree':subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip(),'tree':entries})
          commit=api('/git/commits',{'message':'Launch public agency with project stories, direct enquiries and private inbox','tree':tree['sha'],'parents':[parent]})
          result={'source_commit':commit['sha'],'parent':parent,'tree':tree['sha'],'files':paths,'tests':'15 unit tests, static build, Chromium 1440/390/320px and signed-out inbox passed','no_live_test_enquiries':True}
          Path('agency-test-artifacts/source-commit.json').write_text(json.dumps(result,indent=2))
          print('SOURCE_COMMIT='+commit['sha'])
          PY
      - name: Collect visual review assets
        if: always()
        run: |
          mkdir -p agency-test-artifacts
          cp assets/optimized/agency/agency-social-20261025.jpg agency-test-artifacts/ 2>/dev/null || true
          cp /tmp/agency-http.log agency-test-artifacts/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agency-launch-review
          path: agency-test-artifacts/
          retention-days: 3
