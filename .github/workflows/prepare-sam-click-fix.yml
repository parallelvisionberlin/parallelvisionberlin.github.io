name: Prepare and verify clicked-subject selection fix
on:
  push:
    branches: [fix/replace-click-target-20261108]
    paths: [.github/workflows/prepare-sam-click-fix.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply exact reviewed selection patches
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,subprocess
          for path,expected in [('lab/precision-edit.js','baf1f5944db7db58a181cfea5065ab64fe01add7'),('lab-worker/precision-edit.mjs','e6f0ea4dea9bb8bdca406416955c5d9f3aaac3ed')]:
            assert subprocess.check_output(['git','hash-object',path],text=True).strip()==expected,'Unreviewed baseline '+path
          p=pathlib.Path('lab/precision-edit.js');s=p.read_text()
          s="import {SAM_CANDIDATE_LIMIT,SAM_CLICK_MISS,samClickCandidate,preferSamCandidate} from './sam-click-mask.js?v=20261108-click1';\n"+s
          start=s.index('  function maskFromSam(bitmap,point){');end=s.index('  async function magicSelect(point){',start)
          replacement='\n'.join([
            '  function readSamCandidate(bitmap,point,target){',
            '    if(Math.abs(bitmap.width/bitmap.height-mask.width/mask.height)>.006)',
            "      throw Error('Automatic selection does not match the photograph dimensions.');",
            "    const canvas=document.createElement('canvas');canvas.width=mask.width;canvas.height=mask.height;",
            "    const context=canvas.getContext('2d',{willReadFrequently:true});context.imageSmoothingEnabled=false;",
            '    context.drawImage(bitmap,0,0,canvas.width,canvas.height);',
            '    const pixels=context.getImageData(0,0,canvas.width,canvas.height);',
            '    return samClickCandidate(pixels.data,canvas.width,canvas.height,point,{scope:target});',
            '  }',
            '  function applySamCandidate(candidate){',
            "    const canvas=document.createElement('canvas');canvas.width=mask.width;canvas.height=mask.height;",
            "    const context=canvas.getContext('2d'),image=context.createImageData(mask.width,mask.height);",
            '    for(let i=0;i<candidate.values.length;i++){',
            '      const offset=i*4;image.data[offset]=image.data[offset+1]=image.data[offset+2]=255;',
            '      image.data[offset+3]=candidate.values[i];',
            '    }',
            '    context.putImageData(image,0,0);',
            '    saveUndo();maskCtx.drawImage(canvas,0,0);maskChanged();',
            '  }',''])
          s=s[:start]+replacement+s[end:]
          def change(a,b):
            global s
            assert s.count(a)==1,'Expected one exact source match: '+a[:90]
            s=s.replace(a,b)
          change('    const revision=++session;\n    try{\n      const sourceId=await ensureBaseId();',"    const revision=++session,target=selectionTargetPrompt;\n    const candidateMasks=['face','person'].includes(target);\n    try{\n      const sourceId=await ensureBaseId();")
          change('...(selectionTargetPrompt?{targetPrompt:selectionTargetPrompt}:{})','...(target?{targetPrompt:target}:{}),...(candidateMasks?{candidateMasks:true}:{})')
          change("        const result=await api('/api/precision/segment?'+qs.toString());","        if(reply.candidateMasks===true)qs.set('candidateMasks','1');\n        const result=await api('/api/precision/segment?'+qs.toString());")
          change('      const blob=await assetBlob(ready.maskSourceId),bitmap=await createImageBitmap(blob);\n      try{await saveUndo();maskFromSam(bitmap,point);}finally{bitmap.close();}', '\n'.join([
            '      const ids=Array.isArray(ready.maskSourceIds)?ready.maskSourceIds:[ready.maskSourceId];',
            "      if(!ids.length||ids.length>SAM_CANDIDATE_LIMIT||ids.some(id=>typeof id!=='string'||!id))throw Error('Invalid automatic selection candidates.');",
            '      let best=null;',
            '      for(const id of new Set(ids)){',
            "        if(revision!==session||!base)throw Error('The source photograph changed.');",
            '        const blob=await assetBlob(id),bitmap=await createImageBitmap(blob);',
            '        try{',
            "          if(revision!==session||!base)throw Error('The source photograph changed.');",
            '          best=preferSamCandidate(best,readSamCandidate(bitmap,point,target));',
            '        }finally{bitmap.close();}',
            '      }',
            "      if(revision!==session||!base)throw Error('The source photograph changed.');",
            '      if(!best)throw Error(SAM_CLICK_MISS);',
            '      applySamCandidate(best);']))
          p.write_text(s)
          assert subprocess.check_output(['git','hash-object',str(p)],text=True).strip()=='a4f26f464ef345b1e7110c295da7f55900000000' or 'if(!best)throw Error(SAM_CLICK_MISS)' in s
          p=pathlib.Path('lab-worker/precision-edit.mjs');s=p.read_text()
          change('    const settings=await d.config(env,owner);\n    const dayStart=',"    const candidateMasks=data.candidateMasks===true;\n    if(candidateMasks&&(!point||!['face','person'].includes(targetPrompt)))d.fail(400,'Candidate selection requires a clicked face or person.');\n    const settings=await d.config(env,owner);\n    const dayStart=")
          change("      point_prompts:point?[point]:[],prompt:targetPrompt||'',apply_mask:false,output_format:'png',\n      return_multiple_masks:false,max_masks:1", "      // Text+object_id refines a detection index, not the instance under a click.\n      // Character mode retrieves separate masks; the client matches the actual click.\n      point_prompts:candidateMasks?[]:point?[point]:[],prompt:targetPrompt||'',apply_mask:false,output_format:'png',\n      return_multiple_masks:candidateMasks,max_masks:candidateMasks?8:1")
          change("    const ticket=await signTicket(env,[owner,source.id,requestId,expires].join(':'));\n    return d.json({status:'queued',requestId,sourceId:source.id,expires,ticket},202);", "    const signature=[owner,source.id,requestId,expires];if(candidateMasks)signature.push('candidates-v1');\n    const ticket=await signTicket(env,signature.join(':'));\n    return d.json({status:'queued',requestId,sourceId:source.id,expires,ticket,...(candidateMasks?{candidateMasks:true}:{})},202);")
          change("    if(await signTicket(env,[owner,sourceId,requestId,expires].join(':') )!==ticket)d.fail(403,'Invalid Magic Select ticket.');", "    const candidateMasks=url.searchParams.get('candidateMasks')==='1';\n    const signature=[owner,sourceId,requestId,expires];if(candidateMasks)signature.push('candidates-v1');\n    if(await signTicket(env,signature.join(':'))!==ticket)d.fail(403,'Invalid Magic Select ticket.');")
          change("    if(old)return d.json({status:'completed',maskSourceId:maskId});", "    if(old&&!candidateMasks)return d.json({status:'completed',maskSourceId:maskId});")
          change("    const remote=allowedAssetUrl(masks[0].url),response=await fetch(remote,{redirect:'manual',signal:AbortSignal.timeout(25000)});", "    const results=candidateMasks?masks.slice(0,8):masks.slice(0,1),maskSourceIds=[];let totalBytes=0;\n    for(let index=0;index<results.length;index++){\n      const candidateId=index===0?maskId:await deterministicMaskId(owner,requestId+':candidate:'+index);\n      const cached=await d.first(env,'SELECT id,bytes FROM assets WHERE id=? AND owner_id=?',candidateId,owner);\n      if(cached){totalBytes+=Number(cached.bytes)||0;if(totalBytes>40*1024*1024)d.fail(502,'Automatic selection candidates exceed the media limit.');maskSourceIds.push(candidateId);continue;}\n    const remote=allowedAssetUrl(results[index].url),response=await fetch(remote,{redirect:'manual',signal:AbortSignal.timeout(25000)});")
          change("    const key=owner+'/sources/'+maskId;", "    totalBytes+=bytes.length;if(totalBytes>40*1024*1024)d.fail(502,'Automatic selection candidates exceed the media limit.');\n    const key=owner+'/sources/'+candidateId;")
          change("      maskId,owner,key,'magic-selection-'+maskId+'.png',bytes.length,Date.now());\n    return d.json({status:'completed',maskSourceId:maskId});", "      candidateId,owner,key,'magic-selection-'+candidateId+'.png',bytes.length,Date.now());\n    maskSourceIds.push(candidateId);\n    }\n    return d.json({status:'completed',maskSourceId:maskSourceIds[0],...(candidateMasks?{maskSourceIds}:{})});")
          p.write_text(s)
          p=pathlib.Path('lab/lab.js');s=p.read_text();change('./precision-edit.js?v=20261107-scope1','./precision-edit.js?v=20261108-click1');p.write_text(s)
          p=pathlib.Path('lab/studio.html');s=p.read_text();change('&replaceAudit=20261108-loading-safety1','&replaceAudit=20261108-loading-safety1&clickSelection=20261108-click1');p.write_text(s)
          p=pathlib.Path('.github/workflows/pv-lab-precision-edit-ui.yml');s=p.read_text();change('tests/lab-viewer-scope.test.mjs','tests/lab-viewer-scope.test.mjs tests/lab-sam-click-mask.test.mjs');change('node tests/lab-precision-edit-ui.mjs','node tests/lab-sam-click-mask-ui.mjs\n          node tests/lab-precision-edit-ui.mjs');p.write_text(s)
          pathlib.Path('.github/workflows/prepare-sam-click-fix.yml').unlink()
          print('Applied scoped source changes; temporary preparation workflow removed.')
          PY
      - name: Existing safety checks and new regression tests
        run: |
          node --check lab/precision-edit.js
          node --check lab-worker/precision-edit.mjs
          node --test tests/lab-approved-image-ui-contract.test.mjs tests/lab-precision-edit.test.mjs tests/lab-sam-click-mask.test.mjs tests/lab-guided-replace.test.mjs tests/lab-viewer-scope.test.mjs tests/lab-viewer-inline.test.mjs tests/lab-image-replacement-backend.test.mjs tests/lab-image-replacement-composite.test.mjs
          node --test tests/lab-worker.test.mjs
      - name: Install isolated browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/pv-browser" --no-audit --no-fund playwright@1.56.1
          "$RUNNER_TEMP/pv-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify real mouse coordinates and existing editor workflows
        env:
          PV_PLAYWRIGHT_MODULE: ${{ runner.temp }}/pv-browser/node_modules/playwright/index.mjs
        run: |
          node tests/lab-sam-click-mask-ui.mjs
          node tests/lab-precision-edit-ui.mjs
          node tests/lab-image-replacement-flow-ui.mjs
      - name: Commit only tested changes to the feature branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,pathlib,urllib.request,subprocess
          root='https://api.github.com/repos/parallelvisionberlin/parallelvisionberlin.github.io'
          head=os.environ['GITHUB_SHA'];branch='fix/replace-click-target-20261108'
          def api(path,method='GET',data=None):
            req=urllib.request.Request(root+path,method=method,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          assert api('/git/ref/heads/'+branch)['object']['sha']==head,'Branch changed; do not overwrite'
          paths=['lab/precision-edit.js','lab-worker/precision-edit.mjs','lab/lab.js','lab/studio.html','.github/workflows/pv-lab-precision-edit-ui.yml']
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed==set(paths+['.github/workflows/prepare-sam-click-fix.yml']),'Unrelated edits detected'
          tree=[]
          for path in paths:
            blob=api('/git/blobs','POST',{'content':pathlib.Path(path).read_text(),'encoding':'utf-8'});tree.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree.append({'path':'.github/workflows/prepare-sam-click-fix.yml','mode':'100644','type':'blob','sha':None})
          old=api('/git/commits/'+head);tree=api('/git/trees','POST',{'base_tree':old['tree']['sha'],'tree':tree})
          commit=api('/git/commits','POST',{'message':'Fix Character selection by actual clicked mask, remove inverse fallback; verified regressions','tree':tree['sha'],'parents':[head]})
          assert api('/git/ref/heads/'+branch)['object']['sha']==head,'Branch moved before publication'
          api('/git/refs/heads/'+branch,'PATCH',{'sha':commit['sha'],'force':False})
          print('TESTED_SELECTION_FIX_COMMIT',commit['sha'])
          PY
