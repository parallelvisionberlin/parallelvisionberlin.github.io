name: Connect PV LAB Pages domain
# Manual-only until the Cloudflare API token is granted Pages + DNS permissions.
# Production Worker deployments must not be marked failed by an unrelated DNS task.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify safe domain-connection script
        run: node --check .github/scripts/connect-pvlab-pages.mjs
      - name: Attach pvlab.studio to Pages without touching Parallel Vision DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/scripts/connect-pvlab-pages.mjs
