name: Connect PV LAB Pages domain
on:
  workflow_run:
    workflows: ["Deploy Parallel Vision Lab Worker"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  connect:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify safe domain-connection script
        run: node --check .github/scripts/connect-pvlab-pages.mjs
      - name: Attach pvlab.studio to Pages without touching Parallel Vision DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/scripts/connect-pvlab-pages.mjs
