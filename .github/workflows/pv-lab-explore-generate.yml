name: PV Lab Explore Generate
on:
  pull_request:
    paths:
      - 'lab/mood-references.js'
      - 'lab/mood-references/**'
      - 'lab/moods.js'
      - 'lab/app-mood-generation.js'
      - 'lab/explore-moods*'
      - 'lab/moods.html'
      - 'lab/lab.js'
      - 'tests/lab-mood-references.test.mjs'
      - 'tests/lab-explore-generation.mjs'
      - 'tests/lab-native-mobile-ui.mjs'
      - 'tests/lab-app-discovery.mjs'
      - '.github/workflows/pv-lab-explore-generate.yml'
  push:
    branches: [main, codex/mood-generate]
    paths:
      - 'lab/explore-moods*'
      - 'lab/moods.html'
      - 'lab/app-mood-generation.js'
      - 'lab/mood-handoff.js'
      - 'lab/mood-references.js'
      - 'lab/mood-references/**'
      - 'lab/moods.js'
      - 'lab/lab.js'
      - 'lab/studio.html'
      - 'tests/lab-explore-generation.mjs'
      - 'tests/lab-mood-handoff.test.mjs'
      - '.github/workflows/pv-lab-explore-generate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify one-shot generation handoffs
        run: node --test tests/lab-mood-handoff.test.mjs tests/lab-mood-references.test.mjs
      - name: Install browser
        timeout-minutes: 3
        run: |
          npm install --prefix /tmp/pv-mood-generate --no-save playwright@1.62.1
          test -x /opt/google/chrome/chrome
          cat > /tmp/pv-mood-generate/chromium.mjs <<'JS'
          import {chromium as engine} from './node_modules/playwright/index.mjs';
          export const chromium={executablePath:()=>process.env.PV_CHROMIUM_EXECUTABLE,launch:options=>engine.launch({...options,executablePath:process.env.PV_CHROMIUM_EXECUTABLE})};
          JS
      - name: Check desktop, mobile, sign-in, pricing and single submission
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-mood-generate/chromium.mjs
          PV_CHROMIUM_EXECUTABLE: /opt/google/chrome/chrome
        run: |
          node tests/lab-explore-generation.mjs
          node tests/lab-native-mobile-ui.mjs
          node tests/lab-app-discovery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pv-explore-generate-preview
          path: /tmp/pv-explore-generation/*.png
          retention-days: 2
