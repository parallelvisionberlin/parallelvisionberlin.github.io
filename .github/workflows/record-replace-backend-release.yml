name: Record verified Replace backend release
on:
  push:
    branches: [verify/replace-audit-published-20261108]
    paths: ['.github/workflows/record-replace-backend-release.yml']
permissions:
  contents: write
  actions: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 64b9e080df47854a6b5ee1fde1451ddc0fed3058
          persist-credentials: false
      - name: Update only the existing scoped handoff and validated Owner record
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,pathlib,datetime,subprocess
          base='https://api.github.com/repos/parallelvisionberlin/parallelvisionberlin.github.io'
          head='64b9e080df47854a6b5ee1fde1451ddc0fed3058'
          proof='https://github.com/parallelvisionberlin/parallelvisionberlin.github.io/actions/runs/42465480595'
          release='https://github.com/parallelvisionberlin/parallelvisionberlin.github.io/actions/runs/42465335692'
          preflight='https://github.com/parallelvisionberlin/parallelvisionberlin.github.io/actions/runs/42465081108'
          version='e939d968-afd1-4432-a9ed-a7a128a472b2'
          def api(path,method='GET',data=None):
            req=urllib.request.Request(base+path,method=method,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=20) as r:return json.load(r)
          verified=api('/actions/runs/42465480595')
          assert verified['conclusion']=='success' and verified['head_sha']=='122104398c57788cfb4880ce5bdb19cdb9874de6','Live verification did not pass'
          assert api('/git/ref/heads/main')['object']['sha']==head,'Main moved; reconcile rather than overwriting'
          now=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z')
          p=pathlib.Path('lab/owner-work-records.json');j=json.loads(p.read_text())
          r=next(x for x in j['records'] if x['id']=='image-viewer-replace-edit-actions')
          r['updatedAt']=now;r['status']='deployed';r['reviewedSha']=head
          r['summary']='Guided Image viewer Replace/Edit and faster saved Character loading are published. The previously pending Face/Whole person semantic SAM selection backend is now deployed and its code plus live health verified. Generation quality for complex overlapping people remains unverified and the unmasked replacement pipeline is not considered solved.'
          r['nextAction']='In the signed-in viewer, verify one Whole person torso selection. Then evaluate true mask-aware identity generation and the failed job raw output/mask before another complex paid replacement. Existing Cloudflare token is valid; do not ask owner to replace it.'
          r['blockers']=['Complex whole-person output quality remains unresolved: the current Seedream path does not receive a true inpainting mask.','Real-account selection and paid-provider result quality were not tested in this release.','The reported failed job raw output and mask remain unexamined.']
          r['deployment']={'state':'verified','sourceSha':head,'environment':'Cloudflare Pages pvlab.studio frontend; Cloudflare Worker parallel-vision-lab','observedAt':now,'evidenceUrl':proof,'limitations':['Frontend publication retains prior PR #926 proof. Worker version '+version+' is separately verified.','No real signed-in or paid-generation test was run. Whole-person mask-aware generation remains unresolved.','The first release job ended on a Python HTTP 403 health probe AFTER code deployment and exact-code/settings checks passed. A separate read-only curl health and active-version verification passed; no second deployment occurred.']}
          r['tests'].append({'label':'Worker release gate and live backend','result':'passed','scope':'447 existing deployment tests and 58 focused tests; exact compiled Worker match; active version verified; /health and music public status HTTP 200. No SQL migrations or provider jobs.'})
          if len(r['links'])<20 and not any(x['url']==proof for x in r['links']):r['links'].append({'label':'Face/Whole person backend live proof','url':proof})
          r['evidence'].append({'kind':'production_asset','summary':'Published pinned reviewed Worker code; confirmed version '+version+' serving 100%, semantic selection present, public health HTTP 200, and existing settings/resources preserved.','scope':'parallel-vision-lab backend, no database migrations or paid inference','source':proof,'observedAt':now,'limitations':['Does not establish image quality or a real signed-in selection result.']})
          j['updatedAt']=now;p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          q=pathlib.Path('lab/IMAGE-REPLACEMENT-WORK-STATE.md');text=q.read_text()
          note='\n'.join([
            '## Latest release status, 2026-11-08 (supersedes historical credential/deployment blockers)',
            '',
            '- Existing GitHub Cloudflare token was verified active with expected Worker/D1 access. No replacement, rotation or permission changes were needed. Earlier missing/unusable-token notes below were incorrect.',
            '- Reviewed source `'+head+'` passed all 447 tests from the existing production deployment gate plus 58 focused replacement/backend tests.',
            '- Code-only Worker deployment completed at 09:01:30 UTC, version `'+version+'`, serving 100% of traffic. Rollback predecessor: `b71347b9-3ffb-42dd-a4d9-83a542b11cea`.',
            '- Face/person/clothing semantic target forwarding is now present in production. The downloaded compiled code matched the reviewed build. Existing live variable values, secret bindings, D1/R2/AI/Images bindings were preserved. No SQL migrations or paid provider calls were executed.',
            '- Initial deployment job reported failure only at the final Python health probe (HTTP 403), after deploy and code/settings assertions passed. Separate read-only curl verification returned HTTP 200 for /health and /api/music/public/status, and independently confirmed the active version and semantic code. Do not rerun the deployment based on that initial red job.',
            '- Preflight: '+preflight,
            '- Deployment: '+release,
            '- Successful live verification: '+proof,
            '- Remaining: one real signed-in Whole person selection review; genuine mask-aware identity generation and output quality remain unresolved. Do not claim the bad Alma replacement or complex overlap quality is fixed. No paid image was generated during release verification.',
            '',
            '## Historical implementation and release notes',
            '',
            ''
          ])
          assert text.startswith('# Image replacement flow\n')
          q.write_text('# Image replacement flow\n\n'+note+text.split('\n',1)[1].lstrip())
          subprocess.run(['node','scripts/owner-work-state.mjs','validate'],check=True)
          subprocess.run(['node','--test','tests/owner-work-state.test.mjs'],check=True,stdout=subprocess.DEVNULL)
          old=api('/git/commits/'+head)
          entries=[]
          for path in [str(p),str(q)]:
            blob=api('/git/blobs','POST',{'content':pathlib.Path(path).read_text(),'encoding':'utf-8'})
            entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=api('/git/trees','POST',{'base_tree':old['tree']['sha'],'tree':entries})
          commit=api('/git/commits','POST',{'message':'[CF-Pages-Skip] Record verified Replace backend and corrected token access','tree':tree['sha'],'parents':[head]})
          assert api('/git/ref/heads/main')['object']['sha']==head,'Main changed before record publication; stop'
          api('/git/refs/heads/main','PATCH',{'sha':commit['sha'],'force':False})
          print('SCOPED_RELEASE_RECORD_SAVED',commit['sha'])
          print('Only lab/owner-work-records.json and lab/IMAGE-REPLACEMENT-WORK-STATE.md changed; application code untouched.')
          PY
