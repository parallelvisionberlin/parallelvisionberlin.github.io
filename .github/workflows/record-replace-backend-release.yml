name: Record verified Replace backend release
on:
  push:
    branches: [verify/replace-audit-published-20261108]
    paths: ['.github/workflows/record-replace-backend-release.yml']
permissions:
  contents: write
  actions: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 64b9e080df47854a6b5ee1fde1451ddc0fed3058
          persist-credentials: false
      - name: Save validated scoped release evidence without application changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request,pathlib,datetime,subprocess
          base='https://api.github.com/repos/parallelvisionberlin/parallelvisionberlin.github.io'
          head='64b9e080df47854a6b5ee1fde1451ddc0fed3058'
          proof='https://github.com/parallelvisionberlin/parallelvisionberlin.github.io/actions/runs/42465480595'
          version='e939d968-afd1-4432-a9ed-a7a128a472b2'
          def api(path,method='GET',data=None):
            req=urllib.request.Request(base+path,method=method,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=20) as response:return json.load(response)
          verified=api('/actions/runs/42465480595')
          assert verified['conclusion']=='success' and verified['head_sha']=='122104398c57788cfb4880ce5bdb19cdb9874de6','Live verification did not pass'
          assert api('/git/ref/heads/main')['object']['sha']==head,'Main moved; reconcile instead of overwriting'
          now=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          p=pathlib.Path('lab/owner-work-records.json');j=json.loads(p.read_text())
          r=next(x for x in j['records'] if x['id']=='image-viewer-replace-edit-actions')
          r['updatedAt']=now;r['status']='deployed';r['reviewedSha']=head
          r['summary']='Guided Replace/Edit and faster saved Character loading are published. The previously pending Face/Whole person semantic SAM selection backend is deployed and code/live health verified. Complex overlapping-person replacement quality remains unresolved.'
          r['nextAction']='Verify one Whole person torso selection in the signed-in viewer. Then evaluate true mask-aware identity generation and inspect the failed job raw output/mask before another complex paid replacement. Existing Cloudflare token is valid; no replacement is needed.'
          r['blockers']=['Current Seedream replacement still lacks a true inpainting-mask input; seams and overlapping limbs remain unresolved.','Real signed-in selection and paid-provider quality were not tested in this release.','The failed Alma job raw output and mask remain unexamined.']
          r['deployment']={'state':'verified','sourceSha':head,'environment':'Cloudflare Pages pvlab.studio frontend; Cloudflare Worker parallel-vision-lab','observedAt':now,'evidenceUrl':proof,'limitations':['Frontend retains prior PR #926 publication proof. Worker version '+version+' separately verified.','No real signed-in or paid-generation test. Whole-person output quality remains unresolved.','First release job failed at its Python HTTP 403 health probe after deployment and code/settings checks passed. Separate curl health and active-version verification passed; no second deployment.']}
          r['tests'].append({'label':'Worker release gate and live backend','result':'passed','scope':'447 unchanged deployment tests and 58 focused tests; exact compiled Worker match; active version verified; both public health endpoints HTTP 200. No migrations or paid generation.'})
          if len(r['links'])<20 and not any(x['url']==proof for x in r['links']):r['links'].append({'label':'Face/Whole person backend live proof','url':proof})
          r['evidence'].append({'kind':'production_asset','summary':'Pinned reviewed Worker published as '+version+' serving 100%; semantic selection code and live health verified; existing variables/resources preserved.','scope':'parallel-vision-lab code-only release','source':proof,'observedAt':now,'limitations':['No real signed-in or paid-provider quality test.']})
          j['updatedAt']=now;p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          q=pathlib.Path('lab/IMAGE-REPLACEMENT-WORK-STATE.md');text=q.read_text()
          lines=[
            '## Latest verified backend release: 2026-11-08',
            '',
            '- Supersedes historical credential blockers below: the existing Cloudflare token is active and has expected Worker/D1 access. No rotation or permission changes were needed. Earlier missing/unusable-token claims were incorrect.',
            '- Reviewed source: `'+head+'`. All 447 existing deployment-gate tests and 58 focused tests passed.',
            '- Code-only release at 09:01:30 UTC. Worker version `'+version+'` serves 100%. Previous rollback version: `b71347b9-3ffb-42dd-a4d9-83a542b11cea`.',
            '- Face/person/clothing semantic selection is now deployed. Published compiled code matched the reviewed build. Existing variable values, secrets and D1/R2/AI/Images bindings were preserved. No database migrations or paid generation calls.',
            '- The first release job failed only on its final Python health probe (HTTP 403), AFTER deployment and code/settings assertions passed. Separate read-only curl probes returned HTTP 200 and confirmed the active version. Do not redeploy because of the first red job.',
            '- Preflight: https://github.com/parallelvisionberlin/parallelvisionberlin.github.io/actions/runs/42465081108',
            '- Deployment: https://github.com/parallelvisionberlin/parallelvisionberlin.github.io/actions/runs/42465335692',
            '- Successful verification: '+proof,
            '- Remaining: real signed-in Whole person selection review; true mask-aware replacement generation and actual output quality. The failed Alma result is not fixed or quality-verified.',
            '',
            '## Historical implementation and release notes',
            '',
            ''
          ]
          assert text.startswith('# Image replacement flow\n')
          q.write_text('# Image replacement flow\n\n'+'\n'.join(lines)+text.split('\n',1)[1].lstrip())
          subprocess.run(['node','scripts/owner-work-state.mjs','validate'],check=True)
          subprocess.run(['node','--test','tests/owner-work-state.test.mjs'],check=True,stdout=subprocess.DEVNULL)
          old=api('/git/commits/'+head);entries=[]
          for path in [str(p),str(q)]:
            blob=api('/git/blobs','POST',{'content':pathlib.Path(path).read_text(),'encoding':'utf-8'})
            entries.append({'path':path,'mode':'100644','type':'blob','sha':blob['sha']})
          tree=api('/git/trees','POST',{'base_tree':old['tree']['sha'],'tree':entries})
          commit=api('/git/commits','POST',{'message':'[CF-Pages-Skip] Record verified Replace backend and corrected token access','tree':tree['sha'],'parents':[head]})
          assert api('/git/ref/heads/main')['object']['sha']==head,'Main changed before record publication; stop'
          api('/git/refs/heads/main','PATCH',{'sha':commit['sha'],'force':False})
          print('SCOPED_RELEASE_RECORD_SAVED',commit['sha'])
          print('Only two existing documentation files changed; application code untouched.')
          PY
