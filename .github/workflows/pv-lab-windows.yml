name: PV Lab Windows preparation
on:
  push:
    branches: [mobile-lab-moods, app-moods-v2]
    paths: ['mobile-app/**', '.github/workflows/pv-lab-windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.17.0'
      - name: Verify Windows preparation without a cloud build
        shell: powershell
        run: .\mobile-app\finish-lab02.ps1 -CheckOnly
