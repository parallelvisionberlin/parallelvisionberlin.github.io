name: ALTER Light Color preview-only verification
on:
  push:
    branches: [fix/alter-light-color-photo-previews-20261107]
    paths: [.github/workflows/alter-light-color-preview-review.yml]
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Import exact existing supplied portraits without generation
        run: |
          curl --fail --location --silent --show-error 'https://at.adobe.com/NHU8RvvOOBisLvwb' -o /tmp/alter-light-color.zip
          echo 'a5a63fa8a82b000c5b378be1846233b356eb2de8c97ab003a790de739d2e0b0a  /tmp/alter-light-color.zip' | sha256sum --check
          unzip -q /tmp/alter-light-color.zip -d /tmp/alter-lc-patch
          sha256sum lab/beauty-settings.js lab/beauty-approved-20261029.js lab/beauty-editorial-final.css lab/visuals/beauty/atelier/hero.webp > /tmp/alter-protected.sha256
          python3 /tmp/alter-lc-patch/apply.py
          cp /tmp/alter-lc-patch/test-assets.mjs tests/lab-beauty-light-color-previews.test.mjs
          sha256sum --check /tmp/alter-protected.sha256
          node --check tests/lab-beauty-light-color-previews.test.mjs
          node --check lab/beauty-look-catalog.js
          git diff --check
      - name: Original pricing and all 45 canonical setting contracts
        run: |
          node --test tests/lab-approved-image-ui-contract.test.mjs tests/lab-beauty.test.mjs tests/lab-beauty-atelier.test.mjs tests/lab-beauty-category-contract.test.mjs tests/lab-beauty-archive-curation.test.mjs tests/lab-beauty-light-color-previews.test.mjs
          node --test --test-name-pattern='Beauty Studio binds' tests/lab-worker.test.mjs
      - name: Verify original Beauty browser UI and responsive controls with intercepted requests
        run: |
          npm install --prefix /tmp/pv-beauty --no-audit --no-fund playwright@1.57.0
          node /tmp/pv-beauty/node_modules/playwright/cli.js install chromium
          PV_PLAYWRIGHT_MODULE=/tmp/pv-beauty/node_modules/playwright/index.mjs node tests/lab-beauty-ui.mjs
      - name: Save checked assets and exact two source-path edits on review branch only
        run: |
          test "$GITHUB_REF" = refs/heads/fix/alter-light-color-photo-previews-20261107
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lab/beauty.html lab/beauty-look-catalog.js tests/lab-beauty-light-color-previews.test.mjs lab/visuals/beauty/atelier/alter-light-*-20261107.webp lab/visuals/beauty/atelier/alter-color-*-20261107.webp
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          s=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert len(s)==19,s
          assert sum(p.endswith('.webp') for p in s)==16
          assert {p for p in s if not p.endswith('.webp')} == {'lab/beauty.html','lab/beauty-look-catalog.js','tests/lab-beauty-light-color-previews.test.mjs'}
          PY
          git commit -m 'Replace repeated ALTER Light and Color references with 16 selected photographs'
          git push origin HEAD:refs/heads/fix/alter-light-color-photo-previews-20261107
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alter-light-color-review-screenshots
          path: test-results/beauty-category-*.png
          retention-days: 3
