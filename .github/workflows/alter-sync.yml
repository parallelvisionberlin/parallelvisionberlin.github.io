name: ALTER scoped main reconciliation
on:
  push:
    branches: [implement/alter-approved-20261106]
    paths: [.github/workflows/alter-sync.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Preserve current main and upsert only ALTER record
        run: |
          test "$GITHUB_REF" = refs/heads/implement/alter-approved-20261106
          python3 - <<'PY'
          import json,pathlib
          data=json.loads(pathlib.Path('lab/owner-work-records.json').read_text())
          record=next(x for x in data['records'] if x['id']=='alter-tabbed-editor')
          pathlib.Path('/tmp/alter-record.json').write_text(json.dumps(record))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --depth=50
          git merge --no-ff --no-commit origin/main || {
            test "$(git diff --name-only --diff-filter=U)" = lab/owner-work-records.json
          }
          git show origin/main:lab/owner-work-records.json > lab/owner-work-records.json
          node scripts/owner-work-state.mjs upsert /tmp/alter-record.json
          node scripts/owner-work-state.mjs validate
          git add lab/owner-work-records.json
          git rm .github/workflows/alter-sync.yml
          git diff --cached --check
          node --test tests/lab-approved-image-ui-contract.test.mjs tests/lab-beauty.test.mjs tests/lab-beauty-atelier.test.mjs
          git commit -m 'Reconcile current main and retain all concurrent work records'
          git rev-parse HEAD
          git push origin HEAD:refs/heads/implement/alter-approved-20261106
