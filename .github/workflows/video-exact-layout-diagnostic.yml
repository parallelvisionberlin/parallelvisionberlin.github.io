name: Verify exact Video layout source
on:
  push:
    branches: [codex/video-relaxed-20261024]
    paths: [.github/workflows/video-exact-layout-diagnostic.yml]
permissions:
  contents: read
jobs:
  exact-layout:
    if: github.repository == 'parallelvisionberlin/parallelvisionberlin.github.io' && github.ref == 'refs/heads/codex/video-relaxed-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Record immutable checkout and exact failing-region source
        run: |
          git rev-parse HEAD
          git hash-object tests/lab-studio-layout-ui.mjs
          sha256sum tests/lab-studio-layout-ui.mjs
          nl -ba tests/lab-studio-layout-ui.mjs | sed -n '175,235p'
          grep -n 'querySelector\|const point\|boundingBox\|const target' tests/lab-studio-layout-ui.mjs
          node --check tests/lab-studio-layout-ui.mjs
      - name: Install pinned browser only
        run: |
          npm install --prefix /tmp/pv-exact-layout --no-audit --no-fund playwright@1.57.0
          node /tmp/pv-exact-layout/node_modules/playwright/cli.js install chromium --only-shell
      - name: Run unchanged full layout and scrolling test
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-exact-layout/node_modules/playwright/index.mjs
        run: node tests/lab-studio-layout-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-video-layout-evidence
          path: |
            tests/lab-studio-layout-ui.mjs
            test-results/lab-video-*.png
          retention-days: 2
