name: Upload PV Lab HD Mood Bank

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lab/mood-bank/2026-10-11/**'
      - 'scripts/upload-mood-bank.py'
      - '.github/workflows/upload-mood-bank.yml'

permissions:
  contents: read

concurrency:
  group: pv-lab-hd-mood-bank
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Upload and verify original mood images in R2
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '\r\n\t ')"
          test -n "$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          python3 scripts/upload-mood-bank.py
