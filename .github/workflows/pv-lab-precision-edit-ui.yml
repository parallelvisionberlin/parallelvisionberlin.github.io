name: PV Lab Precision Edit browser regression

on:
  push:
    branches: [main]
    paths:
      - 'lab/lab.js'
      - 'lab/precision-edit.js'
      - 'lab/selection-feedback.js'
      - 'lab/viewer-replacement-prompt.js'
      - 'tests/lab-viewer-replacement-prompt.test.mjs'
      - 'lab/sam-click-mask.js'
      - 'tests/lab-sam-click-mask*'
      - 'lab/image-viewer-editor.*'
      - 'lab/viewer-guided-replace.css'
      - 'lab/viewer-replacement-library.js'
      - 'tests/lab-guided-replace.test.mjs'
      - 'tests/lab-viewer-inline.test.mjs'
      - 'lab/image-replacement*.js'
      - 'lab/image-replacement.css'
      - 'lab-worker/image-replacement.mjs'
      - 'tests/lab-image-replacement*'
      - 'lab/precision-edit.css'
      - 'lab-worker/precision-edit.mjs'
      - 'tests/lab-precision-edit.test.mjs'
      - 'lab/studio.html'
      - 'tests/lab-precision-edit-ui.mjs'
      - 'tests/lab-image-oneclick-ui.mjs'
      - '.github/workflows/pv-lab-precision-edit-ui.yml'
  pull_request:
    paths:
      - 'lab/lab.js'
      - 'lab/precision-edit.js'
      - 'lab/selection-feedback.js'
      - 'lab/viewer-replacement-prompt.js'
      - 'tests/lab-viewer-replacement-prompt.test.mjs'
      - 'lab/sam-click-mask.js'
      - 'tests/lab-sam-click-mask*'
      - 'lab/image-viewer-editor.*'
      - 'lab/viewer-guided-replace.css'
      - 'lab/viewer-replacement-library.js'
      - 'tests/lab-guided-replace.test.mjs'
      - 'tests/lab-viewer-inline.test.mjs'
      - 'lab/image-replacement*.js'
      - 'lab/image-replacement.css'
      - 'lab-worker/image-replacement.mjs'
      - 'tests/lab-image-replacement*'
      - 'lab/precision-edit.css'
      - 'lab-worker/precision-edit.mjs'
      - 'tests/lab-precision-edit.test.mjs'
      - 'lab/studio.html'
      - 'tests/lab-precision-edit-ui.mjs'
      - 'tests/lab-image-oneclick-ui.mjs'
      - '.github/workflows/pv-lab-precision-edit-ui.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precision-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify production Worker supports Image replacement
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 5 --max-time 20 \
            https://parallel-vision-lab.parallelvision.workers.dev/health \
            | node -e "let raw=''; process.stdin.on('data',chunk=>raw+=chunk); process.stdin.on('end',()=>{ const health=JSON.parse(raw); if(health.ok!==true || health.imageReplacement!=='20261106-replacement1') { console.error('Production Worker is missing the reviewed replacement API'); process.exit(1); } console.log('Production Worker replacement marker verified'); });"
      - name: Verify Retouch signed pricing, JPEG consent and owner-only access
        run: node --test tests/lab-guided-replace.test.mjs tests/lab-viewer-scope.test.mjs tests/lab-sam-click-mask.test.mjs tests/lab-viewer-replacement-prompt.test.mjs tests/lab-viewer-inline.test.mjs tests/lab-precision-edit.test.mjs tests/lab-image-replacement-intent.test.mjs tests/lab-image-replacement-composite.test.mjs tests/lab-image-replacement-backend.test.mjs tests/lab-image-replacement-draft.test.mjs
      - name: Install Chromium for mocked UI verification
        run: |
          npm install --prefix /tmp/pv-precision-check --no-save playwright@1.57.0
          node /tmp/pv-precision-check/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify Magic Select, masking, price authorization, compositing and mobile layout
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-precision-check/node_modules/playwright/index.mjs
        run: |
          node tests/lab-sam-click-mask-ui.mjs
          node tests/lab-precision-edit-ui.mjs
      - name: Verify Image replacement selection and complete Studio flow
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-precision-check/node_modules/playwright/index.mjs
        run: |
          node tests/lab-image-replacement-ui.mjs
          node tests/lab-image-replacement-flow-ui.mjs
      - name: Verify Retouch routing, existing Base, browser Back and customer preview
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-precision-check/node_modules/playwright/index.mjs
          PV_RETOUCH_NAV_ONLY: '1'
        run: node tests/lab-image-oneclick-ui.mjs
      - name: Retain desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pv-precision-edit-preview
          path: |
            test-results/pv-precision-*.png
            test-results/pv-replacement-*.png
            test-results/pv-guided-*.png
            test-results/pv-viewer-*.png
          retention-days: 2
