name: Nina Conversation 02 Worker checks
on:
  push:
    branches: [nina-conversation02-worker]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve the newer website and Worker changes before applying alignment
        run: |
          git fetch --depth=1 origin 76d935dc60f16685a8121432d5e997f55926c0ce
          git restore --source=FETCH_HEAD -- anam-token-worker/src/index.js anam-token-worker/src/meta-capi.js anam-token-worker/src/web-conversation.js anam-token-worker/test/meta-capi.test.js anam-token-worker/test/web-conversion.test.js anam-token-worker/test/startup.test.js anam-token-worker/WEBSITE_CONVERSION_CHECKLIST.md anam-token-worker/migrations/20260909_nina_web_conversations.sql css/nina-access.css index.html js/nina-access.js js/nina-web-flow.js nina-project.html scripts/test-nina-web-browser.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/prepare-conversation02-worker.py')
          s=p.read_text()
          assert s.count('baa6287f141f608fc34204ffe3662e80d9a168b2')==1
          p.write_text(s.replace('baa6287f141f608fc34204ffe3662e80d9a168b2','a1281e0ff3ffbe5fe90dfcf745169091abf3e3d9'))
          PY
      - name: Install the existing pinned Worker dependencies
        working-directory: anam-token-worker
        run: npx --yes pnpm@10.15.1 install --frozen-lockfile --ignore-scripts
      - name: Record complete baseline test results before changing Worker source
        working-directory: anam-token-worker
        run: |
          mapfile -t files < <(find test -name '*.test.js' ! -name 'conversation02.test.js' | sort)
          set +e
          node --test --test-reporter=tap "${files[@]}" > ../conversation02-baseline.log 2>&1
          result=$?
          set -e
          test "$result" -le 1
          tail -10 ../conversation02-baseline.log
      - name: Apply narrow reviewed source patch
        run: python3 scripts/prepare-conversation02-worker.py
      - name: Require all focused alignment, identity and startup tests to pass
        working-directory: anam-token-worker
        run: |
          set -o pipefail
          npm run check
          node --check src/conversation-runtime.js
          node --test test/conversation02.test.js test/startup.test.js test/web-conversion.test.js | tee ../conversation02-focused.log
      - name: Run complete patched suite and reject new failures
        working-directory: anam-token-worker
        run: |
          set +e
          node --test --test-reporter=tap test/*.test.js > ../conversation02-tests.log 2>&1
          result=$?
          set -e
          test "$result" -le 1
          python3 - <<'PY'
          import re, json, pathlib
          def read(path):
              text=pathlib.Path(path).read_text()
              failures=re.findall(r'^\s*not ok \d+ - (.+)$',text,re.M)
              counts=dict(re.findall(r'^# (tests|pass|fail|cancelled|skipped) (\d+)$',text,re.M))
              assert counts and int(counts.get('cancelled','1'))==0, 'Incomplete test run'
              return {'counts':counts,'failures':sorted(failures)}
          baseline=read('../conversation02-baseline.log'); patched=read('../conversation02-tests.log')
          new=sorted(set(patched['failures'])-set(baseline['failures']))
          summary={'baseline':baseline,'patched':patched,'newFailures':new,'allTestsPass':not patched['failures']}
          pathlib.Path('../CONVERSATION02_TEST_SUMMARY.json').write_text(json.dumps(summary,indent=2))
          print(json.dumps(summary,indent=2))
          assert not new, 'The Worker alignment introduced a new failing test'
          assert int(patched['counts']['tests'])>int(baseline['counts']['tests']), 'New tests were not run'
          PY
      - name: Build Worker without deploying or using an Anam account
        working-directory: anam-token-worker
        run: npx --yes pnpm@10.15.1 exec wrangler deploy --dry-run --outdir /tmp/nina-worker-check
      - name: Verify unrelated files match the newer main commit
        run: |
          git diff --exit-code 76d935dc60f16685a8121432d5e997f55926c0ce -- anam-token-worker/pnpm-lock.yaml anam-token-worker/package.json anam-token-worker/wrangler.toml anam-token-worker/src/auth.js anam-token-worker/src/memory.js anam-token-worker/src/relationship.js anam-token-worker/src/credits.js anam-token-worker/src/live-usage.js anam-token-worker/src/stripe.js anam-token-worker/src/meta-capi.js anam-token-worker/src/web-conversation.js js mobile-app css index.html nina-project.html
          git diff --check
      - name: Record exact tested code on isolated branch
        run: |
          git config user.name 'Parallel Vision checks'
          git config user.email 'parallelvision.label@gmail.com'
          git add anam-token-worker css/nina-access.css index.html js/nina-access.js js/nina-web-flow.js nina-project.html scripts/test-nina-web-browser.py
          git commit -m 'Tested Conversation 02 Worker integrated with the newer website conversion update'
          git push origin HEAD:nina-conversation02-worker
          git rev-parse HEAD > CONVERSATION02_SOURCE.txt
          git ls-tree -r HEAD anam-token-worker > CONVERSATION02_FILES.txt
      - name: Collect source and test evidence
        if: always()
        run: |
          mkdir -p /tmp/conversation02-artifact
          cp -r anam-token-worker/src anam-token-worker/test /tmp/conversation02-artifact/
          cp anam-token-worker/package.json anam-token-worker/pnpm-lock.yaml anam-token-worker/wrangler.toml /tmp/conversation02-artifact/
          cp conversation02-*.log CONVERSATION02_SOURCE.txt CONVERSATION02_FILES.txt CONVERSATION02_TEST_SUMMARY.json /tmp/conversation02-artifact/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nina-conversation02-worker-checked
          path: /tmp/conversation02-artifact
          retention-days: 3
