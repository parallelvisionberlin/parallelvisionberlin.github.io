name: Hong Kong Image 3 live verification
on:
  push:
    branches: ['codex/hk-image3-repair-runner-20261020']
    paths: ['.github/workflows/hk-image3-repair.yml']
permissions:
  contents: read
concurrency:
  group: hong-kong-image3-verification
  cancel-in-progress: true
jobs:
  verify-public-release:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a121fdaef3a566cd9c802dc9b52262a2fee301bd
          fetch-depth: 1
          sparse-checkout: |
            lab
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Read public deployed modules and entrypoints without generating images
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,appendFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          const commit='a121fdaef3a566cd9c802dc9b52262a2fee301bd';
          const marker='hkImage3=20261020v1';
          const hash=x=>createHash('sha256').update(x).digest('hex');
          const modules=['moods.js','film-finish.js','lab.js','app-mood-generation.js','explore-moods.js','mood-creator.js','app-moods.js'];
          const pages=['studio','moods','app-moods','mood-creator'];
          const targets=[...modules.map(name=>({path:name,expected:hash(readFileSync('lab/'+name))})),...pages.map(name=>({path:name,marker}))];
          let report;
          for(let attempt=1;attempt<=12;attempt++){
            const results=await Promise.all(targets.map(async target=>{
              try{
                const url='https://pvlab.studio/'+target.path+'?hkRelease='+commit.slice(0,12)+'&verify='+Date.now();
                const response=await fetch(url,{headers:{'Cache-Control':'no-cache'},signal:AbortSignal.timeout(15000)});
                const body=Buffer.from(await response.arrayBuffer());
                const sameOrigin=new URL(response.url).hostname==='pvlab.studio';
                const actual=hash(body);
                const pass=response.ok&&sameOrigin&&(target.expected?actual===target.expected:body.toString('utf8').includes(target.marker));
                return {path:target.path,status:response.status,pass,sha256:actual,...(target.expected?{expectedSha256:target.expected}:{cacheMarkerFound:body.toString('utf8').includes(target.marker)})};
              }catch(error){return {path:target.path,pass:false,error:error.message};}
            }));
            report={commit,checkedAt:new Date().toISOString(),attempt,passed:results.every(r=>r.pass),results,noPaidGeneration:true,noAccountWrites:true};
            console.log('HK_PUBLIC_RELEASE '+JSON.stringify(report));
            if(report.passed)break;
            if(attempt<12)await new Promise(r=>setTimeout(r,10000));
          }
          writeFileSync('hk-image3-live-verification.json',JSON.stringify(report,null,2));
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Hong Kong Image 3 public release\n\nCommit: `'+commit+'`\n\n'+(report.passed?'PASS: all seven JavaScript modules match the merged release byte-for-byte; Studio, Explore, native Moods and Mood Creator load the new cache marker.':'FAIL: at least one public asset did not match the merged release.')+'\n\nV8 finishing is included in the byte comparison. No image generation or customer account write was performed.\n');
          assert.equal(report.passed,true,'Public release must match the actual merged code before it is reported live');
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hong-kong-image3-live-verification
          retention-days: 7
          path: hk-image3-live-verification.json
