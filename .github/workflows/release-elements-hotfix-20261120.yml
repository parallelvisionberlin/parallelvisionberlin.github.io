name: One-time Elements visual analysis customer fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-elements-hotfix-20261120.yml

permissions:
  contents: read

concurrency:
  group: parallel-vision-lab-production
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'parallelvisionberlin/parallelvisionberlin.github.io' && github.event.head_commit.message == 'Release reviewed Elements Worker fix once'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: a40ce1725295563a7b7db9fc3160480a
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Elements, Worker and money safeguards
        run: |
          node --check lab-worker/element-profiles.mjs
          node --check lab-worker/worker.mjs
          node --test tests/lab-element-profiles.test.mjs tests/lab-element-profile-recovery.test.mjs
          node --test tests/lab-worker.test.mjs tests/lab-spicy-image-credit-steps.test.mjs tests/lab-pricing-integrity.test.mjs tests/lab-customer-lifecycle.test.mjs tests/lab-generation-finance.test.mjs
      - name: Snapshot live Worker bindings and deployment for comparison
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync,appendFileSync} from 'node:fs';
          const token=(process.env.CLOUDFLARE_API_TOKEN||'').replace(/\s/g,'');
          if(!token)throw Error('Cloudflare token unavailable');
          console.log('::add-mask::'+token);
          appendFileSync(process.env.GITHUB_ENV,'CLOUDFLARE_API_TOKEN='+token+'\n');
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/parallel-vision-lab';
          async function get(path){const r=await fetch(root+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(25000)});const b=await r.json();if(!r.ok||!b.success)throw Error('Cloudflare read failed for '+path+': HTTP '+r.status);return b.result;}
          const settings=await get('/settings');
          const expected=['AI','IMAGES','LAB_DB','LAB_MEDIA','OWNER_DB'];
          const resources=settings.bindings.filter(x=>!['plain_text','secret_text'].includes(x.type)).map(x=>x.name).sort();
          if(JSON.stringify(resources)!==JSON.stringify(expected))throw Error('Unexpected live resource bindings. Stopping before deployment.');
          const canonical=items=>JSON.stringify(items.map(v=>Object.fromEntries(Object.entries(v).sort())).sort((a,b)=>a.name.localeCompare(b.name)));
          writeFileSync(process.env.RUNNER_TEMP+'/elements-bindings.json',canonical(settings.bindings));
          const dep=await get('/deployments');
          const prior=dep.deployments?.[0]?.versions?.[0]?.version_id;
          if(!prior)throw Error('Could not identify current Worker version.');
          writeFileSync(process.env.RUNNER_TEMP+'/elements-prior-version.txt',prior);
          console.log('PASS: production bindings and previous version captured. No changes made.');
          NODE
      - name: Deploy Worker with existing bindings and no migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: a40ce1725295563a7b7db9fc3160480a
          workingDirectory: lab-worker
          wranglerVersion: '4'
          command: deploy --keep-vars
      - name: Verify production Worker deployment, health, and unchanged bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const token=(process.env.CLOUDFLARE_API_TOKEN||'').replace(/\s/g,'');
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/parallel-vision-lab';
          async function get(path){const r=await fetch(root+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(25000)});const b=await r.json();if(!r.ok||!b.success)throw Error('Cloudflare verification failed: '+path+' HTTP '+r.status);return b.result;}
          let ready=false;
          for(let attempt=0;attempt<6;attempt++){
            const dep=await get('/deployments');
            const current=dep.deployments?.[0]?.versions?.[0]?.version_id;
            if(current && current!==readFileSync(process.env.RUNNER_TEMP+'/elements-prior-version.txt','utf8')){
              const response=await fetch('https://parallel-vision-lab.parallelvision.workers.dev/health',{signal:AbortSignal.timeout(20000)});
              const health=await response.json();
              if(response.ok && health.ok){ready=true;break;}
            }
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!ready)throw Error('New Worker version not confirmed healthy in production');
          const settings=await get('/settings');
          const canonical=items=>JSON.stringify(items.map(v=>Object.fromEntries(Object.entries(v).sort())).sort((a,b)=>a.name.localeCompare(b.name)));
          if(canonical(settings.bindings)!==readFileSync(process.env.RUNNER_TEMP+'/elements-bindings.json','utf8'))throw Error('Production resource bindings or secrets changed');
          console.log('PASS: a new Worker version is serving production health; all bindings, secrets and configuration preserved.');
          console.log('No D1 migration, payment, customer debit, or paid generation was performed.');
          NODE
