name: Complete private Lab
on:
  push:
    branches: ['lab/complete-20260926']
    paths: ['.github/workflows/lab-completion.yml']
permissions:
  contents: write
concurrency:
  group: lab-completion-20260926
  cancel-in-progress: false
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/complete-20260926
          sparse-checkout: |
            lab
            lab-worker
            tests
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply reviewed changes
        run: |
          python3 lab-worker/_upgrade_backend.py
          python3 lab-worker/_upgrade_ui.py
          python3 lab-worker/_upgrade_tests.py
      - name: Validate JavaScript and private generation lifecycle
        run: |
          node --check lab/lab.js
          node --check lab-worker/worker.mjs
          node --test tests/lab-worker.test.mjs
      - name: Commit tested source without temporary upgrade helpers
        run: |
          git rm lab-worker/_upgrade_backend.py lab-worker/_upgrade_ui.py lab-worker/_upgrade_tests.py .github/workflows/lab-completion.yml
          git add lab/index.html lab/lab.js lab/lab.css lab/README.md lab-worker/worker.mjs lab-worker/schema.sql lab-worker/migrations/0002-images.sql tests/lab-worker.test.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete private Lab image/video generation, reference packs and safe reusable history'
          git push origin HEAD:lab/complete-20260926
          git rev-parse HEAD
          sha256sum lab/index.html lab/lab.js lab/lab.css lab-worker/worker.mjs lab-worker/schema.sql tests/lab-worker.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: lab-complete-tested-source
          retention-days: 1
          path: |
            lab/*.html
            lab/*.css
            lab/*.js
            lab/README.md
            lab-worker/*.mjs
            lab-worker/*.sql
            lab-worker/*.toml
            lab-worker/migrations/*.sql
            tests/lab*.mjs
