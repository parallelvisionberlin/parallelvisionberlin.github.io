name: PV LAB Admin MCP
on:
  pull_request:
    paths: ['pvlab-admin-mcp/**', '.github/workflows/pvlab-admin-mcp.yml']
  workflow_dispatch:
    inputs:
      resource_url:
        description: Dedicated PV LAB HTTPS URL ending in /mcp
        required: true
        type: string
      oauth_issuer:
        description: Exact production Clerk OAuth issuer from discovery metadata
        required: true
        type: string
      jwks_url:
        description: Exact jwks_uri from the same issuer metadata
        required: true
        type: string
      owner_subject:
        description: Verified PV LAB owner OAuth sub (not email)
        required: true
        type: string
      activate:
        description: Enable owner-only access after OAuth configuration is verified
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: pvlab-admin-mcp-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pvlab-admin-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pvlab-admin-mcp/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Manual publication of the separate service
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: node deploy.mjs --deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MCP_RESOURCE_URL: ${{ inputs.resource_url }}
          OAUTH_ISSUER: ${{ inputs.oauth_issuer }}
          OAUTH_JWKS_URL: ${{ inputs.jwks_url }}
          OWNER_SUBJECT: ${{ inputs.owner_subject }}
          MCP_ACTIVATE: ${{ inputs.activate && 'true' || 'false' }}
