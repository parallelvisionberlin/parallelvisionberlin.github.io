name: PV LAB Photo Pack Studio

on:
  pull_request:
    paths:
      - 'lab/reference-pack-studio.js'
      - 'lab/reference-pack-studio.css'
      - 'lab/studio.html'
      - 'lab/lab.js'
      - 'lab/scene-library.js'
      - 'lab/scene-library.css'
      - 'tests/lab-scene-library-edit-ui.mjs'
      - 'tests/lab-reference-pack-studio-ui.mjs'
      - '.github/workflows/pv-lab-photo-packs.yml'
  push:
    branches: [main]
    paths:
      - 'lab/reference-pack-studio.js'
      - 'lab/reference-pack-studio.css'
      - 'lab/studio.html'
      - 'lab/lab.js'
      - 'lab/scene-library.js'
      - 'lab/scene-library.css'
      - 'tests/lab-scene-library-edit-ui.mjs'
      - 'tests/lab-reference-pack-studio-ui.mjs'
      - '.github/workflows/pv-lab-photo-packs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  photo-packs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            lab
            tests
            js
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate isolated source files
        run: |
          node --check lab/lab.js
          node --check lab/reference-pack-studio.js
          node --check tests/lab-reference-pack-studio-ui.mjs
          node --check lab/scene-library.js
          node --check tests/lab-scene-library-edit-ui.mjs
          node --test tests/lab-scene-library-notes.test.mjs
      - name: Install headless browser
        run: |
          npm install --prefix /tmp/pv-pack-browser --no-save playwright@1.62.1
          /tmp/pv-pack-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Verify photo packs and no paid generation
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-pack-browser/node_modules/playwright/index.mjs
        run: |
          node tests/lab-scene-library-edit-ui.mjs
          node tests/lab-reference-pack-studio-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-pack-studio-previews
          path: |
            test-results/photo-packs/*.png
            test-results/scene-elements-edit/*.png
          if-no-files-found: ignore
          retention-days: 2
