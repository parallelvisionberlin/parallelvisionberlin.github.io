name: Import approved PV LAB Elements hero photography
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pv-lab-approved-elements-import.yml'
permissions:
  contents: write
jobs:
  import-hero-art:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Make self-hosted banners from user-approved mockup photographs
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from io import BytesIO
          from pathlib import Path
          from urllib.request import Request, urlopen
          sources = {
            "grid": "https://d2ol7oe51mr4n9.cloudfront.net/user_36QWljeNVgnwNMkZtgtVQjVUBoW/9cf90eb8-f33d-4b0e-848e-61dfdfa51c86.png",
            "strips": "https://d2ol7oe51mr4n9.cloudfront.net/user_36QWljeNVgnwNMkZtgtVQjVUBoW/21ebb1b3-462e-422f-8260-33cc5ad59d09.png"
          }
          originals = {}
          for name, url in sources.items():
            with urlopen(Request(url, headers={"User-Agent":"Mozilla/5.0 PVLAB/1.0"}), timeout=45) as response:
              data = response.read(12000000)
            originals[name] = Image.open(BytesIO(data)).convert('RGB')
          assert originals['grid'].size == (2048,720), originals['grid'].size
          assert originals['strips'].size == (2048,719), originals['strips'].size
          size=(1536,256)
          out_dir=Path('lab/scene-hero-art')
          out_dir.mkdir(parents=True,exist_ok=True)
          jobs=[
            ('characters','grid',(14,368,1016,705),(.5,.22)),
            ('outfits','grid',(1030,368,2036,705),(.5,.54)),
            ('props','strips',(0,359,2048,539),(.74,.50)),
            ('locations','strips',(0,540,2048,719),(.75,.50))
          ]
          for name, source, box, anchor in jobs:
            im=originals[source].crop(box)
            scale=max(size[0]/im.width,size[1]/im.height)
            iw,ih=round(im.width*scale),round(im.height*scale)
            im=im.resize((iw,ih),Image.Resampling.LANCZOS)
            x=round((iw-size[0])*anchor[0]);y=round((ih-size[1])*anchor[1])
            im=im.crop((x,y,x+size[0],y+size[1])).convert('RGBA')
            veil=Image.new('RGBA',size,(0,0,0,0)); pixels=veil.load()
            for xx in range(size[0]):
              if xx<=665: alpha=255
              elif xx<925: alpha=round(255*((925-xx)/260)**1.7)
              else: alpha=0
              for yy in range(size[1]): pixels[xx,yy]=(10,14,17,alpha)
            im=Image.alpha_composite(im,veil).convert('RGB')
            dest=out_dir/(name+'.webp')
            im.save(dest,'WEBP',quality=76,method=6)
            assert 3000 < dest.stat().st_size < 150000, (dest,dest.stat().st_size)
            print('Approved banner:',dest,dest.stat().st_size)
          PY
      - name: Commit optimized image assets
        run: |
          git add lab/scene-hero-art/characters.webp lab/scene-hero-art/outfits.webp lab/scene-hero-art/props.webp lab/scene-hero-art/locations.webp
          if ! git diff --cached --quiet; then
            git config user.name 'PV LAB asset importer'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Add approved photographic PV LAB Elements hero images'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
