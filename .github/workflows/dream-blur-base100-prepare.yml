name: Prepare isolated Dream Blur Base 100 patch
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'parallelvisionberlin/parallelvisionberlin.github.io' && github.head_ref == 'fix/dream-blur-base100-20261024' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply exact compiler gate and propagate only module cache versions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('lab/moods.js')
          source=p.read_text()
          assert 'prepareDreamBlurBasePrompt' not in source, 'Already patched; inspect the branch instead of applying twice'
          Path('lab/.dream-blur-baseline.mjs').write_text(source)
          anchor='  const intensity=Math.max(1,Math.min(100,Math.round(Number(amount)||60)));\n'
          assert source.count(anchor)==1, 'Compiler anchor changed'
          block="""  // Maximum optical reinterpretation is isolated to an actual Base photograph.
            // All lower strengths and text/References Only recipes remain unchanged.
            if(mood.id==='dream-blur'&&intensity===100&&referenceCount>0&&referenceMode!=='references'){
              const prompt=prepareDreamBlurBasePrompt(original,{engine});
              const budget=engine==='seedreamlite'?3000:5000,over=prompt.length-budget;
              return {prompt,metadata:{moodId:mood.id,moodIntensity:intensity,moodOriginalPrompt:original},
                error:over>0?'Your direction and this Mood exceed '+budget.toLocaleString()+' characters by '+over.toLocaleString()+'. The Mood stays unchanged; shorten your direction.':''};
            }
          """
          source="import {prepareDreamBlurBasePrompt} from './dream-blur-base.js?v=20261024v1';\n"+source.replace(anchor,anchor+block)
          p.write_text(source)
          # Refresh existing import paths, never replace HTML, CSS, prompts or art.
          changed={'moods.js'}
          version='dreamBlurBase=20261024v1'
          pattern=re.compile(r'''(?P<q>['"])(?P<path>\./[A-Za-z0-9-]+\.js)(?P<query>\?[^'"\r\n]*)?(?P=q)''')
          paths=sorted([*Path('lab').glob('*.js'),*Path('lab').glob('*.html')])
          while True:
              added=False
              for path in paths:
                  original=path.read_text()
                  def bump(match):
                      if Path(match['path']).name not in changed:
                          return match.group(0)
                      query=match['query'] or ''
                      if version in query:
                          return match.group(0)
                      return match['q']+match['path']+query+('&' if query else '?')+version+match['q']
                  updated=pattern.sub(bump,original)
                  if updated!=original:
                      path.write_text(updated)
                      if path.name not in changed:
                          changed.add(path.name)
                          added=True
              if not added:
                  break
          print('Compiler + import-cache scope:', ', '.join(sorted(changed)))
          PY
      - name: Prove unchanged recipes outside Base photograph at 100 percent
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import * as before from './lab/.dream-blur-baseline.mjs';
          import * as after from './lab/moods.js';
          assert.deepEqual(after.MOODS,before.MOODS,'The curated Mood catalog, descriptions and defaults must remain identical');
          let unchanged=0,updated=0;
          for(const mood of before.MOODS)
          for(const engine of ['seedream','seedreamlite','gemini','gemini21','krea3','qwen3','zspicy'])
          for(const amount of [1,25,34,35,60,69,70,78,80,89,90,99,100])
          for(const referenceCount of [0,1,3])
          for(const referenceMode of ['base','references'])
          for(const input of ['', 'Keep the same person and original place.']){
            const options={engine,referenceCount,referenceMode};
            const a=before.prepareMoodPrompt(input,mood.id,amount,options);
            const b=after.prepareMoodPrompt(input,mood.id,amount,options);
            if(mood.id==='dream-blur'&&amount===100&&referenceCount>0&&referenceMode==='base'&&!a.error){
              assert.match(b.prompt,/MAXIMUM BASE EXPOSURE/);
              assert.deepEqual(b.metadata,a.metadata,'Do not change saved user direction or intensity');
              assert.equal(b.error,'');
              updated++;
            }else{
              assert.deepEqual(b,a,`${mood.id}/${engine}/${amount}/${referenceCount}/${referenceMode}`);
              unchanged++;
            }
          }
          console.log(JSON.stringify({unchangedRecipes:unchanged,updatedBase100:updated}));
          JS
          rm lab/.dream-blur-baseline.mjs
      - name: Existing Dream Blur and reference regression tests without paid requests
        run: |
          node --check lab/moods.js
          node --check lab/dream-blur-base.js
          node --test tests/lab-dream-blur.test.mjs tests/lab-moods.test.mjs tests/lab-mood-references.test.mjs tests/lab-reference-mode.test.mjs tests/lab-photobooth-all-moods.test.mjs
          git diff --check
          test -z "$(git diff --name-only -- lab/mood-references.js lab/mood-references lab/mood-previews lab/reference-guidance.js lab-worker)"
      - name: Commit validated patch and remove this one-shot preparation workflow
        env:
          TARGET_BRANCH: fix/dream-blur-base100-20261024
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/$TARGET_BRANCH | cut -f1)" = "$EXPECTED_HEAD"
          git rm .github/workflows/dream-blur-base100-prepare.yml
          git add -u lab
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Isolate Dream Blur maximum Base exposure; retain identity, location and all other recipes'
          git push origin HEAD:refs/heads/$TARGET_BRANCH
