name: One-time Nina account CTA patch
on:
  push:
    paths:
      - '.github/workflows/one-time-nina-account-cta.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine account CTA hierarchy
        env:
          CTA_CSS_B64: 
        run: |
          if grep -q 'NINA_ACCOUNT_CTA_HIERARCHY_20260905' css/nina-access.css; then exit 0; fi
          printf '\n' >> css/nina-access.css
          printf '%s' "$CTA_CSS_B64" | base64 --decode >> css/nina-access.css
      - name: Commit patch
        run: |
          if git diff --quiet -- css/nina-access.css; then exit 0; fi
          git config user.name "parallelvisionberlin"
          git config user.email "parallelvision.label@gmail.com"
          git add css/nina-access.css
          git commit -m "Refine Nina account CTA hierarchy"
          git push
