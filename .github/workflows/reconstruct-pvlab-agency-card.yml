name: Reconstruct PV LAB agency card
on:
  push:
    branches: [fix/agency-pvlab-hd-card-20261025-final]
    paths:
      - 'tmp/pvlab-card-upload/**'
      - '.github/workflows/reconstruct-pvlab-agency-card.yml'
permissions:
  contents: write
concurrency:
  group: reconstruct-pvlab-agency-card
  cancel-in-progress: true
jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Reconstruct and verify HD WebP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          parts=['0','1','2','3','4','5','6a','6b','7','8','9']
          payload=''
          for part in parts:
              text=Path(f'tmp/pvlab-card-upload/chunk{part}.txt').read_text()
              payload += text.split('\n',1)[1]
          data=base64.b64decode(payload, validate=True)
          assert len(data)==63554, len(data)
          digest=hashlib.sha256(data).hexdigest()
          assert digest=='454586a6bec0dbddeaffebff4f9e400a6a6836a3b7f8dbb03021d5ba642b7ae7', digest
          out=Path('assets/optimized/agency/pvlab-agency-card-hd-20261025.webp')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(data)
          html=Path('agency/index.html').read_text()
          old='../assets/optimized/agency/pv-lab-minimal-2026.webp'
          new='../assets/optimized/agency/pvlab-agency-card-hd-20261025.webp'
          assert old in html
          html=html.replace(old,new,1)
          html=html.replace('alt="PV LAB, Creative Tools / Berlin" loading="lazy" decoding="async" width="1000" height="1000"',
                            'alt="PV LAB, Creative Tools / Berlin" loading="lazy" decoding="async" width="1254" height="1254"',1)
          Path('agency/index.html').write_text(html)
          print('verified',digest)
          PY
      - name: Commit clean site change
        run: |
          git config user.name "ParallelVision"
          git config user.email "parallelvision.label@gmail.com"
          git add agency/index.html assets/optimized/agency/pvlab-agency-card-hd-20261025.webp
          git rm -r tmp/pvlab-card-upload .github/workflows/reconstruct-pvlab-agency-card.yml
          git diff --cached --check
          git commit -m "Use HD PV LAB artwork on Agency page"
          git push origin HEAD:fix/agency-pvlab-hd-card-20261025-final
