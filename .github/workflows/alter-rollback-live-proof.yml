name: ALTER rollback production proof
on:
  push:
    branches: [verify/alter-rollback-900-20261107]
    paths: [.github/workflows/alter-rollback-live-proof.yml]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 035a182f023ac51c1686c384e863b87c69707944
      - name: Verify public ALTER bytes and restored pre-workstation markup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,urllib.request
          root=Path('lab')
          def get(path):
            request=urllib.request.Request('https://pvlab.studio/'+path,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0 (ALTER rollback verification)'})
            with urllib.request.urlopen(request,timeout=20) as response:return response.read()
          html=get('beauty').decode('utf-8')
          local=(root/'beauty.html').read_text()
          assert 'beauty-editorial-final.css?v=20261106-atelier2' in html
          assert 'beauty-archive-curation.css?v=20261107-archive1' in html
          assert 'beauty-workstation-20261107' not in html
          assert '<h1>ALTER <br>Studio.</h1>' in html
          assert html.count('data-look="')==13
          assert 'beauty-looks-list' in html and 'beauty-edit-panel' in html
          assert 'alter-layer-stack' not in html
          for asset in ['beauty-editorial-final.css','beauty-flow-refinement.css','beauty-archive-curation.css','beauty-approved-20261029.css','beauty.js','beauty-approved-20261029.js','beauty-settings.js']:
            source=(root/asset).read_bytes()
            served=get(asset)
            assert hashlib.sha256(source).digest()==hashlib.sha256(served).digest(),asset
            print('MATCHED LIVE:',asset)
          print('Verified: restored ALTER markup and CSS/JS hashes; no workstation scripts.')
          PY
      - name: Verify real guest layout and click targets at desktop and mobile sizes
        run: |
          npm install --prefix /tmp/pv-rollback --no-audit --no-fund playwright@1.57.0
          node /tmp/pv-rollback/node_modules/playwright/cli.js install chromium
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from '/tmp/pv-rollback/node_modules/playwright/index.mjs';
          const browser=await chromium.launch({headless:true});
          try{
            for(const width of [1440,1024,390]){
              const ctx=await browser.newContext({viewport:{width,height:900}});
              const page=await ctx.newPage(); let writes=0;
              await page.route('**/api/**',route=>{if(route.request().method()!=='GET'){writes++;route.abort();}else route.continue();});
              await page.goto('https://pvlab.studio/beauty',{waitUntil:'domcontentloaded',timeout:30000});
              const q=await page.evaluate(()=>{
                const grid=document.querySelector('.beauty-editor-grid');
                const bg=getComputedStyle(grid,'::before').backgroundImage;
                return {background:bg,overflow:document.documentElement.scrollWidth>window.innerWidth,
                  rows:document.querySelectorAll('#beauty-looks-list [data-look]').length,
                  panel:!!document.querySelector('.beauty-edit-panel'),
                  workstation:!!document.querySelector('.alter-layer-stack')};
              });
              assert.match(q.background,/hero\.webp/,'Original photographic hero restored');
              assert.equal(q.workstation,false,'Removed redesign DOM');
              assert.equal(q.rows,13);
              assert.equal(q.overflow,false,'No horizontal page overflow');
              assert.equal(q.panel,true);
              await page.locator('#beauty-generate').click({trial:true});
              assert.equal(writes,0,'No paid generation');
              console.log('GUEST ROLLBACK OK',width);
              await ctx.close();
            }
          }finally{await browser.close();}
          JS
