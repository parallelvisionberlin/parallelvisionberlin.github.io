name: Cleanup Nina world CSS

on:
  push:
    paths:
      - '.github/workflows/cleanup-nina-world-css.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove stale compact-frame remainder
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('nina-project.html')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(r"\n\.n-world-note \{\s*margin: 14px 0 52px;\s*padding-top: 14px;\s*\}\s*\}\s*", "\n", text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one stale world-note block, removed {count}')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit cleanup and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/cleanup-nina-world-css.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nina-project.html .github/workflows/cleanup-nina-world-css.yml
          git commit -m "Clean up Nina world framing CSS"
          git push
