name: ALTER wide-panel production proof
on:
  push:
    branches: [verify/alter-panel-widen-live-20261107]
    paths: [.github/workflows/alter-panel-live-proof.yml]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fd9774e8bf4ff20752d064a7cf9e5b84ebd53159
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Confirm exact release and production source bytes
        run: |
          python3 - <<'PY'
          import json,urllib.request,hashlib
          from pathlib import Path
          sha='fd9774e8bf4ff20752d064a7cf9e5b84ebd53159'
          def get(url):
            request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0 (PVLAB read-only release verification)'})
            with urllib.request.urlopen(request,timeout=22) as response:return response.read()
          checks=json.loads(get('https://api.github.com/repos/parallelvisionberlin/parallelvisionberlin.github.io/commits/'+sha+'/check-runs?check_name=Cloudflare%20Pages'))['check_runs']
          assert any(c.get('head_sha')==sha and c['status']=='completed' and c['conclusion']=='success' and c.get('app',{}).get('slug')=='cloudflare-workers-and-pages' for c in checks),'Exact Cloudflare deployment not successful'
          live=get('https://pvlab.studio/beauty').decode('utf8')
          assert 'beauty-panel-widen-20261107.css?v=20261107-panel1' in live
          assert 'beauty-editorial-final.css?v=20261106-atelier2' in live
          assert '<h1>ALTER <br>Studio.</h1>' in live
          assert live.count('data-look="')==13
          for name in ['beauty-panel-widen-20261107.css','beauty-editorial-final.css','beauty-flow-refinement.css']:
            local=Path('lab')/name
            remote=get('https://pvlab.studio/'+name)
            assert hashlib.sha256(local.read_bytes()).digest()==hashlib.sha256(remote).digest(),'Stale public stylesheet: '+name
            print('LIVE CSS MATCHES:',name)
          hero='visuals/beauty/atelier/hero.webp'
          assert hashlib.sha256((Path('lab')/hero).read_bytes()).digest()==hashlib.sha256(get('https://pvlab.studio/'+hero)).digest()
          print('LIVE VERIFIED: panel stylesheet and immutable hero asset/CSS; 13 photographic directions.')
          PY
      - name: Verify public desktop and mobile geometry without generation
        run: |
          npm install --prefix /tmp/pv-verify --no-audit --no-fund playwright@1.57.0
          node /tmp/pv-verify/node_modules/playwright/cli.js install chromium
          node --input-type=module <<'JS'
          import {chromium} from '/tmp/pv-verify/node_modules/playwright/index.mjs';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          try{
            for(const [width,height] of [[1727,900],[1440,900],[1366,768],[1024,768],[390,844]]){
              const context=await browser.newContext({viewport:{width,height},reducedMotion:'reduce'});
              const page=await context.newPage();let paid=0;
              await page.route('**/api/**',route=>{
                const path=new URL(route.request().url()).pathname;
                if(route.request().method()!=='GET'){
                  if(path==='/api/jobs'||path==='/api/quotes')paid++;
                  return route.abort();
                }
                return route.continue();
              });
              await page.goto('https://pvlab.studio/beauty',{waitUntil:'domcontentloaded',timeout:30000});
              const check=await page.evaluate(()=>{
                const rect=sel=>{const r=document.querySelector(sel).getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height,bottom:r.bottom}};
                const grid=document.querySelector('.beauty-editor-grid');
                const s=getComputedStyle(grid,'::before');
                const cards=[...document.querySelectorAll('#beauty-looks-list [data-look]')];
                return {panel:rect('.beauty-edit-panel'),looks:rect('.beauty-looks-heading'),
                  bg:s.backgroundImage,pos:s.backgroundPosition,mask:s.maskImage,
                  count:cards.length,overflow:document.documentElement.scrollWidth>innerWidth,
                  link:!!document.querySelector('link[href*="beauty-panel-widen-20261107.css"]')};
              });
              assert.equal(check.link,true);assert.equal(check.count,13);
              assert.match(check.bg,/atelier\/hero\.webp/);
              assert.equal(check.overflow,false);
              if(width>1300){
                assert.ok(check.panel.w>=Math.min(590,Math.max(460,width*.35))-1,'Edit Look width');
                assert.ok(check.panel.bottom<=check.look.y+2,'Editor never overlays archive controls');
              }
              assert.equal(await page.locator('.beauty-tabs [role="tab"]').count(),5);
              await page.locator('#beauty-generate').click({trial:true});
              assert.equal(paid,0);
              console.log('LIVE LAYOUT VERIFIED:',width,'panel',Math.round(check.panel.w));
              await context.close();
            }
          }finally{await browser.close();}
          JS
