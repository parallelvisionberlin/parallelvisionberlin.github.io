name: Verify PV LAB live Mood Generate 2026-10-16
on:
  push:
    branches: [verify/pvlab-moods-production-20261016]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm latest Moods UI and one-click source are live on pvlab.studio
        shell: bash
        run: |
          set -euo pipefail
          base="https://pvlab.studio"
          for attempt in $(seq 1 24); do
            stamp="${GITHUB_SHA}-$attempt"
            if curl -fsSL --connect-timeout 7 --max-time 24 -H 'Cache-Control: no-cache' "$base/moods?verify=$stamp" -o /tmp/moods.html \
              && curl -fsSL --connect-timeout 7 --max-time 24 -H 'Cache-Control: no-cache' "$base/explore-moods.js?verify=$stamp" -o /tmp/explore.js \
              && curl -fsSL --connect-timeout 7 --max-time 24 -H 'Cache-Control: no-cache' "$base/explore-moods-editorial.css?verify=$stamp" -o /tmp/cards.css \
              && grep -Fq 'oneClick=20261016v2' /tmp/moods.html \
              && grep -Fq 'uniformCardTitle=20261016v2' /tmp/moods.html \
              && grep -Fq 'id="mc-look-credit-note"' /tmp/moods.html \
              && grep -Fq 'generate.disabled=!hasGenerationInput()' /tmp/explore.js \
              && grep -Fq 'const currentPrice=await preparePrice(stamp)' /tmp/explore.js \
              && grep -Fq 'creditNote.textContent=ready.label' /tmp/explore.js \
              && grep -Fq 'currentPrice.submit()' /tmp/explore.js \
              && grep -Fq 'font:500 clamp(16px,1.2vw,20px)' /tmp/cards.css \
              && ! grep -Fq 'font-size:clamp(20px,2.05vw,29px);font-weight:450' /tmp/cards.css; then
                echo "PASS: production pvlab.studio serves one-click Generate, nonblocking quote, credit disclosure, single submit, uniform Dream Blur title."
                echo "HTML: $(wc -c < /tmp/moods.html) bytes; JS: $(wc -c < /tmp/explore.js); CSS: $(wc -c < /tmp/cards.css)"
                exit 0
            fi
            echo "Live files not updated yet (attempt $attempt/24). Retrying."
            sleep 8
          done
          echo "FAIL: newest Mood files not yet confirmed on pvlab.studio"
          exit 1
