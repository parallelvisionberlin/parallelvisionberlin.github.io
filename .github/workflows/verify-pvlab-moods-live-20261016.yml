name: Verify PV LAB Mood upload UX production
on:
  push:
    branches: [verify/pvlab-moods-production-20261016]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check live oversized-photo validation and fixed-size modal
        shell: bash
        run: |
          set -euo pipefail
          base="https://pvlab.studio"
          for attempt in $(seq 1 30); do
            stamp="${GITHUB_SHA}-$attempt"
            if curl -fsSL --retry 1 --connect-timeout 8 --max-time 25 -H 'Cache-Control: no-cache' "$base/moods?verify=$stamp" -o /tmp/moods.html \
              && curl -fsSL --retry 1 --connect-timeout 8 --max-time 25 -H 'Cache-Control: no-cache' "$base/explore-moods.js?verify=$stamp" -o /tmp/explore.js \
              && curl -fsSL --retry 1 --connect-timeout 8 --max-time 25 -H 'Cache-Control: no-cache' "$base/explore-moods-editorial.css?verify=$stamp" -o /tmp/editorial.css \
              && grep -Fq 'uploadFeedback=20261016v1' /tmp/moods.html \
              && grep -Fq 'id="mc-look-upload-error"' /tmp/moods.html \
              && grep -Fq 'id="mc-look-file-clear"' /tmp/moods.html \
              && grep -Fq 'title="Remove photo"' /tmp/moods.html \
              && ! grep -Fq '>Remove selected photo</button>' /tmp/moods.html \
              && grep -Fq 'function showUploadError(input,error)' /tmp/explore.js \
              && grep -Fq "Maximum 20 MB." /tmp/explore.js \
              && grep -Fq "generate.disabled=true" /tmp/explore.js \
              && grep -Fq -- '--mc-editor-height' /tmp/explore.js \
              && grep -Fq 'mc-look-upload-error[hidden]' /tmp/editorial.css \
              && grep -Fq 'height:var(--mc-editor-height,auto)' /tmp/editorial.css \
              && grep -Fq 'background:#101715f2' /tmp/editorial.css; then
                echo "PASS LIVE: oversized image alert, exact size and maximum, thumbnail X remove action, and fixed Mood card dimensions served on pvlab.studio."
                echo "html=$(wc -c < /tmp/moods.html) js=$(wc -c < /tmp/explore.js) css=$(wc -c < /tmp/editorial.css)"
                exit 0
            fi
            echo "Waiting for latest Mood upload UI (attempt $attempt/30)"
            sleep 8
          done
          echo 'FAIL: live Mood upload revision not confirmed'
          exit 1
