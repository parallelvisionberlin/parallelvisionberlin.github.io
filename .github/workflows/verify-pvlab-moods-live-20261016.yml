name: Verify PV LAB compact Mood result production
on:
  push:
    branches: [verify/pvlab-moods-production-20261016]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Verify pvlab.studio serves the compact generating dialog
        shell: bash
        run: |
          set -euo pipefail
          base="https://pvlab.studio"
          for attempt in $(seq 1 30); do
            stamp="${GITHUB_SHA}-$attempt"
            if curl -fsSL --retry 1 --connect-timeout 6 --max-time 25 -H 'Cache-Control: no-cache' "$base/moods?verify=$stamp" -o /tmp/moods.html \
              && curl -fsSL --retry 1 --connect-timeout 6 --max-time 25 -H 'Cache-Control: no-cache' "$base/explore-moods.js?verify=$stamp" -o /tmp/moods.js \
              && curl -fsSL --retry 1 --connect-timeout 6 --max-time 25 -H 'Cache-Control: no-cache' "$base/explore-moods-nav.css?verify=$stamp" -o /tmp/moods-nav.css \
              && grep -Fq 'resultFit=20261016v1' /tmp/moods.html \
              && grep -Fq 'id="mc-look-result-again"' /tmp/moods.html \
              && grep -Fq 'dialog.classList.add(' /tmp/moods.js \
              && grep -Fq 'is-result-view' /tmp/moods.js \
              && grep -Fq 'mc-look-result-again' /tmp/moods.js \
              && grep -Fq 'currentPrice.submit()' /tmp/moods.js \
              && grep -Fq 'mc-look-dialog.is-result-view' /tmp/moods-nav.css \
              && grep -Fq 'position:relative;top:auto;align-self:stretch' /tmp/moods-nav.css \
              && ! grep -Fq 'position:sticky;top:0;align-self:start' /tmp/moods-nav.css; then
              echo 'PASS LIVE: Compact generating popup, result preview, Make another, and full-height Mood artwork present on pvlab.studio.'
              echo "HTML $(wc -c < /tmp/moods.html) bytes; JS $(wc -c < /tmp/moods.js); CSS $(wc -c < /tmp/moods-nav.css)"
              exit 0
            fi
            echo "Production awaiting new Mood build (attempt $attempt/30)"
            sleep 8
          done
          echo 'FAIL: New generating dialog not verified in live production'
          exit 1
