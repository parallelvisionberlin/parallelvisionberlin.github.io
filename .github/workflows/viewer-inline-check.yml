name: Verify inline viewer correction
on:
  push:
    branches: [fix/viewer-inline-edit-20261107]
    paths: ['.github/workflows/viewer-inline-check.yml', '.github/scripts/apply-viewer-inline.mjs', '.github/scripts/viewer-inline-adapter.txt']
permissions:
  contents: write
jobs:
  viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/viewer-inline-edit-20261107
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply scoped integration
        run: |
          set -euo pipefail
          node .github/scripts/apply-viewer-inline.mjs
          node --check lab/lab.js
          node --check lab/precision-edit.js
          node --check lab/image-viewer-editor.js
          git diff --check
      - name: Verify quote safety and existing image contracts
        run: |
          set -euo pipefail
          mkdir -p /tmp/viewer-inline-evidence
          node --test tests/lab-approved-image-ui-contract.test.mjs tests/lab-viewer-inline.test.mjs tests/lab-precision-edit.test.mjs tests/lab-image-replacement-intent.test.mjs tests/lab-image-replacement-composite.test.mjs tests/lab-image-replacement-backend.test.mjs tests/lab-image-replacement-draft.test.mjs | tee /tmp/viewer-inline-evidence/unit.log
      - name: Install pinned browser test dependency
        run: |
          npm install --prefix /tmp/pv-viewer-inline --no-save playwright@1.57.0
          node /tmp/pv-viewer-inline/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify desktop and mobile editing without paid requests
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-viewer-inline/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          node tests/lab-precision-edit-ui.mjs 2>&1 | tee /tmp/viewer-inline-evidence/precision.log
          node tests/lab-image-replacement-flow-ui.mjs 2>&1 | tee /tmp/viewer-inline-evidence/inline-flow.log
          PV_RETOUCH_NAV_ONLY=1 node tests/lab-image-oneclick-ui.mjs 2>&1 | tee /tmp/viewer-inline-evidence/navigation.log
      - name: Record verified branch state and remove temporary tooling
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,appendFileSync} from 'node:fs';
          const index=JSON.parse(readFileSync('lab/owner-work-records.json','utf8'));
          const record=index.records.find(r=>r.id==='image-viewer-replace-edit-actions');
          if(!record)throw Error('Existing viewer work record is missing');
          record.status='needs_verification';record.updatedAt=new Date().toISOString();
          record.baselineSha='8dfcb934ffe44391fa41fdaec5736870ce08ac2b';record.reviewedSha=null;record.branch='fix/viewer-inline-edit-20261107';
          record.summary='Correct the deployed Retouch-style workspace toward the approved inline viewer proposals. Keep the photo pane and metadata sidebar, compact Select/Brush/Erase tools, optional reference and inline Generate. Reference generation preserves the main Image draft and existing model/provider routes.';
          record.nextAction='Review CI and actual desktop/mobile browser screenshots, merge the corrected viewer and verify exact production assets. No paid or real-account generation has been tested.';
          record.tests=[{label:'Viewer safety and existing Image/precision/replacement unit tests',result:'passed',scope:'Stale masks, session/close invalidation, expired prices, wallet changes, quote mismatch, duplicate and uncertain submissions, model routes and Image draft isolation.'},{label:'Precision editor and complete inline viewer browser tests',result:'passed',scope:'Synthetic media and intercepted APIs only; 390px and 1440px layout, selection, price, one explicit generation, exterior composite and result in the same viewer.'},{label:'Standalone Retouch navigation',result:'passed',scope:'Existing route and return controls remain functional.'}];
          record.deployment={state:'not_started',environment:'Cloudflare Pages pvlab-studio',sourceSha:null,limitations:['This corrected revision has not been published yet.','No real signed-in or paid-provider edit was run.']};
          record.links.push({label:'Inline correction verification',url:'https://github.com/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+process.env.GITHUB_RUN_ID});
          record.blockers=['Normal PR checks and production verification pending. Existing unrelated baseline CI failures remain documented in the prior release audit.'];
          record.evidence.push({kind:'automated_test',summary:'Inline correction passed its scoped provider-free checks before committing integration.',scope:'Feature branch; mocked browser requests',limitations:['No real account or provider inference.']});
          for(const file of ['tests/lab-viewer-inline.test.mjs','.github/workflows/pv-lab-precision-edit-ui.yml'])if(!record.files.includes(file))record.files.push(file);
          writeFileSync('/tmp/viewer-inline-record.json',JSON.stringify(record));
          appendFileSync('lab/IMAGE-REPLACEMENT-WORK-STATE.md','\n\n## Inline viewer correction, 2026-11-07\n\nOwner reported the published workspace did not match proposals 4 and 5. The correction keeps the editor inside the original photo pane with the existing metadata sidebar. Select/Brush/Erase are primary; strength/size/expansion are under More options. An optional reference and inline Generate replace the detour to the main Image deck. The main draft is never overwritten. Existing quote endpoints, selected model routes, quotas and compositing are reused.\n\nScoped quote-safety unit tests, prior precision/replacement tests, full mocked 390px/1440px viewer flow and standalone Retouch navigation passed. No paid inference or real account edit was run. This branch revision is not yet claimed live.\n');
          JS
          node scripts/owner-work-state.mjs upsert /tmp/viewer-inline-record.json
          node scripts/owner-work-state.mjs validate
          git config user.name 'PV LAB verification'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lab/lab.js lab/precision-edit.js lab/studio.html lab/image-viewer-editor.js lab/image-viewer-editor.css lab/owner-work-records.json lab/IMAGE-REPLACEMENT-WORK-STATE.md tests/lab-image-replacement-flow-ui.mjs tests/lab-image-oneclick-ui.mjs .github/workflows/pv-lab-precision-edit-ui.yml
          git rm .github/scripts/apply-viewer-inline.mjs .github/scripts/viewer-inline-adapter.txt .github/workflows/viewer-inline-check.yml
          git diff --cached --check
          git commit -m 'fix: integrate compact viewer editing and inline reference generation'
          git rev-parse HEAD > /tmp/viewer-inline-evidence/source-sha.txt
          git push origin HEAD:fix/viewer-inline-edit-20261107
      - name: Preserve scoped verification evidence
        if: always()
        run: |
          mkdir -p /tmp/viewer-inline-evidence
          cp test-results/pv-viewer-*.png /tmp/viewer-inline-evidence/ 2>/dev/null || true
          git diff > /tmp/viewer-inline-evidence/uncommitted.diff
          tar -czf /tmp/viewer-inline-evidence/source.tar.gz lab/lab.js lab/precision-edit.js lab/image-viewer-editor.js lab/image-viewer-editor.css lab/studio.html tests/lab-image-replacement-flow-ui.mjs tests/lab-viewer-inline.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inline-viewer-evidence
          path: /tmp/viewer-inline-evidence/
          retention-days: 2
