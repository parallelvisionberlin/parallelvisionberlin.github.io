name: Finalize approved Video visual checks
on:
  push:
    branches: [codex/video-relaxed-20261024]
    paths: [.github/workflows/video-relaxed-assemble.yml]
permissions:
  contents: write
jobs:
  finalize:
    if: github.repository == 'parallelvisionberlin/parallelvisionberlin.github.io' && github.ref == 'refs/heads/codex/video-relaxed-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/video-relaxed-20261024
          fetch-depth: 8
      - name: Align exact approved geometry without changing functional assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, hashlib, subprocess
          def edit(path, pairs):
              p=Path(path);s=p.read_text()
              for old,new in pairs:
                  assert s.count(old)==1,(path,old,s.count(old))
                  s=s.replace(old,new)
              p.write_text(s)
          edit('tests/lab-public-studio-ui.mjs',[
              ("const approvedVideoRef='c3f1a73e7d66e95f917d905ab197cfd194b6da95';","const approvedVideoRef='368d0633f048f53dad973120ce1cc444a6c5b31d';"),
              ("'lab/video-compact-studio.css','lab/video-editorial-deck.js'","'lab/video-compact-studio.css','lab/video-relaxed-studio.css','lab/video-editorial-deck.js'")])
          edit('tests/lab-studio-layout-ui.mjs',[
              ("assert.equal(d.dock.height,56,'Approved compact Generate dock retains its fixed 56px track');","assert.equal(d.dock.height,64,'Approved relaxed Generate dock retains its fixed 64px track');"),
              ("assert.equal(videoTypography.size,12,'Approved compact Video motion prompt uses 12px type');","assert.equal(videoTypography.size,14,'Approved relaxed Video motion prompt uses 14px type');"),
              ("assert.equal(d.stage.height,682,'Approved desktop stage leaves room for real History');","assert.equal(d.stage.height,744,'Approved relaxed desktop stage leaves room for real History');"),
              ("const ids=['pv-video-model-pill','duration-control','ratio-control','resolution-control','pv-video-audio-pill'];","const ids=['duration-control','ratio-control','resolution-control','pv-video-audio-pill'];"),
              ("assert.equal(outputFit.ready,true,'Reference mode has the five actual output settings');","assert.equal(outputFit.ready,true,'Reference mode has all four actual output settings');\n  assert.equal(await x.page.locator('#video-model-trigger').isVisible(),true,'The original top model selector remains accessible');\n  assert.equal(await x.page.locator('#pv-video-model-pill').isVisible(),false,'Only the duplicated model shortcut is removed from Output');"),
              ("Math.max(...outputFit.tops.slice(0,4))-Math.min(...outputFit.tops.slice(0,4))<3","Math.max(...outputFit.tops.slice(0,3))-Math.min(...outputFit.tops.slice(0,3))<3"),
              ("'Approved model, duration, ratio and resolution stay on one row: '","'Approved duration, ratio and resolution stay on one row: '"),
              ("assert.equal(outputFit.tops[4]-outputFit.tops[0],36,'Audio occupies the approved second row');","assert.equal(outputFit.tops[3]-outputFit.tops[0],46,'Audio occupies the approved relaxed second row');"),
              ("'Model, duration, ratio, resolution and audio remain usable'","'Duration, ratio, resolution and audio remain usable; the main model selector stays above'")])
          provenance=json.loads(Path('docs/previews/video-relaxed-20261024/asset-provenance.json').read_text())
          test="""import test from 'node:test';
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const read=p=>readFileSync(new URL('../'+p,import.meta.url));
          const css=read('lab/video-relaxed-studio.css').toString();
          test('relaxed Video styling is scoped and retains native capability visibility',()=>{
            assert.match(read('lab/studio.html').toString(),/video-relaxed-studio\\.css\\?v=20261024-relaxed1/);
            assert.equal((css.match(/\\{/g)||[]).length,(css.match(/\\}/g)||[]).length);
            assert.doesNotMatch(css,/image-studio-active|fashion-studio-active|upscale-studio-active|PV Motion/);
            assert.doesNotMatch(css,/pointer-events\\s*:\\s*none|overflow(?:-y)?\\s*:\\s*hidden|position\\s*:\\s*fixed/);
            assert.match(css,/#pv-video-model-pill\\{display:none!important\\}/);
            assert.match(css,/#pv-video-audio-pill:not\\(\\[hidden\\]\\)/);
            assert.match(css,/pv-video-output-collapsed/);
            assert.match(css,/:not\\(\\.pv-video-has-input\\)/);
            assert.doesNotMatch(css,/#(?:mode-extend|video-model-control|video-model-trigger)[^{]*\\{[^}]*display:none/);
            assert.match(css,/height:44px!important;min-height:44px!important;font-size:14px/);
          });
          test('approved subway artwork is local and locked, without replacing source-media logic',()=>{
            assert.equal(createHash('sha256').update(read('lab/visuals/video-subway-relaxed-approved.png')).digest('hex'),'ASSET_SHA');
            assert.match(css,/url\\('\\.\\/visuals\\/video-subway-relaxed-approved\\.png'\\)/);
            const state=read('lab/video-scene-states.js').toString();
            assert.match(state,/setModeClass\\('pv-video-has-input',hasInput\\)/);
            assert.doesNotMatch(state,/video-subway-relaxed-approved/,'Artwork never becomes a submitted source');
            assert.match(read('lab/video-editorial-deck.js').toString(),/doc\\.addEventListener\\('wheel'/,'Original wheel routing remains');
          });
          """.replace('ASSET_SHA',provenance['asset_sha256'])
          Path('tests/lab-video-relaxed.test.mjs').write_text(test)
          protected=['lab/lab.js','lab/video-editorial-deck.js','lab/video-scene-states.js','lab/video-model-picker.js','lab/video-models.js','lab/fashion.html','lab/fashion.css','lab/fashion-studio.js','lab/fashion.js']
          manifest={}
          for p in protected:
              if Path(p).exists():
                  old=subprocess.check_output(['git','show','086d5b67731684d0617279a629414cfd546aef41:'+p]);now=Path(p).read_bytes()
                  assert old==now,p+' must remain byte-identical'
                  manifest[p]=hashlib.sha256(now).hexdigest()
          Path('docs/previews/video-relaxed-20261024/unchanged-logic.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          node --test tests/lab-video-relaxed.test.mjs tests/lab-video-compact.test.mjs tests/lab-video-approved-design.test.mjs tests/lab-approved-image-ui-contract.test.mjs
          git diff --check
      - name: Commit only tests and evidence, without changing workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/lab-public-studio-ui.mjs tests/lab-studio-layout-ui.mjs tests/lab-video-relaxed.test.mjs docs/previews/video-relaxed-20261024/unchanged-logic.json
          git commit -m 'Verify relaxed Video surface while preserving all model logic'
          git push origin HEAD:codex/video-relaxed-20261024
          echo "Final candidate $(git rev-parse HEAD)"
