name: Deploy Parallel Vision Lab Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lab-worker/**'
      - 'lab/reference-guidance.js'
      - 'lab/prompt-quality.js'
      - '.github/workflows/deploy-lab-worker.yml'

permissions:
  contents: read

concurrency:
  group: parallel-vision-lab-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Cloudflare Worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Normalize Cloudflare API token
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          token="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '\r\n\t ')"
          if [ -z "$token" ]; then
            echo "CLOUDFLARE_API_TOKEN is empty"
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Test private My Moods and Worker syntax
        run: |
          node --test tests/agency-enquiries.test.mjs
          node --check lab-worker/agency-enquiries.mjs
          node --test tests/lab-smart-prompts.test.mjs tests/lab-smart-prompt-ui.test.mjs tests/lab-krea3-fashion.test.mjs
          node --test tests/lab-spicy-image-credit-steps.test.mjs tests/lab-pricing-integrity.test.mjs
          node --test tests/lab-auth.test.mjs tests/lab-worker.test.mjs tests/lab-customer-lifecycle.test.mjs tests/lab-sandbox-billing.test.mjs tests/lab-live-pilot.test.mjs tests/lab-new-models-pricing.test.mjs tests/lab-video-euro-pricing.test.mjs tests/lab-welcome-credits.test.mjs tests/lab-trial-pause.test.mjs
          node --test tests/lab-owner-providers.test.mjs tests/lab-promotions.test.mjs tests/lab-traffic.test.mjs tests/lab-traffic-ui.test.mjs tests/lab-promo-generation-holds.test.mjs tests/lab-owner-generation-review.test.mjs tests/lab-generation-finance.test.mjs
          node --test tests/lab-partner-dashboard.test.mjs
          node --check lab-worker/owner-providers.mjs
          node --check lab-worker/promotions.mjs
          node --check lab-worker/traffic.mjs
          node --check lab-worker/moodboards.mjs
          node --check lab-worker/worker.mjs
          node --check lab-worker/prompt-safety.mjs
          node --test tests/lab-prompt-safety.test.mjs
          node --check lab-worker/studio-identity-deletion.mjs
          node --test tests/lab-studio-identity-deletion.test.mjs
          node --check lab-worker/signup-welcome-email.mjs
          node --test tests/lab-signup-welcome-email.test.mjs
          node --check lab-worker/gallery-thumbnails.mjs
          node --test tests/lab-film-finish.test.mjs tests/lab-mood-references.test.mjs tests/lab-dream-blur.test.mjs
          node --test tests/lab-gallery-thumbnails.test.mjs tests/lab-moodboards.test.mjs tests/lab-mood-creator-service.test.mjs tests/lab-mood-creator-flow.test.mjs
          node --test tests/lab-element-profiles.test.mjs tests/lab-element-profile-recovery.test.mjs

      - name: Verify first-party welcome email images before sending
        shell: bash
        run: |
          set -euo pipefail
          for asset in welcome-hero-horizontal.jpg welcome-detail-1.jpg welcome-detail-2.jpg welcome-detail-3.jpg; do
            echo "Verifying https://pvlab.studio/email/$asset"
            curl --fail --location --silent --show-error \
              --retry 5 --retry-delay 3 --retry-all-errors \
              --connect-timeout 6 --max-time 20 --output /dev/null \
              "https://pvlab.studio/email/$asset"
          done

      - name: Deploy parallel-vision-lab
        uses: cloudflare/wrangler-action@v4
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          workingDirectory: lab-worker
          wranglerVersion: "4"
          preCommands: |
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0004-pv-soul.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0006-customers-billing.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0007-lab-referrals.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0008-soul-id-launch-credits.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0009-moodboards.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0010-mood-creator-analysis.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0011-customer-lifecycle.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0012-video-tiered-pricing.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0013-nano-banana-21-pricing.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0014-premium-upscale-credits.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0015-lab-promotional-credits.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0016-clerk-sync-diagnostics.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0017-clerk-domain-links.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0018-anonymous-traffic.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0019-video-value-pricing.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0020-wan-seedance-budget-pricing.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0021-spicy-image-credit-steps.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0022-mood-delivery.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0023-welcome-guard.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0024-owner-acquisition.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0025-promo-generation-holds.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0026-generation-review-audit.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0028-generation-finance-ledger.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0029-pause-welcome-promotion.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0029-pricing-debit-parity.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0030-studio-account-identity-deletion.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0035-studio-identity-cleanup-attempts.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0031-signup-welcome-email.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0032-element-visual-profiles.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0033-owner-voucher-generation.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0036-clerk-contact-hold-upsert.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0037-partner-vouchers.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0040-agency-enquiries.sql --yes
          command: deploy --keep-vars

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          expected="$(grep -o "pv-lab-[^']*" lab-worker/worker.mjs | head -n1)"
          for i in 1 2 3 4 5 6; do
            body="$(curl -fsS https://parallel-vision-lab.parallelvision.workers.dev/health || true)"
            echo "$body"
            if echo "$body" | grep -Fq "$expected"; then
              exit 0
            fi
            sleep 5
          done
          echo "Production health check did not report $expected"
          exit 1
