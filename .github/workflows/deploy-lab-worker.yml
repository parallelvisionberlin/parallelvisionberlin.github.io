name: Deploy Parallel Vision Lab Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lab-worker/**'
      - 'lab/reference-guidance.js'
      - '.github/workflows/deploy-lab-worker.yml'

permissions:
  contents: read

concurrency:
  group: parallel-vision-lab-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Cloudflare Worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize Cloudflare API token
        shell: bash
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          token="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '\r\n\t ')"
          if [ -z "$token" ]; then
            echo "CLOUDFLARE_API_TOKEN is empty"
            exit 1
          fi
          echo "::add-mask::$token"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Test private My Moods and Worker syntax
        run: |
          node --check lab-worker/moodboards.mjs
          node --check lab-worker/worker.mjs
          node --test tests/lab-moodboards.test.mjs tests/lab-mood-creator-service.test.mjs

      - name: Deploy parallel-vision-lab
        uses: cloudflare/wrangler-action@v4
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          workingDirectory: lab-worker
          wranglerVersion: "4"
          preCommands: |
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0004-pv-soul.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0006-customers-billing.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0007-lab-referrals.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0008-soul-id-launch-credits.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0009-moodboards.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0010-mood-creator-analysis.sql --yes
          command: deploy

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          expected="$(grep -o "pv-lab-[^']*" lab-worker/worker.mjs | head -n1)"
          for i in 1 2 3 4 5 6; do
            body="$(curl -fsS https://parallel-vision-lab.parallelvision.workers.dev/health || true)"
            echo "$body"
            if echo "$body" | grep -Fq "$expected"; then
              exit 0
            fi
            sleep 5
          done
          echo "Production health check did not report $expected"
          exit 1
