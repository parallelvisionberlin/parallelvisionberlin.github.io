name: Validate PV LAB Transform SpicyAPI release candidate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/release-transform-spicyapi-once.yml

permissions:
  contents: read

concurrency:
  group: parallel-vision-lab-production
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'safety/transform-worker-release-approval-20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Transform, billing, customer credits and syntax
        run: |
          set -euo pipefail
          node --check lab-worker/worker.mjs
          node --check lab-worker/seedance.mjs
          node --check lab-worker/higgsfield-video-transform.mjs
          node --check lab/lab.js
          node --test tests/lab-video-transform.test.mjs tests/lab-worker.test.mjs tests/lab-pricing-integrity.test.mjs tests/lab-video-euro-pricing.test.mjs tests/lab-generation-finance.test.mjs tests/lab-customer-lifecycle.test.mjs
      - name: Confirm this pull request performs no production release
        run: |
          echo 'PASS: validation only. No Worker deployment, migration, checkout, paid generation or production write was attempted.'
