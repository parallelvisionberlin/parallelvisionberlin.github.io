name: PV LAB Transform provider, price hold and final-credit release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-transform-spicyapi-once.yml

permissions:
  contents: read

concurrency:
  group: parallel-vision-lab-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_ACCOUNT_ID: a40ce1725295563a7b7db9fc3160480a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Transform, billing, customer credits and syntax
        run: |
          set -euo pipefail
          node --check lab-worker/worker.mjs
          node --check lab-worker/job-pricing.mjs
          node --check lab-worker/seedance.mjs
          node --check lab-worker/higgsfield-video-transform.mjs
          node --check lab/lab.js
          node --test tests/lab-video-transform.test.mjs tests/lab-video-transform-quote.test.mjs tests/lab-video-transform-settlement.test.mjs tests/lab-worker.test.mjs tests/lab-pricing-integrity.test.mjs tests/lab-video-euro-pricing.test.mjs tests/lab-generation-finance.test.mjs tests/lab-customer-lifecycle.test.mjs
      - name: Verify existing Cloudflare bindings and capture original configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync,appendFileSync} from 'node:fs';
          const token=(process.env.CLOUDFLARE_API_TOKEN||'').replace(/\s/g,'');
          if(!token)throw Error('Cloudflare deployment credential unavailable.');
          console.log('::add-mask::'+token);
          appendFileSync(process.env.GITHUB_ENV,'CLOUDFLARE_API_TOKEN='+token+'\n');
          const endpoint='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/parallel-vision-lab/settings';
          const res=await fetch(endpoint,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(25000)});
          const response=await res.json();
          if(!res.ok||!response.success||!Array.isArray(response.result?.bindings))throw Error('Could not verify existing production bindings; deploy blocked.');
          const bindings=response.result.bindings;
          for(const name of ['LAB_DB','LAB_MEDIA','OWNER_DB'])if(!bindings.some(b=>b.name===name))throw Error('Required production binding missing: '+name);
          const canon=JSON.stringify(bindings.map(b=>Object.fromEntries(Object.entries(b).sort())).sort((a,b)=>a.name.localeCompare(b.name)));
          writeFileSync(process.env.RUNNER_TEMP+'/transform-worker-bindings.json',canon);
          console.log('PASS: production Worker resources and configuration captured before release.');
          NODE
      - name: Deploy reviewed Worker with no migrations and preserved vars
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: a40ce1725295563a7b7db9fc3160480a
          workingDirectory: lab-worker
          wranglerVersion: '4'
          preCommands: |
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0062-transform-seedance-credit-parity.sql --yes
            wrangler d1 execute parallel-vision-lab --remote --file migrations/0063-transform-final-credit-settlement.sql --yes
          command: deploy --keep-vars
      - name: Verify live Transform version and configuration unchanged
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          let found=false;
          for(let attempt=0;attempt<8;attempt++){
            const res=await fetch('https://parallel-vision-lab.parallelvision.workers.dev/health',{signal:AbortSignal.timeout(15000)});
            const payload=await res.json();
            if(res.ok&&payload.ok&&payload.videoTransformProvider==='spicyapi-seedance25-edit-20261119'&&payload.videoTransformCreditRate==='20261119-seedance25-160'){found=true;break;}
            await new Promise(resolve=>setTimeout(resolve,3500));
          }
          if(!found)throw Error('Production health does not confirm SpicyAPI Transform version.');
          const token=(process.env.CLOUDFLARE_API_TOKEN||'').replace(/\s/g,'');
          const endpoint='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/parallel-vision-lab/settings';
          const res=await fetch(endpoint,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(25000)});
          const response=await res.json();
          if(!res.ok||!response.success)throw Error('Cannot verify post-deployment Cloudflare bindings.');
          const canon=JSON.stringify(response.result.bindings.map(b=>Object.fromEntries(Object.entries(b).sort())).sort((a,b)=>a.name.localeCompare(b.name)));
          if(canon!==readFileSync(process.env.RUNNER_TEMP+'/transform-worker-bindings.json','utf8'))throw Error('Production bindings changed during release.');
          const sql='SELECT sql FROM sqlite_master WHERE type=\'trigger\' AND name=\'lab_charge_job\'';
          const db=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/d1/database/36e13edc-1557-48a3-a49c-08bbc0f9618f/query',{
            method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({sql}),signal:AbortSignal.timeout(25000)});
          const dbData=await db.json();
          const dbTrigger=dbData.result?.[0]?.results?.[0]?.sql||'';
          if(!db.ok||!dbData.success||!dbTrigger.includes("'bytedance/seedance-2.5/video-edit'")||!dbTrigger.includes('THEN 160'))
            throw Error('Production D1 pricing trigger not updated for Transform.');
          const settlementSql="SELECT name FROM sqlite_master WHERE type='trigger' AND name IN ('lab_capture_transform_credit_hold','lab_refund_transform_finance_insert','lab_refund_transform_finance_update') ORDER BY name";
          const settlementRes=await fetch('https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/d1/database/36e13edc-1557-48a3-a49c-08bbc0f9618f/query',{
            method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
            body:JSON.stringify({sql:settlementSql}),signal:AbortSignal.timeout(25000)});
          const settlementData=await settlementRes.json();
          const triggers=(settlementData.result?.[0]?.results||[]).map(x=>x.name);
          if(!settlementRes.ok||!settlementData.success||
            ['lab_capture_transform_credit_hold','lab_refund_transform_finance_insert','lab_refund_transform_finance_update'].some(name=>!triggers.includes(name)))
            throw Error('Production D1 final-cost refund triggers missing.');
          console.log('WORKER/DB VERIFIED: SpicyAPI Transform 160-credit Worker, D1 debit and settlement refund triggers present; Cloudflare settings preserved. No checkout or paid generation executed.');
          NODE
