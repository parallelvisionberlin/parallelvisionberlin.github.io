name: ALTER save verified review
on:
  push:
    branches: [implement/alter-approved-20261106]
    paths: [.github/workflows/alter-final-review.yml]
concurrency:
  group: alter-save-verified-review
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 80
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Save identical tested application bytes, correcting only record timestamp
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,urllib.request
          tested='e7f69ef742aaa40805b41265647b9817b1c5adfa'
          main='226aa6db5dcd8341e0618dea7f48eeafba6f2239'
          request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/jobs/128174542572',headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GITHUB_TOKEN']})
          with urllib.request.urlopen(request,timeout=20) as response:job=json.load(response)
          assert job['head_sha']==tested
          steps={s['name']:s['conclusion'] for s in job['steps']}
          assert steps['Full original Beauty regression and Studio navigation']=='success'
          assert steps['Apply narrow corrections and preserve private request assertions']=='success'
          text=subprocess.check_output(['git','show',tested+':.github/workflows/alter-final-review.yml'],text=True)
          lines=text.splitlines()
          def block(name):
            start=lines.index('      - name: '+name)
            start=next(i for i in range(start+1,len(lines)) if lines[i]=='        run: |')+1
            result=[]
            for line in lines[start:]:
              if line and not line.startswith('          '):break
              result.append(line[10:] if line else '')
            assert result
            return '\n'.join(result)
          reconcile=block('Reconcile current main and preserve concurrent records')
          reconcile=reconcile.replace('git fetch origin main --depth=80','git fetch origin '+main+' --depth=80\ngit update-ref refs/remotes/origin/main '+main)
          subprocess.run(['bash','-e','-c',reconcile],check=True)
          subprocess.run(['bash','-e','-c',block('Apply narrow corrections and preserve private request assertions')],check=True)
          save=block('Record actual successful tests and save review source')
          save=save.replace("datetime.datetime.now(datetime.timezone.utc).isoformat()","datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')")
          save=save.replace("os.environ['GITHUB_RUN_ID']","'42299866022'")
          os.makedirs('test-results',exist_ok=True)
          subprocess.run(['bash','-e','-c',save],check=True)
          PY
