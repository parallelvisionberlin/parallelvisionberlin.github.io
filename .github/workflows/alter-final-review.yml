name: ALTER final scoped review
on:
  push:
    branches: [implement/alter-approved-20261106]
    paths: [.github/workflows/alter-final-review.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Measure control placement relative to its panel, not mobile scroll
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/lab-beauty-ui.mjs');s=p.read_text()
          old="const quoted=s.quotes.length,buttonBefore=await page.locator('#beauty-generate').boundingBox();"
          new="const buttonGeometry=()=>page.locator('#beauty-generate').evaluate(button=>{const a=button.getBoundingClientRect(),b=button.closest('.beauty-edit-panel').getBoundingClientRect();return {x:a.left-b.left,y:a.top-b.top,width:a.width,height:a.height};});\n  const quoted=s.quotes.length,buttonBefore=await buttonGeometry();"
          assert s.count(old)==1;s=s.replace(old,new)
          old="assert.deepEqual(await page.locator('#beauty-generate').boundingBox(),buttonBefore,'Generate placement stays stable across tabs');"
          new="assert.deepEqual(await buttonGeometry(),buttonBefore,'Generate placement stays stable across tabs');"
          assert s.count(old)==1;p.write_text(s.replace(old,new))
          PY
          node --check tests/lab-beauty-ui.mjs
          node --test tests/lab-approved-image-ui-contract.test.mjs tests/lab-beauty.test.mjs tests/lab-beauty-atelier.test.mjs
          node --test --test-name-pattern='Beauty Studio binds' tests/lab-worker.test.mjs
      - name: Install pinned browser
        run: |
          npm install --prefix /tmp/pv-beauty --no-audit --no-fund playwright@1.57.0
          node /tmp/pv-beauty/node_modules/playwright/cli.js install --with-deps chromium
      - name: Complete existing Beauty regression
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-beauty/node_modules/playwright/index.mjs
        run: |
          node tests/lab-studios-menu-ui.mjs
          node tests/lab-beauty-ui.mjs
      - name: Save tested correction and remove temporary reviewer
        run: |
          test "$GITHUB_REF" = refs/heads/implement/alter-approved-20261106
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/lab-beauty-ui.mjs
          git rm .github/workflows/alter-final-review.yml
          git diff --cached --check
          git commit -m 'Verify ALTER controls independent of mobile viewport scrolling'
          git rev-parse HEAD
          git push origin HEAD:refs/heads/implement/alter-approved-20261106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alter-final-review-evidence
          path: test-results/beauty-*.png
          retention-days: 3
