name: Deploy Nina Instagram

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'nina-instagram/worker.mjs'
      - 'nina-instagram/worker.test.mjs'
      - 'nina-instagram/deploy.mjs'
      - 'nina-instagram/deploy.test.mjs'
      - 'nina-instagram/dialogue-eval.mjs'
      - '.github/workflows/deploy-nina-instagram.yml'

permissions:
  contents: read

concurrency:
  group: parallel-vision-nina-instagram-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test Instagram replies and deployment guards
        run: |
          node --check nina-instagram/worker.mjs
          node --check nina-instagram/deploy.mjs
          node --test nina-instagram/worker.test.mjs nina-instagram/deploy.test.mjs
      - name: Deploy existing Nina Instagram and verify public mode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node nina-instagram/dialogue-eval.mjs
          node nina-instagram/deploy.mjs
