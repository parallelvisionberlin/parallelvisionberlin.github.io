name: Publish and verify clicked-subject selection fix
on:
  push:
    branches: [verify/replace-audit-published-20261108]
    paths: [.github/workflows/release-click-target-fix.yml]
permissions:
  contents: write
  actions: read
  checks: read
concurrency:
  group: parallel-vision-lab-production
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Require reviewed PR tests and unchanged merged source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          root='https://api.github.com/repos/parallelvisionberlin/parallelvisionberlin.github.io'
          def get(path):
            q=urllib.request.Request(root+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
            with urllib.request.urlopen(q,timeout=20) as r:return json.load(r)
          r=get('/actions/runs/42477644835')
          assert r['head_sha']=='a1c8c4f2d461f5fe7e0437d532e4ab1077b5d252' and r['conclusion']=='success','PR browser/selection gate has not passed'
          assert get('/git/ref/heads/main')['object']['sha']=='8ac47aa373faff31d3d57459e1c9c4ae7b4df942','Main changed; review before deployment'
          print('EXACT_PR_GATE_PASSED')
          PY
      - uses: actions/checkout@v4
        with:
          ref: 8ac47aa373faff31d3d57459e1c9c4ae7b4df942
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Run the existing production gate without changing its assertions
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {spawnSync} from 'node:child_process';
          const y=readFileSync('.github/workflows/deploy-lab-worker.yml','utf8');
          const a=y.indexOf('      - name: Test private My Moods and Worker syntax'),b=y.indexOf('      - name:',a+20);
          const commands=y.slice(a,b).split('        run: |\n')[1]?.split('\n').filter(x=>x.startsWith('          ')).map(x=>x.slice(10)).join('\n');
          if(!commands?.includes('tests/lab-worker.test.mjs'))throw Error('Missing production test gate');
          const r=spawnSync('bash',['-euo','pipefail','-c',commands],{encoding:'utf8',maxBuffer:20*1024*1024});
          console.log((r.stdout||'').split('\n').filter(x=>/^# (tests|pass|fail)|^not ok /.test(x)).join('\n'));
          if(r.status!==0){console.error((r.stderr||'').slice(-3000));process.exit(r.status||1);}
          console.log('PRODUCTION_TEST_GATE_PASSED');
          JS
          node --test tests/lab-sam-click-mask.test.mjs tests/lab-image-replacement-backend.test.mjs tests/lab-precision-edit.test.mjs
      - name: Install the already-reviewed pinned deployment tool without production credentials
        run: npm install --prefix "$RUNNER_TEMP/pvlab-wrangler" --ignore-scripts --no-audit --no-fund wrangler@4.158.0
      - name: Deploy code only using the guarded reviewed release procedure
        id: backend
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a40ce1725295563a7b7db9fc3160480a
          WRANGLER_SEND_METRICS: 'false'
          CLOUDFLARE_LOAD_DEV_VARS_FROM_DOT_ENV: 'false'
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,base64,hashlib,pathlib,textwrap,subprocess
          root='https://api.github.com/repos/parallelvisionberlin/parallelvisionberlin.github.io'
          req=urllib.request.Request(root+'/git/blobs/f391ade9f5a87d989face4fff22913badf67a986',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req,timeout=20) as r:j=json.load(r)
          raw=base64.b64decode(j['content'])
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()=='f391ade9f5a87d989face4fff22913badf67a986'
          y=raw.decode();a=y.index('      - name: Preserve live configuration, build, deploy once and verify exact code')
          script=textwrap.dedent(y[a:].split('        run: |\n',1)[1]).split("python3 - <<'PY'\n",1)[1].rsplit('\nPY',1)[0]
          def replace(a,b):
            global script
            assert script.count(a)==1,'Release template changed: '+a[:70]
            script=script.replace(a,b)
          replace("expected_version='b71347b9-3ffb-42dd-a4d9-83a542b11cea'","expected_version='e939d968-afd1-4432-a9ed-a7a128a472b2'")
          replace("expected_deployment='51d4bf62-0c47-4176-9373-ca1eabb50be7'","expected_deployment=None")
          replace("source_sha='64b9e080df47854a6b5ee1fde1451ddc0fed3058'","source_sha='8ac47aa373faff31d3d57459e1c9c4ae7b4df942'")
          replace('def check_old():',"expected_deployment=active()['id']\ndef check_old():")
          replace("b'Unsupported targeted selection' in p.read_bytes()","b'Candidate selection requires a clicked face or person.' in p.read_bytes()")
          replace('compiled=candidates[0]\ncheck_old()',"compiled=candidates[0]\nassert b'candidates-v1' in compiled,'Candidate ticket protection missing'\ncheck_old()\nassert {x['name']:x for x in get('/settings')['bindings']}==by_name,'Live settings changed while building; stop'")
          replace("with urllib.request.urlopen('https://parallel-vision-lab.parallelvision.workers.dev/health',timeout=20) as r:health=json.load(r)","health=json.loads(subprocess.check_output(['curl','--fail','--silent','--show-error','--max-time','20','-H','Origin: https://pvlab.studio','-A','PV-LAB-release-verifier/1.0','https://parallel-vision-lab.parallelvision.workers.dev/health']))")
          replace("with urllib.request.urlopen('https://parallel-vision-lab.parallelvision.workers.dev/api/music/public/status',timeout=20) as r:music=json.load(r)","music=json.loads(subprocess.check_output(['curl','--fail','--silent','--show-error','--max-time','20','-H','Origin: https://pvlab.studio','-A','PV-LAB-release-verifier/1.0','https://parallel-vision-lab.parallelvision.workers.dev/api/music/public/status']))")
          assert subprocess.check_output(['git','hash-object','lab-worker/precision-edit.mjs'],text=True).strip()=='0cd8855a59ec004931fae0780fb8920928b91e44'
          exec(compile(script,'reviewed-code-only-release','exec'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('version='+new_version+'\n')
          print('CLICKED_SUBJECT_BACKEND_VERIFIED',new_version)
          PY
      - name: Verify Cloudflare Pages and exact public browser assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {verifyRelease,productionUrl} from './.github/scripts/verify-pvlab-release.mjs';
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const sha='8ac47aa373faff31d3d57459e1c9c4ae7b4df942',hash=b=>createHash('sha256').update(b).digest('hex');
          const html=readFileSync('lab/studio.html','utf8');
          const entry=[...html.matchAll(/<(?:script|link)\b[^>]*\b(?:src|href)=["']([^"']+)["']/g)].map(m=>new URL(m[1].replaceAll('&amp;','&'),productionUrl)).find(u=>u.pathname==='/lab.js');
          if(!entry||entry.searchParams.get('clickSelection')!=='20261108-click1')throw Error('Expected selection entrypoint missing');
          let proof;
          for(let i=0;i<9;i++){
            proof=await verifyRelease({sha,asset:'lab/lab.js',version:entry.searchParams.get('v'),sourceBytes:readFileSync('lab/lab.js')});
            if(proof.state==='LIVE_VERIFIED')break;
            console.log('PUBLICATION_CHECK',proof.state);
            if(i<8)await new Promise(r=>setTimeout(r,10000));
          }
          if(proof.state!=='LIVE_VERIFIED')throw Error('Frontend publication not verified: '+proof.state);
          for(const [file,url] of [['lab/precision-edit.js','/precision-edit.js?v=20261108-click1'],['lab/sam-click-mask.js','/sam-click-mask.js?v=20261108-click1']]){
            const r=await fetch(new URL(url,productionUrl),{cache:'no-store',signal:AbortSignal.timeout(20000)});
            if(!r.ok)throw Error('Missing live module '+file);
            if(hash(Buffer.from(await r.arrayBuffer()))!==hash(readFileSync(file)))throw Error('Live module differs from tested source: '+file);
            console.log('LIVE_VERIFIED',file);
          }
          console.log('CLICKED_SUBJECT_FRONTEND_VERIFIED',sha);
          JS
      - name: Save verified release evidence in the existing scoped work record
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER_VERSION: ${{ steps.backend.outputs.version }}
        run: |
          python3 - <<'PY'
          import pathlib,json,os,datetime,subprocess,urllib.request
          root='https://api.github.com/repos/parallelvisionberlin/parallelvisionberlin.github.io';head='8ac47aa373faff31d3d57459e1c9c4ae7b4df942'
          proof='https://github.com/parallelvisionberlin/parallelvisionberlin.github.io/actions/runs/'+os.environ['GITHUB_RUN_ID']
          now=datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='milliseconds').replace('+00:00','Z')
          def api(path,method='GET',data=None):
            req=urllib.request.Request(root+path,method=method,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=20) as r:return json.load(r)
          assert api('/git/ref/heads/main')['object']['sha']==head,'Main changed; preserve newer work'
          p=pathlib.Path('lab/owner-work-records.json');j=json.loads(p.read_text());record=next(x for x in j['records'] if x['id']=='image-viewer-replace-edit-actions')
          record['updatedAt']=now;record['reviewedSha']=head;record['status']='deployed';record['branch']='fix/replace-click-target-20261108'
          record['summary']='PR #927 fixes wrong-person Face selection and the Whole person inverted background. Character masks are matched to the actual foreground click; missed candidates fail without modifying the previous selection. Outfit and Object request behavior remains unchanged. Frontend and code-only Worker publication verified.'
          record['nextAction']='Confirm Face/Whole person selection once in the signed-in viewer after refresh. No token changes or deployment actions required from owner. Separately audit genuine mask-aware replacement generation; the prior bad Alma result is not fixed by this selection release.'
          record['blockers']=['Real-provider mask quality on the user photo is not tested by the synthetic regression suite.','Unmasked Seedream replacement quality for overlapping people remains unresolved.']
          record['deployment']={'state':'verified','sourceSha':head,'environment':'pvlab.studio Cloudflare Pages and parallel-vision-lab Worker','observedAt':now,'evidenceUrl':proof,'limitations':['Worker version '+os.environ['WORKER_VERSION']+' and exact public browser bytes verified.','No real-account or paid-provider generation; this is a selection-routing fix, not a replacement-quality claim.']}
          record['tests'].append({'label':'Clicked subject selection regression and publication','result':'passed','scope':'66 focused checks and 113 Worker tests in preparation; permanent PR Precision workflow passed real mouse/zoom synthetic left-right scenes plus existing editor flows; existing production gate passed; exact frontend and Worker build/health verified.','source':proof,'observedAt':now})
          record['evidence'].append({'kind':'production_asset','summary':'Merged PR #927; code-only Worker published and exact compiled bytes, live health and public frontend modules verified.','scope':'Face and Whole person click targeting; no migrations, provider jobs, layout or credit-rule changes.','source':proof,'observedAt':now,'limitations':['Synthetic masks validate application routing only, not model output quality.']})
          for path in ['lab/sam-click-mask.js','tests/lab-sam-click-mask.test.mjs','tests/lab-sam-click-mask-ui.mjs']:
            if path not in record['files']:record['files'].append(path)
          j['updatedAt']=now;p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          q=pathlib.Path('lab/IMAGE-REPLACEMENT-WORK-STATE.md');old=q.read_text();assert old.startswith('# Image replacement flow\n')
          note='\n'.join(['## Latest clicked-subject fix, 2026-11-08','', '- PR #927, reviewed source `'+head+'`. Frontend and Worker version `'+os.environ['WORKER_VERSION']+'` published and independently verified by exact bytes/health.', '- Removes automatic mask inversion. Every accepted mask must contain the clicked foreground. Face/Whole person retrieve at most eight separate semantic masks in one inference, then match the actual click instead of a guessed detection ID. Wrong or unclear masks leave the prior selection intact.', '- Outfit/Object retain their existing single-mask requests. Signed candidate tickets, account ownership, metered quotas, private mask storage, bounded downloads and no automatic paid retries are covered by regression tests. No database migration.', '- Regression checks include left/right provider-order reversal, Whole person from face click, background rejection, alpha masks, holes, browser zoom, mobile/desktop and existing Retouch/replacement flows.', '- Evidence: '+proof, '- The existing token is valid. No owner credential or Cloudflare configuration task remains. Actual model result quality and true mask-aware identity generation remain separate unresolved work. No paid provider calls during this release.','', '## Earlier release notes',''])
          q.write_text('# Image replacement flow\n\n'+note+'\n'+old.split('\n',1)[1].lstrip())
          subprocess.run(['node','scripts/owner-work-state.mjs','validate'],check=True)
          subprocess.run(['node','--test','tests/owner-work-state.test.mjs'],check=True,stdout=subprocess.DEVNULL)
          entries=[]
          for path in [str(p),str(q)]:
            b=api('/git/blobs','POST',{'content':pathlib.Path(path).read_text(),'encoding':'utf-8'});entries.append({'path':path,'mode':'100644','type':'blob','sha':b['sha']})
          old=api('/git/commits/'+head);tree=api('/git/trees','POST',{'base_tree':old['tree']['sha'],'tree':entries})
          commit=api('/git/commits','POST',{'message':'[CF-Pages-Skip] Record verified clicked-subject fix and remaining quality limitation','tree':tree['sha'],'parents':[head]})
          assert api('/git/ref/heads/main')['object']['sha']==head,'Main changed; do not overwrite'
          api('/git/refs/heads/main','PATCH',{'sha':commit['sha'],'force':False})
          print('SCOPED_RELEASE_RECORD_SAVED',commit['sha'])
          PY
