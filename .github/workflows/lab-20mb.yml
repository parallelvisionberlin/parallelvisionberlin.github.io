name: Raise Lab image upload limit to 20 MB
on:
  push:
    branches: ['lab/20mb-images-20260926']
    paths: ['.github/workflows/lab-20mb.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lab/20mb-images-20260926
          sparse-checkout: |
            lab
            lab-worker
            tests
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply provider-aligned 20 MB limit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lab-worker/worker.mjs')
          s=p.read_text()
          old="const MAX_IMAGE = 10 * 1024 * 1024"
          assert old in s
          p.write_text(s.replace(old,"const MAX_IMAGE = 20 * 1024 * 1024"))
          p=Path('lab/lab.js')
          s=p.read_text()
          old="candidate.size>10*1024*1024)throw new Error('Choose a JPG, PNG or WebP image up to 10 MB.')"
          assert old in s
          p.write_text(s.replace(old,"candidate.size>20*1024*1024)throw new Error('Choose a JPG, PNG or WebP image up to 20 MB.')"))
          p=Path('lab/README.md')
          s=p.read_text()
          marker="Video: Wan 3.0 start-frame animation, optional last frame, or up to ten reference images."
          assert marker in s
          p.write_text(s.replace(marker,marker+" Wan 3.0 accepts source stills up to 20 MB each through the Lab's signed HTTPS input URLs."))
          PY
          grep -F "MAX_IMAGE = 20 * 1024 * 1024" lab-worker/worker.mjs
          grep -F "up to 20 MB" lab/lab.js
      - name: Verify
        run: |
          node --check lab/lab.js
          node --check lab-worker/worker.mjs
          node --test tests/lab-worker.test.mjs
      - name: Commit tested change
        run: |
          git rm .github/workflows/lab-20mb.yml
          git add lab/lab.js lab/README.md lab-worker/worker.mjs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Allow Wan source images up to 20 MB'
          git push origin HEAD:lab/20mb-images-20260926
