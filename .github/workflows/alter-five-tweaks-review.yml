name: ALTER five photo references review
on:
  push:
    branches: [fix/alter-five-preview-tweaks-20261107]
    paths: [.github/workflows/alter-five-tweaks-review.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply exactly five previously approved preview images
        run: |
          curl --fail --location --silent --show-error 'https://at.adobe.com/maDAQFtteGzBIqFO' -o /tmp/alter-five.zip
          echo 'e7a1e02be75d199ef188e11f454f9c5f53eeb05cd5fd0f5173f4c383ded1964f  /tmp/alter-five.zip' | sha256sum --check
          mkdir -p /tmp/alter-five
          unzip -q /tmp/alter-five.zip -d /tmp/alter-five
          sha256sum lab/beauty-settings.js lab/beauty-approved-20261029.js lab/beauty-editorial-final.css lab/beauty-flow-refinement.css lab/visuals/beauty/atelier/hero.webp > /tmp/alter-locked.sha256
          python3 /tmp/alter-five/apply.py
          cp /tmp/alter-five/test-preview.mjs tests/lab-beauty-five-preview-fixes.test.mjs
          sha256sum --check /tmp/alter-locked.sha256
          node --check tests/lab-beauty-five-preview-fixes.test.mjs
          node --check lab/beauty-look-catalog.js
          git diff --check
      - name: All five mapping checks, existing price and Worker contracts
        run: |
          node --test tests/lab-beauty-five-preview-fixes.test.mjs tests/lab-beauty-light-color-previews.test.mjs tests/lab-beauty-category-contract.test.mjs tests/lab-beauty-archive-curation.test.mjs tests/lab-beauty.test.mjs tests/lab-beauty-atelier.test.mjs tests/lab-approved-image-ui-contract.test.mjs
          node --test --test-name-pattern='Beauty Studio binds' tests/lab-worker.test.mjs
      - name: Browser regression (all requests intercepted)
        run: |
          npm install --prefix /tmp/pv-beauty --no-audit --no-fund playwright@1.57.0
          node /tmp/pv-beauty/node_modules/playwright/cli.js install chromium
          PV_PLAYWRIGHT_MODULE=/tmp/pv-beauty/node_modules/playwright/index.mjs node tests/lab-beauty-ui.mjs
      - name: Commit only tested preview pictures and references, never backend
        run: |
          test "$GITHUB_REF" = refs/heads/fix/alter-five-preview-tweaks-20261107
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lab/beauty.html lab/beauty-look-catalog.js tests/lab-beauty-five-preview-fixes.test.mjs lab/visuals/beauty/atelier/alter-light-flash-fixed-20261107.webp lab/visuals/beauty/atelier/alter-light-high-key-fixed-20261107.webp lab/visuals/beauty/atelier/alter-color-warm-fixed-20261107.webp lab/visuals/beauty/atelier/alter-color-film-fixed-20261107.webp lab/visuals/beauty/atelier/alter-color-soft-film-fixed-20261107.webp
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          paths=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert len(paths)==8,paths
          assert sum(p.endswith('.webp') for p in paths)==5
          assert {p for p in paths if not p.endswith('.webp')} == {'lab/beauty.html','lab/beauty-look-catalog.js','tests/lab-beauty-five-preview-fixes.test.mjs'}
          PY
          git commit -m 'Replace five misleading ALTER Light and Color example photographs'
          git push origin HEAD:refs/heads/fix/alter-five-preview-tweaks-20261107
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alter-five-tweaks-screenshots
          path: test-results/beauty-category-*.png
          retention-days: 3
