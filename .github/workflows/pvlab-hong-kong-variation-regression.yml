name: Hong Kong Nights variation regression
on:
  push:
    branches:
      - feature/hong-kong-night-analog-looks-20261018
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analog-mood-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Hong Kong Nights source syntax
        run: |
          node --check lab/hong-kong-presets.js
          node --check lab/moods.js
          node --check lab/mood-references.js
          node --check lab-worker/worker.mjs
      - name: Run focused Mood and reference tests
        run: |
          node --test tests/lab-hong-kong-variations.test.mjs tests/lab-mood-references.test.mjs tests/lab-hong-kong-continuity.test.mjs tests/lab-moods.test.mjs tests/lab-film-finish.test.mjs
