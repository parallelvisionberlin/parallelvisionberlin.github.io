name: Release Upscaler MOV Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parallel-vision-lab-production
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: a40ce1725295563a7b7db9fc3160480a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test model routing, existing Image contract and money safeguards
        run: |
          node --check lab-worker/worker.mjs
          node --test tests/lab-video-upscale.test.mjs tests/lab-new-models-pricing.test.mjs
          node --test tests/lab-approved-image-ui-contract.test.mjs tests/lab-model-labels.test.mjs tests/lab-flash-default-2k.test.mjs tests/lab-image-submit-handoff.test.mjs tests/lab-inspiration-rotation.test.mjs tests/lab-worker.test.mjs tests/lab-spicy-image-credit-steps.test.mjs tests/lab-pricing-integrity.test.mjs tests/lab-generation-finance.test.mjs tests/lab-customer-lifecycle.test.mjs tests/lab-image-replacement.test.mjs
      - name: Capture live configuration and verify expected resource bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync, appendFileSync } from 'node:fs';
          const token=(process.env.CLOUDFLARE_API_TOKEN||'').replace(/\s/g,'');
          if(!token)throw Error('Cloudflare token is empty.');
          console.log('::add-mask::'+token);
          appendFileSync(process.env.GITHUB_ENV, 'CLOUDFLARE_API_TOKEN='+token+'\n');
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/parallel-vision-lab';
          async function get(path){const r=await fetch(root+path,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(30000)});const b=await r.json();if(!r.ok||!b.success)throw Error('Cloudflare read failed: '+r.status);return b.result;}
          const settings=await get('/settings');
          const expected=['AI','IMAGES','LAB_DB','LAB_MEDIA','OWNER_DB'];
          const resources=settings.bindings.filter(b=>!['plain_text','secret_text'].includes(b.type)).map(b=>b.name).sort();
          if(JSON.stringify(resources)!==JSON.stringify(expected))throw Error('Live resource bindings differ from reviewed configuration; stopping before deployment.');
          const canonical=bindings=>JSON.stringify(bindings.map(b=>Object.fromEntries(Object.entries(b).sort())).sort((a,b)=>a.name.localeCompare(b.name)));
          writeFileSync(process.env.RUNNER_TEMP+'/upscale-mov-bindings.json',canonical(settings.bindings));
          const deployments=await get('/deployments');
          writeFileSync(process.env.RUNNER_TEMP+'/upscale-mov-previous-deployment.json',JSON.stringify(deployments));
          console.log('PASS: live resource bindings match; previous deployment captured.');
          console.log('Previous deployment versions: '+JSON.stringify(deployments.deployments?.[0]?.versions||[]));
          NODE
      - name: Deploy reviewed Worker without migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: a40ce1725295563a7b7db9fc3160480a
          workingDirectory: lab-worker
          wranglerVersion: '4'
          command: deploy --keep-vars
      - name: Verify exact model capability and preserved live settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const url='https://parallel-vision-lab.parallelvision.workers.dev/health';
          let ready=false;
          for(let attempt=0;attempt<6;attempt++){
            const r=await fetch(url,{signal:AbortSignal.timeout(20000)});const b=await r.json();
            if(r.ok&&b.ok&&b.videoUpscaleInputs==='20261118-mp4-mov-1'){ready=true;console.log('PASS: production health reports exact MP4/MOV upscaler capability.');break;}
            await new Promise(resolve=>setTimeout(resolve,5000));
          }
          if(!ready)throw Error('MOV capability health marker is not live.');
          const token=(process.env.CLOUDFLARE_API_TOKEN||'').replace(/\s/g,'');
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/parallel-vision-lab/settings';
          const r=await fetch(root,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(30000)});const b=await r.json();
          if(!r.ok||!b.success)throw Error('Cannot verify preserved settings.');
          const canonical=bindings=>JSON.stringify(bindings.map(b=>Object.fromEntries(Object.entries(b).sort())).sort((a,b)=>a.name.localeCompare(b.name)));
          if(canonical(b.result.bindings)!==readFileSync(process.env.RUNNER_TEMP+'/upscale-mov-bindings.json','utf8'))throw Error('Production bindings or settings changed.');
          console.log('PASS: all production bindings, variables and secret names preserved.');
          console.log('No migrations, paid generations, payments or credit grants were run.');
          NODE
