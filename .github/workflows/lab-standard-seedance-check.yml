name: Verify standard Seedance integration
on:
  push:
    branches: ['feat/lab-seedance-25-20260927']
    paths: ['.github/workflows/lab-standard-seedance-check.yml', 'scripts/lab-seedance-*.py']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            lab
            lab-worker
            tests
            js
            scripts
            .github/workflows
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply inspected standard-model changes
        run: |
          python3 scripts/lab-seedance-prepare.py
          python3 scripts/lab-seedance-tests.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/lab-seedance-ui.mjs')
          s=p.read_text()
          s=s.replace("const motion=readFileSync('test-results/seedance-motion.mp4');", """const {execFileSync}=await import('node:child_process');
          mkdirSync('test-results',{recursive:true});
          if(!existsSync('test-results/seedance-motion.mp4'))execFileSync('ffmpeg',['-hide_banner','-loglevel','error','-f','lavfi','-i','color=c=gray:s=320x320:r=24:d=3','-an','-c:v','libx264','-pix_fmt','yuv420p','-movflags','+faststart','-y','test-results/seedance-motion.mp4']);
          const motion=readFileSync('test-results/seedance-motion.mp4');""")
          p.write_text(s)
          PY
          git diff --check
      - name: Syntax and backend regression tests with mock provider
        run: |
          find lab lab-worker -type f \( -name '*.js' -o -name '*.mjs' \) -exec node --check {} \;
          node --test tests/lab*.test.mjs
      - name: Prepare isolated browser tests
        run: |
          npm install --prefix /tmp/pv-standard-ui --no-save playwright@1.57.0
          node /tmp/pv-standard-ui/node_modules/playwright/cli.js install --with-deps chromium
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - name: Existing and standard Seedance browser tests, no live generation calls
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-standard-ui/node_modules/playwright/index.mjs
        run: |
          node tests/lab-image-oneclick-ui.mjs
          node tests/lab-upscale-ui.mjs
          node tests/lab-reference-ui.mjs
          node tests/lab-seedance-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: standard-seedance-verification
          retention-days: 1
          path: |
            test-results/*.png
            lab/*.js
            lab/*.html
            lab/*.css
            lab/README.md
            lab-worker/*.mjs
            tests/lab-seedance*.mjs
      - name: Commit only tested application changes
        run: |
          git config user.name 'ParallelVision'
          git config user.email 'parallelvision.label@gmail.com'
          git rm scripts/lab-seedance-prepare.py scripts/lab-seedance-tests.py .github/workflows/lab-standard-seedance-check.yml
          git add lab lab-worker/worker.mjs tests/lab-seedance.test.mjs tests/lab-seedance-ui.mjs
          git commit -m 'Integrate standard Seedance 2.5 with private references and exact-quote confirmation'
          git push origin HEAD:feat/lab-seedance-25-20260927
