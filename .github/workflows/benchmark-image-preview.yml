name: Benchmark Image Deck reference preview
on:
  pull_request:
    paths:
      - 'lab/image-tools.js'
      - 'lab/image-worker.js'
      - 'tests/lab-image-preview-benchmark.mjs'
      - '.github/workflows/benchmark-image-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Chromium test runner
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install chromium --with-deps
      - name: Compare baseline and candidate real browser thumbnail timing
        env:
          PV_PLAYWRIGHT_MODULE: ${{ github.workspace }}/node_modules/playwright/index.mjs
        run: node tests/lab-image-preview-benchmark.mjs
