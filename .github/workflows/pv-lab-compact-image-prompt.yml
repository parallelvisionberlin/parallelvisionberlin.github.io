name: PV Lab compact Image prompt browser regression
on:
  pull_request:
    paths:
      - 'lab/lab.js'
      - 'lab/higgsfield.css'
      - 'lab/studio.html'
      - 'tests/lab-image-prompt-dock-ui.mjs'
      - 'tests/lab-customer-image-ui.mjs'
      - 'lab/customer-image-pricing.js'
      - 'lab/image-credit-preview.js'
      - '.github/workflows/pv-lab-compact-image-prompt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compact-image-prompt:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Use the hosted runner Chrome for mocked browser checks
        run: |
          npm install --prefix /tmp/pv-image-prompt-check --no-save --no-audit --no-fund playwright@1.57.0
          chrome="${CHROME_BIN:-/usr/bin/google-chrome}"
          test -x "$chrome"
          "$chrome" --version
          echo "PV_CHROMIUM_EXECUTABLE=$chrome" >> "$GITHUB_ENV"
          cat > /tmp/pv-image-prompt-check/chromium.mjs <<'JS'
          import {chromium as engine} from './node_modules/playwright/index.mjs';
          export const chromium={launch:options=>engine.launch({...options,executablePath:process.env.PV_CHROMIUM_EXECUTABLE})};
          JS
      - name: Test long prompt paste with independent scrolling and visible controls
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-image-prompt-check/chromium.mjs
        run: node tests/lab-image-prompt-dock-ui.mjs
      - name: Test customer credit preview, quote reuse and aspect defaults
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-image-prompt-check/chromium.mjs
        run: node tests/lab-customer-image-ui.mjs
      - name: Retain desktop and mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pv-image-compact-long-prompt-previews
          path: test-results/pv-compact-composer-*.png
          retention-days: 2
