name: PV Lab landing load stability
on:
  pull_request:
    paths: ['lab/index.html', 'lab/landing*.css', 'lab/homepage-unified.css', 'lab/credits.css', 'lab/studio-credits.css', 'lab/customer-entry.js', 'lab/fonts/**', 'tests/lab-landing-stability.mjs', 'tests/lab-home-credit-banner-browser.mjs', '.github/workflows/lab-landing-stability.yml']
  push:
    branches: [main]
    paths: ['lab/index.html', 'lab/landing*.css', 'lab/homepage-unified.css', 'lab/credits.css', 'lab/studio-credits.css', 'lab/customer-entry.js', 'lab/fonts/**', 'tests/lab-landing-stability.mjs', 'tests/lab-home-credit-banner-browser.mjs', '.github/workflows/lab-landing-stability.yml']
permissions:
  contents: read
jobs:
  landing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            lab
            tests
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/pv-landing --no-audit --no-fund playwright@1.62.1
      - run: /tmp/pv-landing/node_modules/.bin/playwright install --with-deps chromium
      - run: node tests/lab-landing-stability.mjs
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-landing/node_modules/playwright/index.mjs
          PV_UI_ARTIFACTS: /tmp/pv-landing-screenshots
      - run: node tests/lab-home-credit-banner-browser.mjs
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-landing/node_modules/playwright/index.mjs
          PV_UI_ARTIFACTS: /tmp/pv-landing-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-load-stability
          path: /tmp/pv-landing-screenshots
          retention-days: 1
