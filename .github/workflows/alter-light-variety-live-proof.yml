name: ALTER two Light previews production proof
on:
  push:
    branches: [verify/alter-light-variety-20261107]
    paths: [.github/workflows/alter-light-variety-live-proof.yml]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a5392cfdcb39d3ed5d4c485df47edb08ba49e8e7
      - name: Confirm both published Light photographs byte-for-byte
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,urllib.request
          src=Path('lab/beauty.html').read_text()
          pairs={
            'side':'alter-light-side-editorial-20261107.webp',
            'rim':'alter-light-rim-editorial-20261107.webp'
          }
          def get(path):
            r=urllib.request.Request('https://pvlab.studio'+path,headers={'User-Agent':'Mozilla/5.0 (PVLAB ALTER read-only verification)','Cache-Control':'no-cache'})
            with urllib.request.urlopen(r,timeout=25) as res:return res.read()
          live=get('/beauty').decode('utf-8')
          for option,name in pairs.items():
            path='./visuals/beauty/atelier/'+name
            assert src.count(path)==1 and path in live, (option,'missing active card reference')
            assert f'data-beauty-choice="beauty-light" data-value="{option}"' in live
            local=(Path('lab')/path[2:]).read_bytes()
            actual=get('/'+path[2:])
            assert len(local)>10000 and hashlib.sha256(local).digest()==hashlib.sha256(actual).digest(),option
            print('LIVE HASH VERIFIED:',option,hashlib.sha256(local).hexdigest())
          assert '<h1>ALTER <br>Studio.</h1>' in live
          assert 'data-beauty-choice="beauty-light" data-value="flash"' in live
          assert 'data-beauty-choice="beauty-light" data-value="low-key"' in live
          assert 'data-beauty-original' in live
          print('VERIFIED: 2 exact Light files and card bindings live; no generation/billing requests.')
          PY
