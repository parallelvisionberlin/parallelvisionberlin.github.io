name: PV LAB Upscale Worker preview

on:
  push:
    branches: [preview/pvlab-upscale-939]

permissions:
  contents: read
  statuses: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: pvlab-upscale-preview
    steps:
      - name: Report the running verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending -f context=pvlab/upscale-studio-preview \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Building the isolated Upscale Studio demo" >/dev/null

      - name: Check out the preview tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Check out the reviewed Upscale candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 609b149ce5f94f8b7a03ec7985a6ac2f951b4f6b
          path: candidate
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Prepare isolated Studio and browser tools
        shell: bash
        run: |
          set -euo pipefail
          node tools/upscale-preview/build.mjs candidate tools/upscale-preview/fixture.mjs
          npm install --prefix "$RUNNER_TEMP/pvlab-preview-tools" --no-audit --no-fund --save-exact wrangler@4.158.0 playwright@1.56.1
          "$RUNNER_TEMP/pvlab-preview-tools/node_modules/.bin/playwright" install chromium --only-shell

      - name: Publish the isolated Studio demo
        id: preview
        shell: bash
        working-directory: candidate/lab-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PVLAB_UPSCALE_PREVIEW_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a40ce1725295563a7b7db9fc3160480a
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Missing PVLAB_UPSCALE_PREVIEW_TOKEN in the pvlab-upscale-preview environment."
            exit 1
          fi
          output="$("$RUNNER_TEMP/pvlab-preview-tools/node_modules/.bin/wrangler" preview --config wrangler-upscale-studio-preview.json --ignore-base-config --name upscale-studio-pr939 --json)"
          preview_url="$(node -e 'const fs=require("node:fs");
          const output=fs.readFileSync(0,"utf8").replace(/\x1b\[[0-?]*[ -\/]*[@-~]/g,"").trim();
          for(const match of output.matchAll(/^\s*\{/gm)){
            const end=output.lastIndexOf("}")+1;
            let result;
            try{result=JSON.parse(output.slice(match.index,end));}catch{continue;}
            const url=result.preview?.urls?.[0];
            if(typeof url==="string"){console.log(url);process.exit(0);}
          }
          console.error("Wrangler did not return a Preview URL.");
          console.error(output.split("\n").filter(line=>/error|preview|upload/i.test(line)).slice(-12).join("\n"));
          process.exit(1);' <<<"$output")"
          if [[ ! "$preview_url" =~ ^https://[a-z0-9-]+\.parallelvision\.workers\.dev/?$ ]]; then
            echo "::error::Cloudflare did not return a preview on the expected Workers subdomain."
            exit 1
          fi
          printf 'preview_url=%s\n' "$preview_url" >> "$GITHUB_OUTPUT"
          response="$RUNNER_TEMP/pvlab-preview-health"
          if curl -fsSL --retry 2 --retry-all-errors --retry-delay 2 --max-time 15 "${preview_url%/}/health" -o "$response" &&
            jq -e '.ok == true and .upscaleRecovery == "20261109-independent2"' "$response" >/dev/null 2>&1; then
            echo "Verified the Worker version on the demo origin."
          else
            echo "::notice::The demo origin did not return the health marker. The separate Worker preview remains the backend verification."
          fi

      - name: Verify both profiles on mobile and desktop
        id: browser
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: node tools/upscale-preview/smoke.mjs "$PREVIEW_URL" "$RUNNER_TEMP/pvlab-preview-tools/node_modules/playwright/index.mjs"

      - name: Report the verification result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BROWSER_RESULT: ${{ steps.browser.outcome }}
          PREVIEW_URL: ${{ steps.preview.outputs.preview_url }}
        run: |
          if [[ "$BROWSER_RESULT" == "success" ]]; then
            status=success
            description="Verified Upscale Studio demo for both roles at 390px and 1440px"
            url="$PREVIEW_URL"
          else
            status=failure
            description="Upscale Studio preview verification failed"
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$status" -f context=pvlab/upscale-studio-preview \
            -f target_url="$url" -f description="$description" >/dev/null
