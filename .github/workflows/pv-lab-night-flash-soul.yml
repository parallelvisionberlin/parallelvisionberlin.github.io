name: PV LAB Night Flash Soul integration
on:
  pull_request:
    paths:
      - 'lab/night-flash-soul.js'
      - 'lab/moods.js'
      - 'lab/lab.js'
      - 'lab-worker/higgsfield.mjs'
      - 'tests/lab-night-flash-soul*'
      - '.github/workflows/pv-lab-night-flash-soul.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  night-flash-soul:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Test Soul API, pricing, Mood and approved Image contracts
        run: node --test tests/lab-night-flash-soul.test.mjs tests/lab-higgsfield.test.mjs tests/lab-soul-commercial-pricing.test.mjs tests/lab-moods.test.mjs tests/lab-approved-image-ui-contract.test.mjs
      - name: Install browser
        run: |
          npm install --prefix /tmp/pv-night-flash-soul --no-save playwright@1.57.0
          node /tmp/pv-night-flash-soul/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify owner and customer Studio at desktop and phone widths
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-night-flash-soul/node_modules/playwright/index.mjs
        run: node tests/lab-night-flash-soul-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: night-flash-soul-desktop-phone
          path: test-results/night-flash-soul-*.png
          retention-days: 2
