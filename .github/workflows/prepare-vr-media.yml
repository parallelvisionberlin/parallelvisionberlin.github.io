name: Prepare same-origin VR film
on:
  push:
    paths: ['.github/workflows/prepare-vr-media.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install encoder
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Prepare verified film copies
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 -o /tmp/original.mp4 'https://pub-21c1e54026ca4574b09d269b385e2fca.r2.dev/HYPER%20Future%20Berlin%20%202500%20Long%20Cinematic.mp4'
          echo 'fcafb7c7830e451e983f29d41fd8976a711e4830d0ada1a3aec257d1acdde6c1  /tmp/original.mp4' | sha256sum -c -
          mkdir -p assets/optimized/video/berlin-2063
          ffmpeg -v error -i /tmp/original.mp4 -map 0:v:0 -map 0:a:0 -c:v libx264 -preset fast -crf 18 -pix_fmt yuv420p -c:a copy -movflags +faststart assets/optimized/video/berlin-2063/film-vr-hd.mp4
          curl --fail --location --retry 3 -o assets/optimized/video/berlin-2063/film-vr-light.mp4 'https://pub-21c1e54026ca4574b09d269b385e2fca.r2.dev/hyper-future-berlin-desktop.mp4'
          echo 'b2798ff10103b5ed5e614f0aa8f603691db71fcb92aef074ed20c9fbf1d5d303  assets/optimized/video/berlin-2063/film-vr-light.mp4' | sha256sum -c -
          test "$(stat -c%s assets/optimized/video/berlin-2063/film-vr-hd.mp4)" -lt 100000000
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/optimized/video/berlin-2063/film-vr-*.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Host verified Berlin film copies for same-origin VR textures"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
