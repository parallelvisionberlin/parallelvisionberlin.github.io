name: ALTER 13-look production verification
on:
  push:
    branches: [verify/alter-editorial-archive-20261107]
    paths: [.github/workflows/alter-archive-live-proof.yml]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5a5e698b27e6ca173921e3bea984ea5bbe726838
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify all thirteen custom-domain card images and CSS bytes
        run: |
          python3 - <<'PY'
          import re,hashlib,urllib.request
          from pathlib import Path
          def get(path):
            req=urllib.request.Request('https://pvlab.studio'+path,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0 (PVLAB verification)'})
            with urllib.request.urlopen(req,timeout=25) as r:return r.read()
          s=Path('lab/beauty.html').read_text(); live=get('/beauty').decode()
          keys=re.findall(r'data-look="([a-z]+)"',s)
          assert len(keys)==13 and len(set(keys))==13
          assert all('data-look="'+key+'"' in live for key in keys)
          assert 'beauty-archive-curation.css?v=20261107-archive1' in live
          assert '<h1>ALTER <br>Studio.</h1>' in live
          css=Path('lab/beauty-archive-curation.css').read_bytes()
          assert hashlib.sha256(css).digest()==hashlib.sha256(get('/beauty-archive-curation.css?v=20261107-archive1')).digest()
          cards=re.findall(r'class="beauty-look-photo" src="(\./visuals/beauty/atelier/[^"]+)"',s)
          assert len(cards)==13 and len(set(cards))==13
          for src in cards:
            a=(Path('lab')/src[2:]).read_bytes();b=get('/'+src[2:])
            assert hashlib.sha256(a).digest()==hashlib.sha256(b).digest(),src
          print('LIVE VERIFIED: 13 distinct card images and CSS byte-identical to reviewed source.')
          PY
      - name: Check guest desktop and phone behavior without generation
        run: |
          npm install --prefix /tmp/pv-beauty --no-audit --no-fund playwright@1.57.0
          node /tmp/pv-beauty/node_modules/playwright/cli.js install chromium
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from '/tmp/pv-beauty/node_modules/playwright/index.mjs';
          const browser=await chromium.launch({headless:true});
          try{
            for(const width of [1440,390]){
              const context=await browser.newContext({viewport:{width,height:900}});
              const page=await context.newPage();let writes=0;
              await page.route('**/api/**',route=>{if(route.request().method()!=='GET'){writes++;route.abort();}else route.continue();});
              await page.goto('https://pvlab.studio/beauty',{waitUntil:'domcontentloaded',timeout:30000});
              await page.locator('#beauty-looks-list [data-look]').first().waitFor();
              assert.equal(await page.locator('#beauty-looks-list [data-look]').count(),13);
              assert.equal(await page.locator('.beauty-looks-arrow').count(),0);
              assert.equal(await page.locator('.beauty-looks-list .beauty-look-copy small').count(),13);
              assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth),true);
              await page.locator('[data-look="nighttape"]').click();
              await page.waitForFunction(()=>document.getElementById('beauty-light').value==='low-key');
              assert.equal(await page.locator('#beauty-color').inputValue(),'film');
              assert.match(await page.locator('#beauty-direction').inputValue(),/analog nighttime/i);
              assert.equal(writes,0,'Browsing does not send paid API mutations');
              const track=page.locator('#beauty-looks-list');await track.focus();await page.keyboard.press('Home');
              assert.equal(await page.locator('[data-look="editorial"]').evaluate(n=>document.activeElement===n),true);
              await page.keyboard.press('End');
              assert.equal(await page.locator('[data-look="nighttape"]').evaluate(n=>document.activeElement===n),true);
              console.log('LIVE GUEST UI VERIFIED:',width,'px');
              await context.close();
            }
          }finally{await browser.close();}
          JS
