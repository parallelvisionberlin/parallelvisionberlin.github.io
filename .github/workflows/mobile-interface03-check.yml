name: Mobile Interface 03 check
on:
  push:
    branches: [mobile-app-v1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx expo export --platform ios --output-dir /tmp/pv-interface03
