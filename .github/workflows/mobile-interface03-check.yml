name: Mobile 06 interface checks
on:
  push:
    branches: [mobile-app-v1]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: node scripts/site05-components.cjs
      - run: npx expo export --platform ios --output-dir /tmp/pv-interface03
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/site05-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile06-screen-previews
          retention-days: 7
          path: /tmp/site05-evidence/*.png
