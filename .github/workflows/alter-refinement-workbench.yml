name: ALTER production proof
on:
  push:
    branches: [fix/alter-three-row-scroll-20261106]
    paths: [.github/workflows/alter-refinement-workbench.yml]
permissions:
  contents: write
  checks: read
jobs:
  production-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_SHA: 46054b88b991656eeb19affd7ed7e2bd6c6f8acf
      REVIEWED_SHA: 1b361a956f4cb04fe4dca376b223ca47bc3a6ce2
      ALTER_PR: '887'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 46054b88b991656eeb19affd7ed7e2bd6c6f8acf
          fetch-depth: 100
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Fetch exact read-only verifier and scoped record writer
        run: |
          curl --fail --location --silent --show-error 'https://at.adobe.com/iSUOZ51bsH6o7OI1' -o /tmp/alter-verify-live.mjs
          curl --fail --location --silent --show-error 'https://at.adobe.com/dWHOynZeUx0HtEVz' -o /tmp/alter-record-live.mjs
          echo '37bd70f8028b8a0473052906c1fd1972d7942cc7eb6b5b32227ff28ce549bc0f  /tmp/alter-verify-live.mjs' | sha256sum --check
          echo '09f226229d2335f675b8eb0f6557dac81bfed97a67b19e487a0c8abd9572df0e  /tmp/alter-record-live.mjs' | sha256sum --check
      - name: Install pinned Chromium
        timeout-minutes: 3
        run: |
          npm install --prefix /tmp/pv-beauty --no-audit --no-fund playwright@1.57.0
          node /tmp/pv-beauty/node_modules/playwright/cli.js install chromium
      - name: Verify exact Cloudflare commit, production bytes and real guest behavior
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PV_PLAYWRIGHT_MODULE: /tmp/pv-beauty/node_modules/playwright/index.mjs
        run: |
          node --input-type=module <<'JS'
          const url=`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/commits/${process.env.RELEASE_SHA}/check-runs?check_name=Cloudflare%20Pages`;
          for(let attempt=0;attempt<4;attempt++){
            const r=await fetch(url,{headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${process.env.GITHUB_TOKEN}`}});if(!r.ok)throw Error(`GitHub check evidence HTTP ${r.status}`);
            const checks=(await r.json()).check_runs||[];const check=checks.find(c=>c.head_sha===process.env.RELEASE_SHA&&c.app?.slug==='cloudflare-workers-and-pages');
            if(check?.status==='completed'){if(check.conclusion!=='success')throw Error('Cloudflare deployment did not succeed');break;}
            if(attempt===3)throw Error('Cloudflare publication remains pending');
            console.log('Exact deployment check still pending; no deployment or login started.');await new Promise(r=>setTimeout(r,45000));
          }
          JS
          node /tmp/alter-verify-live.mjs
          cp test-results/alter-live-evidence.json /tmp/alter-live-evidence.json
      - name: Save only verified ALTER publication evidence in the existing shared handoff
        env:
          EVIDENCE_PATH: /tmp/alter-live-evidence.json
        run: |
          git fetch origin main --depth=100
          git switch --detach origin/main
          git merge-base --is-ancestor "$RELEASE_SHA" HEAD
          node /tmp/alter-record-live.mjs
          git diff --check
          git add lab/BEAUTY-WORK-STATE.md lab/owner-work-records.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record verified ALTER refinement publication and unchanged approved background'
          git push origin HEAD:refs/heads/main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alter-production-evidence
          path: |
            test-results/alter-live-*.png
            test-results/alter-live-evidence.json
          retention-days: 7
