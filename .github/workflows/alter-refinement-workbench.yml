name: ALTER refinement workbench
on:
  push:
    branches: [fix/alter-three-row-scroll-20261106]
    paths: [.github/workflows/alter-refinement-workbench.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Preserve current main and import exact reviewed bytes
        run: |
          test "$GITHUB_REF" = refs/heads/fix/alter-three-row-scroll-20261106
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --depth=100
          git merge --no-ff --no-commit origin/main
          curl --fail --location --silent --show-error 'https://at.adobe.com/IhTPu5RcS4NbrzRu' -o /tmp/alter-refinement.zip
          echo 'c2254f88472ba314e790336b998d2db48e06f7ea760a37ff49ead3df02e16490  /tmp/alter-refinement.zip' | sha256sum --check
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,zipfile
          root=pathlib.Path.cwd()
          allowed={'lab/BEAUTY-WORK-STATE.md','lab/beauty-approved-20261029.js','lab/beauty-settings.js','lab/beauty.html','lab/beauty.js','tests/lab-beauty-atelier.test.mjs','tests/lab-beauty-ui.mjs','lab/beauty-flow-refinement.css','lab/visuals/beauty/atelier/makeup-smoky.webp','lab/visuals/beauty/atelier/makeup-shimmer.webp','lab/visuals/beauty/atelier/makeup-rose.webp'}
          with zipfile.ZipFile('/tmp/alter-refinement.zip') as z:
            manifest=json.loads(z.read('manifest.json'))
            assert {e['path'] for e in manifest}==allowed
            for entry in manifest:
              p=root/entry['path'];data=z.read('files/'+entry['path'])
              assert '..' not in pathlib.PurePosixPath(entry['path']).parts
              assert (hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None)==entry['baseline'], 'Changed baseline: '+entry['path']
              assert hashlib.sha256(data).hexdigest()==entry['sha256'], 'Changed patch bytes'
            for entry in manifest:
              p=root/entry['path'];p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read('files/'+entry['path']))
            pathlib.Path('/tmp/alter-record.json').write_bytes(z.read('record.json'))
            pathlib.Path('/tmp/alter-manifest.json').write_bytes(z.read('manifest.json'))
            subprocess.run(['git','add','--']+[e['path'] for e in manifest],check=True)
          PY
          node scripts/owner-work-state.mjs upsert /tmp/alter-record.json
          node scripts/owner-work-state.mjs validate
          git add lab/owner-work-records.json
      - name: Preserve identity defaults, fixed photograph and existing quote safeguards
        run: |
          node --check lab/beauty-approved-20261029.js
          node --check lab/beauty.js
          node --check tests/lab-beauty-ui.mjs
          node --test tests/lab-approved-image-ui-contract.test.mjs tests/lab-beauty.test.mjs tests/lab-beauty-atelier.test.mjs
          node --test --test-name-pattern='Beauty Studio binds' tests/lab-worker.test.mjs
          git diff --cached --check
      - name: Install pinned Chromium
        timeout-minutes: 3
        run: |
          npm install --prefix /tmp/pv-beauty --no-audit --no-fund playwright@1.57.0
          node /tmp/pv-beauty/node_modules/playwright/cli.js install chromium
      - name: Complete original role, quote, history and responsive regression
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-beauty/node_modules/playwright/index.mjs
        run: |
          node tests/lab-studios-menu-ui.mjs
          node tests/lab-beauty-ui.mjs
      - name: Record actual test evidence and save only scoped application files
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const record=JSON.parse(fs.readFileSync('/tmp/alter-record.json','utf8'));
          const url=`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          record.tests=record.tests.map(t=>t.label==='Full intercepted browser regression'?{...t,result:'passed',scope:'Complete Beauty/Studios suite including native wheel in both directions, mouse drag and touch swipe, all 45 choices, no control overlap, quote safeguards, private History, comparison and zoom. All API calls intercepted; no paid generation.',observedAt:new Date().toISOString(),source:url}:t);
          record.updatedAt=new Date().toISOString();
          fs.writeFileSync('/tmp/alter-record.json',JSON.stringify(record));
          const p='lab/BEAUTY-WORK-STATE.md';let s=fs.readFileSync(p,'utf8');
          s=s.replace('# Beauty Studio and Studios navigation\n','# Beauty Studio and Studios navigation\n\n## Three-row refinement CI passed\n\n- Complete original Beauty/Studios role, quote, history and responsive checks passed, including the new 45-choice grid, wheel reversal, drag and real emulated touch swipe.\n- Evidence: '+url+'. All APIs intercepted; no provider job or payment. Merge and custom-domain publication remain separate.\n');
          fs.writeFileSync(p,s);
          JS
          node scripts/owner-work-state.mjs upsert /tmp/alter-record.json
          node scripts/owner-work-state.mjs validate
          git add lab/BEAUTY-WORK-STATE.md lab/owner-work-records.json
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Refine ALTER three-row editor and bidirectional archive while locking approved background'
          git rev-parse HEAD
          git push origin HEAD:refs/heads/fix/alter-three-row-scroll-20261106
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alter-refinement-evidence
          path: test-results/beauty-*.png
          retention-days: 3
