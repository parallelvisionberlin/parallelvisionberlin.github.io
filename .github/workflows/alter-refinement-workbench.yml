name: ALTER refinement workbench
on:
  push:
    branches: [fix/alter-three-row-scroll-20261106]
    paths: [.github/workflows/alter-refinement-workbench.yml]
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Preserve shared records and tested application bytes
        run: |
          python3 - <<'PY'
          import json,pathlib,hashlib
          state=json.loads(pathlib.Path('lab/owner-work-records.json').read_text())
          record=next(r for r in state['records'] if r['id']=='alter-tabbed-editor')
          pathlib.Path('/tmp/alter-record.json').write_text(json.dumps(record))
          paths=['lab/beauty.html','lab/beauty.js','lab/beauty-settings.js','lab/beauty-approved-20261029.js','lab/beauty-editorial-final.css','lab/beauty-flow-refinement.css','tests/lab-beauty-ui.mjs','tests/lab-beauty-atelier.test.mjs']
          paths+=list(map(str,pathlib.Path('lab/visuals/beauty/atelier').glob('*')))
          pathlib.Path('/tmp/alter-locked.json').write_text(json.dumps({p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths}))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --depth=100
          git merge --no-ff --no-commit origin/main || {
            test "$(git diff --name-only --diff-filter=U)" = lab/owner-work-records.json
          }
          git show origin/main:lab/owner-work-records.json > lab/owner-work-records.json
          node scripts/owner-work-state.mjs upsert /tmp/alter-record.json
          node scripts/owner-work-state.mjs validate
          python3 - <<'PY'
          import json,pathlib,hashlib
          for p,h in json.loads(pathlib.Path('/tmp/alter-locked.json').read_text()).items():
            assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==h,'Application changed: '+p
          PY
          git add lab/owner-work-records.json
          git diff --cached --check
          git commit -m 'Preserve concurrent work-log update; tested ALTER application unchanged'
          git push origin HEAD:refs/heads/fix/alter-three-row-scroll-20261106
