name: Apply and verify Nina conversion hardening
on:
  push:
    branches: [nina-conversion-hardening-20260911]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nina-conversion-hardening-20260911
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact reviewed patch
        run: |
          base64 -d scripts/nina-conversion-hardening.patch.gz.b64 | gunzip > /tmp/nina-conversion.patch
          patch -p1 < /tmp/nina-conversion.patch
          git diff --check
      - name: Install locked Worker dependencies
        run: |
          npm install -g pnpm@10.15.1
          pnpm --dir anam-token-worker install --frozen-lockfile
      - name: Worker syntax and full regression suite
        run: |
          npm run check --prefix anam-token-worker
          npm test --prefix anam-token-worker
      - name: Browser regressions on phone and desktop
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          python scripts/test-nina-web-browser.py
          python scripts/test-nina-admin-call-recovery.py
      - name: Verify scope and remove temporary transfer files
        run: |
          git diff --check
          git status --short
          rm -f scripts/nina-conversion-hardening.patch.gz.b64
          rm -f .github/workflows/nina-conversion-hardening-snapshot.yml
          rm -f .github/workflows/nina-conversion-hardening-apply.yml
          git diff --check
      - name: Commit verified hardening changes
        run: |
          git config user.name 'Nina conversion checks'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anam-token-worker/src/live-usage.js anam-token-worker/src/stripe.js anam-token-worker/src/index.js anam-token-worker/src/analytics.js js/nina-access.js js/nina-admin.js anam-token-worker/test/live-usage.test.js anam-token-worker/test/stripe.test.js scripts/test-nina-web-browser.py scripts/test-nina-admin-call-recovery.py .github/workflows/nina-conversion-hardening-snapshot.yml .github/workflows/nina-conversion-hardening-apply.yml scripts/nina-conversion-hardening.patch.gz.b64
          git commit -m 'Harden Nina trial, checkout, microphone and conversion tracking'
          git push origin HEAD:nina-conversion-hardening-20260911
