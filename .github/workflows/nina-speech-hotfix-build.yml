name: Verify speech-first hotfix
on:
  push:
    branches: [nina-speech-first-hotfix-20260910]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact guarded patch
        run: python scripts/apply-speech-hotfix.py
      - name: Verify production JavaScript and billing regression tests
        run: |
          git diff --check
          npm run build
          node --test anam-token-worker/test/web-conversion.test.js anam-token-worker/test/live-usage.test.js anam-token-worker/test/speech-activation.test.js
          git diff --exit-code -- nina-app.html js/nina-app-bootstrap.js css/nina-deck04.css anam-token-worker/src
          sha256sum js/nina-access.js js/nina-web-flow.js scripts/test-nina-web-browser.py
      - name: Browser regression on phone and desktop
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
          export CHROMIUM_PATH=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path)')
          python scripts/test-nina-web-browser.py
      - name: Commit verified production changes on isolated branch
        run: |
          git config user.name 'Nina speech regression checks'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/nina-access.js index.html nina-project.html anam-token-worker/test/live-usage.test.js scripts/test-nina-web-browser.py
          git commit -m 'Fix speech-first trial activation and verify web purchase handoff'
          git push origin HEAD:nina-speech-first-hotfix-20260910
          git log -1 --format=%H
          git ls-tree -r HEAD js/nina-access.js js/nina-web-flow.js index.html nina-project.html anam-token-worker/test/live-usage.test.js anam-token-worker/test/speech-activation.test.js scripts/test-nina-web-browser.py
