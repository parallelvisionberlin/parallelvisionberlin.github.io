name: Site 05 Windows source and installer check
on:
  push:
    branches: [mobile-app-v1]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/deck04-installer-check.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: mobile-app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Parse pinned installer in Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pin = 'b71bba896f44a85400f97c65685a070505b785b2'
          $path = 'mobile-app/finish-site05.ps1'
          $tokens = $null; $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          $text = [IO.File]::ReadAllText((Resolve-Path $path))
          $needle = '$SourceCommit = ' + "'" + $pin + "'"
          if (!$text.Contains($needle)) { throw 'Installer source pin does not match verified source.' }
          if (!$text.Contains('SITE COHESION / 05.4')) { throw 'Wrong release marker.' }
          git cat-file -e "${pin}^{commit}"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned source is unavailable.' }
          git diff --exit-code $pin HEAD -- mobile-app/App.js mobile-app/src mobile-app/assets mobile-app/tests mobile-app/scripts mobile-app/app.json mobile-app/eas.json mobile-app/package.json mobile-app/package-lock.json mobile-app/.easignore mobile-app/.npmrc
          if ($LASTEXITCODE -ne 0) { throw 'Source differs from tested source.' }
      - name: Install exact checked dependency lock on Windows
        working-directory: mobile-app
        run: npm ci --ignore-scripts
      - name: Run protocol, transport and native action checks on Windows
        working-directory: mobile-app
        shell: powershell
        run: |
          npm.cmd test
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          node.exe scripts/site05-components.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Native action checks failed.' }
      - name: Export iOS bundle with original films on Windows without starting EAS
        working-directory: mobile-app
        shell: powershell
        run: |
          npx.cmd expo export --platform ios --output-dir "$env:RUNNER_TEMP\pv-site05-ios"
          if ($LASTEXITCODE -ne 0) { throw 'iOS export failed.' }
