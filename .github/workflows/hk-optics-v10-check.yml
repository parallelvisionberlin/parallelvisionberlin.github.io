name: Hong Kong light optics V10 verification
on:
  push:
    branches: ['codex/hk-optics-v10-20261021']
    paths: ['tools/hk-optics-v10-patch.mjs', 'lab-worker/film-light-scatter.mjs', 'tests/lab-film-light*', '.github/workflows/hk-optics-v10-check.yml']
permissions:
  contents: write
concurrency:
  group: hk-optics-v10-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            tools
            lab
            lab-worker
            tests
            sandbox
            js
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Build isolated candidate from current main
        run: |
          set -euo pipefail
          mkdir -p /tmp/hk-v10-source
          cp tools/hk-optics-v10-patch.mjs lab-worker/film-light-scatter.mjs tests/lab-film-light-scatter.test.mjs tests/lab-film-light-remote.mjs /tmp/hk-v10-source/
          git fetch origin main --depth=1
          git switch --detach FETCH_HEAD
          cp /tmp/hk-v10-source/film-light-scatter.mjs lab-worker/
          cp /tmp/hk-v10-source/lab-film-light-scatter.test.mjs /tmp/hk-v10-source/lab-film-light-remote.mjs tests/
          node /tmp/hk-v10-source/hk-optics-v10-patch.mjs
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          for(const path of ['tests/lab-hong-kong-continuity.test.mjs','tests/lab-moods.test.mjs']){
            const text=readFileSync(path,'utf8');
            const old='/Increase atmospheric diffusion slightly/';
            assert.equal(text.split(old).length-1,1,'Expected one obsolete high-strength wording assertion: '+path);
            writeFileSync(path,text.replace(old,'/Make atmospheric diffusion clearly visible/'));
          }
          NODE
          git diff --check
          node --check lab-worker/film-finish.mjs
          node --check lab-worker/film-light-scatter.mjs
          node --check lab/moods.js
      - run: npm ci --no-audit --no-fund
      - name: Run full Lab unit regression without paid generation
        run: |
          set -euo pipefail
          mkdir -p test-results/hk-optics-v10
          node --test tests/lab*.test.mjs 2>&1 | tee test-results/hk-optics-v10/unit-results.txt
      - name: Normalize existing Cloudflare credential without logging it
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          token="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '\r\n\t ')"
          test -n "$token"
          echo "::add-mask::$token"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
      - name: Verify actual Cloudflare pixel processing and export comparisons
        run: |
          set -euo pipefail
          npx --yes wrangler@4 dev --remote --config tests/lab-film-preview.toml --ip 127.0.0.1 --port 8799 > /tmp/hk-v10-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8799/ | grep -q film-preview-ready; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then cat /tmp/hk-v10-preview.log; exit 1; fi
          node tests/lab-film-light-remote.mjs
      - name: Commit verified product files to release branch only
        run: |
          set -euo pipefail
          git diff --exit-code -- lab-worker/worker.mjs lab-worker/film-engine-v3.mjs lab/mood-references.js lab/hong-kong-variants.js
          git add lab lab-worker/film-finish.mjs lab-worker/film-light-scatter.mjs tests/lab-film-finish.test.mjs tests/lab-hong-kong-image3-baseline.test.mjs tests/lab-film-preview-worker.mjs tests/lab-film-light-scatter.test.mjs tests/lab-film-light-remote.mjs tests/lab-hong-kong-continuity.test.mjs tests/lab-moods.test.mjs
          git diff --cached --name-only > test-results/hk-optics-v10/release-files.txt
          git config user.name 'Parallel Vision'
          git config user.email 'parallelvision.label@gmail.com'
          git commit -m 'Hong Kong: stronger atmosphere and independent multiscale light optics'
          git push origin HEAD:refs/heads/fix/hk-atmosphere-optics-v10-20261021
          git rev-parse HEAD | tee test-results/hk-optics-v10/release-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hk-optics-v10-verification
          retention-days: 5
          path: test-results/hk-optics-v10/
