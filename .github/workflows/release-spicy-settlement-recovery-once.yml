name: Recover stuck PV LAB SpicyAPI video outputs
on:
  push:
    branches: [main]
    paths:
      - lab-worker/spicy-settlement-cost.mjs
permissions:
  contents: read
concurrency:
  group: parallel-vision-lab-production
  cancel-in-progress: false
jobs:
  release:
    if: startsWith(github.event.head_commit.message, 'Recover Seedance video archiving from invalid provider settlement')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: a40ce1725295563a7b7db9fc3160480a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate Spicy recovery, no new generation, customer refunds and credit parity
        run: |
          set -euo pipefail
          node --check lab-worker/worker.mjs
          node --check lab-worker/spicy-settlement-cost.mjs
          node --check tests/lab-seedance.test.mjs
          node --test tests/lab-spicy-settlement-cost.test.mjs tests/lab-seedance.test.mjs tests/lab-seedance-reference-retail.test.mjs tests/lab-transform-fixed-retail.test.mjs tests/lab-pricing-integrity.test.mjs
      - name: Verify production bindings before deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const token=(process.env.CLOUDFLARE_API_TOKEN||'').trim();
          if(!token)throw Error('No Cloudflare deployment credential.');
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/parallel-vision-lab/settings';
          const response=await fetch(url,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
          const json=await response.json();
          if(!response.ok||!json.success||!Array.isArray(json.result?.bindings))
            throw Error('Production bindings unavailable. Deployment blocked.');
          const bindings=json.result.bindings;
          for(const name of ['LAB_DB','LAB_MEDIA','OWNER_DB'])if(!bindings.some(b=>b.name===name))throw Error('Missing '+name);
          const sorted=JSON.stringify(bindings.map(b=>Object.fromEntries(Object.entries(b).sort())).sort((a,b)=>a.name.localeCompare(b.name)));
          writeFileSync(process.env.RUNNER_TEMP+'/spicy-bindings-before.json',sorted);
          console.log('Production bindings verified, no changes made.');
          NODE
      - name: Deploy same Worker without modifying secrets, D1 or environment settings
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: a40ce1725295563a7b7db9fc3160480a
          workingDirectory: lab-worker
          wranglerVersion: '4'
          command: deploy --keep-vars
      - name: Verify live worker recovered the cost parser without changing bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          let ok=false;
          for(let attempt=0;attempt<8;attempt++){
            const res=await fetch('https://parallel-vision-lab.parallelvision.workers.dev/health',{signal:AbortSignal.timeout(12000)});
            const j=await res.json();
            if(res.ok&&j.ok&&j.videoSettlementRecovery==='20261119-spicy-settlement-null-v1'){ok=true;break;}
            await new Promise(r=>setTimeout(r,3000));
          }
          if(!ok)throw Error('Worker release health version not live.');
          const token=(process.env.CLOUDFLARE_API_TOKEN||'').trim();
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts/parallel-vision-lab/settings';
          const res=await fetch(url,{headers:{Authorization:'Bearer '+token},signal:AbortSignal.timeout(20000)});
          const json=await res.json();
          if(!res.ok||!json.success)throw Error('Post-release binding verification failed.');
          const sorted=JSON.stringify(json.result.bindings.map(b=>Object.fromEntries(Object.entries(b).sort())).sort((a,b)=>a.name.localeCompare(b.name)));
          if(sorted!==readFileSync(process.env.RUNNER_TEMP+'/spicy-bindings-before.json','utf8'))throw Error('Cloudflare bindings unexpectedly changed.');
          console.log('LIVE Worker verified and bindings unchanged. No paid generation submitted.');
          NODE
