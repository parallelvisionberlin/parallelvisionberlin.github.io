name: ALTER 20-look public release proof
on:
  push:
    branches: [verify/alter-20-looks-live-20261108]
    paths: [.github/workflows/alter-20-live-proof.yml]
permissions:
  contents: read
  checks: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 92ee7dea6589ec52934e076ca89206645a649de2
      - name: Verify Cloudflare deployment, 20 card references, original hero and 7 new image hashes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,urllib.request,re
          from pathlib import Path
          sha='92ee7dea6589ec52934e076ca89206645a649de2'
          repo='parallelvisionberlin/parallelvisionberlin.github.io'
          def get(url,github=False):
            hdr={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0 (PVLAB read-only verification)'}
            if github:
              hdr['Authorization']='Bearer '+os.environ['GITHUB_TOKEN']
              hdr['Accept']='application/vnd.github+json'
            with urllib.request.urlopen(urllib.request.Request(url,headers=hdr),timeout=25) as r:return r.read()
          checks=json.loads(get('https://api.github.com/repos/'+repo+'/commits/'+sha+'/check-runs?check_name=Cloudflare%20Pages',True))['check_runs']
          assert any(c['head_sha']==sha and c['status']=='completed' and c['conclusion']=='success' and c.get('app',{}).get('slug')=='cloudflare-workers-and-pages' for c in checks)
          source=Path('lab/beauty.html').read_text()
          html=get('https://pvlab.studio/beauty').decode()
          assert 'beauty-gallery-20261107.css?v=20261107-gallery1' in html
          assert '<h1>ALTER <br>Studio.</h1>' in html
          ids=re.findall(r'data-look="([a-z]+)"',source)
          assert len(ids)==20 and len(set(ids))==20
          assert all('data-look="'+x+'"' in html for x in ids)
          names=['beauty-gallery-20261107.css','beauty-editorial-final.css','beauty-panel-widen-20261107.css','beauty-flow-refinement.css','beauty-look-catalog.js','visuals/beauty/atelier/hero.webp']
          for title in ['goldenhour','skinstudy','windowstudy','softfocus','velvet','silverhalo','windblown']:
            names.append('visuals/beauty/atelier/archive-'+title+'-20261107.webp')
          for name in names:
            local=(Path('lab')/name).read_bytes()
            actual=get('https://pvlab.studio/'+name)
            assert hashlib.sha256(local).digest()==hashlib.sha256(actual).digest(),name
            print('LIVE HASH VERIFIED:',name)
          print('LIVE VERIFIED 20 cards and locked hero')
          PY
      - name: Verify guest layout and card selection on real desktop/phone browsers without generation
        run: |
          npm install --prefix /tmp/pv-browser --no-audit --no-fund playwright@1.57.0
          node /tmp/pv-browser/node_modules/playwright/cli.js install chromium
          node --input-type=module <<'JS'
          import {chromium} from '/tmp/pv-browser/node_modules/playwright/index.mjs';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          try {
            for(const [width,height] of [[1727,900],[1440,900],[1366,768],[1024,768],[390,844]]) {
              const context=await browser.newContext({viewport:{width,height},reducedMotion:'reduce'});
              const page=await context.newPage();let paid=0;
              await page.route('**/api/**',route=>{
                const path=new URL(route.request().url()).pathname;
                if(route.request().method()!=='GET'){
                  if(path==='/api/quotes'||path==='/api/jobs')paid++;
                  return route.abort();
                }
                return route.continue();
              });
              await page.goto('https://pvlab.studio/beauty',{waitUntil:'domcontentloaded',timeout:35000});
              await page.locator('#beauty-looks-list [data-look]').first().waitFor();
              const state=await page.evaluate(()=>{
                const track=document.querySelector('#beauty-looks-list');
                const tr=track.getBoundingClientRect();
                const cards=[...track.querySelectorAll('[data-look]')].map(el=>el.getBoundingClientRect());
                const panel=document.querySelector('.beauty-edit-panel').getBoundingClientRect();
                const heading=document.querySelector('.beauty-looks-heading').getBoundingClientRect();
                return {count:cards.length,full:cards.filter(r=>r.left>=tr.left-2&&r.right<=tr.right+2).length,
                  peek:cards.some(r=>r.left<tr.right&&r.right>tr.right+3),
                  panelEnds:panel.bottom,headingStarts:heading.top,
                  overflow:document.documentElement.scrollWidth>innerWidth,
                  hero:getComputedStyle(document.querySelector('.beauty-editor-grid'),'::before').backgroundImage};
              });
              assert.equal(state.count,20);
              assert.match(state.hero,/atelier\/hero\.webp/);
              assert.equal(state.overflow,false);
              if(width>=1350){
                assert.equal(state.full,4,'Four full cards on landing');
                assert.equal(state.peek,true,'Next card visible as preview');
              }
              if(width>=1001)assert.ok(state.panelEnds<=state.headingStarts+2,'No overlap');
              assert.equal(await page.locator('.beauty-tabs [role="tab"]').count(),5);
              await page.locator('[data-look="goldenhour"]').click();
              assert.equal(await page.locator('#beauty-hair').inputValue(),'waves');
              assert.equal(await page.locator('#beauty-light').inputValue(),'window');
              assert.equal(await page.locator('#beauty-color').inputValue(),'warm');
              assert.equal(await page.locator('[data-look="goldenhour"]').getAttribute('aria-pressed'),'true');
              assert.match(await page.locator('#beauty-direction').inputValue(),/Honeyed directional light/);
              assert.equal(paid,0);
              console.log('PUBLIC GUEST VERIFIED',width,JSON.stringify(state));
              await context.close();
            }
          } finally { await browser.close(); }
          JS
