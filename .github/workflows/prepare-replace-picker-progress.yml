name: Verify Replace picker and visible preparation
on:
  push:
    branches: [fix/replace-picker-progress-20261108]
    paths: ['.github/workflows/prepare-replace-picker-progress.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: '22.16.0'}
      - name: Apply baseline-checked scoped edits
        run: python3 scripts/prepare-replace-picker-progress-20261108.py
      - name: Syntax and existing scope, privacy, quote and UI checks
        run: |
          node --check lab/lab.js
          node --check lab/image-viewer-editor.js
          node --check lab/selection-feedback.js
          git diff --check
          node --test tests/lab-approved-image-ui-contract.test.mjs tests/lab-viewer-reference-preparation.test.mjs tests/lab-viewer-inline.test.mjs tests/lab-guided-replace.test.mjs tests/lab-viewer-scope.test.mjs tests/lab-viewer-replacement-prompt.test.mjs tests/lab-sam-click-mask.test.mjs tests/lab-image-replacement-composite.test.mjs
      - name: Install isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/pv-browser" --no-audit --no-fund playwright@1.57.0
          "$RUNNER_TEMP/pv-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify explicit picker, eight views, busy animation and no accidental generation
        env:
          PV_PLAYWRIGHT_MODULE: ${{ runner.temp }}/pv-browser/node_modules/playwright/index.mjs
        run: |
          node tests/lab-selection-regions-ui.mjs
          node tests/lab-precision-edit-ui.mjs
          node tests/lab-image-replacement-flow-ui.mjs
      - name: Retain review evidence
        if: always()
        run: git diff > implementation.diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: replace-picker-progress-evidence
          path: |
            implementation.diff
            test-results/pv-guided-*.png
            test-results/pv-sidebar-*.png
          retention-days: 2
      - name: Commit only tested files to the existing review branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,subprocess,urllib.request
          root='https://api.github.com/repos/parallelvisionberlin/parallelvisionberlin.github.io'
          branch='fix/replace-picker-progress-20261108';head=os.environ['GITHUB_SHA']
          def api(path,method='GET',data=None):
            req=urllib.request.Request(root+path,method=method,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
            with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          paths=['lab/image-viewer-editor.js','lab/viewer-guided-replace.css','lab/selection-feedback.js','lab/lab.js','lab/precision-edit.js','lab/studio.html','tests/lab-image-replacement-flow-ui.mjs','tests/lab-selection-regions-ui.mjs']
          assert set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())==set(paths),'Unexpected source changes'
          assert api('/git/ref/heads/'+branch)['object']['sha']==head,'Branch moved; preserve newer work'
          entries=[]
          for path in paths:
            b=api('/git/blobs','POST',{'content':pathlib.Path(path).read_text(),'encoding':'utf-8'})
            entries.append({'path':path,'type':'blob','mode':'100644','sha':b['sha']})
          entries.append({'path':'scripts/prepare-replace-picker-progress-20261108.py','type':'blob','mode':'100644','sha':None})
          old=api('/git/commits/'+head);tree=api('/git/trees','POST',{'base_tree':old['tree']['sha'],'tree':entries})
          new=api('/git/commits','POST',{'message':'Separate saved reference picker and show real Replace preparation stages','parents':[head],'tree':tree['sha']})
          assert api('/git/ref/heads/'+branch)['object']['sha']==head,'Branch changed while testing'
          api('/git/refs/heads/'+branch,'PATCH',{'sha':new['sha'],'force':False})
          print('TESTED_SOURCE_COMMITTED',new['sha'])
          PY
