name: ALTER 5-image production verification
on:
  push:
    branches: [verify/alter-five-tweaks-live-20261107]
    paths: [.github/workflows/alter-five-live-proof.yml]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c5c9e9e688bad0df51b0b3da1ff5d81d1d7ea440
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Check the exact five released images against the live domain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,re,urllib.request
          photos={'light-flash':'alter-light-flash-fixed-20261107.webp','light-high-key':'alter-light-high-key-fixed-20261107.webp','color-warm':'alter-color-warm-fixed-20261107.webp','color-film':'alter-color-film-fixed-20261107.webp','color-soft-film':'alter-color-soft-film-fixed-20261107.webp'}
          src=Path('lab/beauty.html').read_text()
          def get(path):
            r=urllib.request.Request('https://pvlab.studio'+path,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0 (PVLAB release verification)'})
            with urllib.request.urlopen(r,timeout=25) as res:return res.read()
          live=get('/beauty').decode('utf-8')
          for k,name in photos.items():
            rel='./visuals/beauty/atelier/'+name
            assert src.count(rel)==1,(k,'source mapping')
            assert rel in live,(k,'missing from production')
            local=Path('lab')/rel[2:]
            public=get('/'+rel[2:])
            assert hashlib.sha256(local.read_bytes()).digest()==hashlib.sha256(public).digest(),(k,'different image bytes')
          assert '<h1>ALTER <br>Studio.</h1>' in live
          assert live.count('data-beauty-original')==5
          print('LIVE ASSET VERIFIED: 5 new Light/Color WebP images, exact SHA-256 matches.')
          PY
      - name: Check active cards in real guest browser, no generation
        run: |
          npm install --prefix /tmp/pv-verify --no-audit --no-fund playwright@1.57.0
          node /tmp/pv-verify/node_modules/playwright/cli.js install chromium
          node --input-type=module <<'JS'
          import {chromium} from '/tmp/pv-verify/node_modules/playwright/index.mjs';
          import assert from 'node:assert/strict';
          const browser=await chromium.launch({headless:true});
          const check={light:['flash','high-key'],color:['warm','film','soft-film']};
          try{
            for(const width of [1440,390]){
              const context=await browser.newContext({viewport:{width,height:900}});
              const page=await context.newPage();let writes=0;
              await page.route('**/api/**',route=>{if(route.request().method()!=='GET'){writes++;route.abort();}else route.continue();});
              await page.goto('https://pvlab.studio/beauty',{waitUntil:'domcontentloaded',timeout:30000});
              for(const [group,ids] of Object.entries(check)){
                await page.locator('#beauty-tab-'+group).click();
                for(const id of ids){
                  const el=page.locator('[data-beauty-choice="beauty-'+group+'"][data-value="'+id+'"]');
                  const background=await el.locator('.beauty-choice-photo').evaluate(n=>getComputedStyle(n).backgroundImage);
                  assert.ok(background.includes('alter-'+group+'-'+id+'-fixed-20261107.webp'),'Expected current published thumbnail');
                }
              }
              assert.equal(writes,0,'No paid requests');
              assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth),true,'No page overflow');
              await context.close();console.log('GUEST VERIFIED:',width);
            }
          }finally{await browser.close();}
          JS
