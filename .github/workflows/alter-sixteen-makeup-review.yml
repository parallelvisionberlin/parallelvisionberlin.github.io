name: ALTER 16 makeup options visual + quote regression
on:
  push:
    branches: [feature/alter-sixteen-makeup-scroll-20261108]
    paths: [.github/workflows/alter-sixteen-makeup-review.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Preserve current main and original hero, gallery, and non-Makeup tabs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --depth=100
          git merge --no-ff --no-commit origin/main
          sha256sum lab/visuals/beauty/atelier/hero.webp lab/beauty-editorial-final.css lab/beauty-flow-refinement.css lab/beauty-panel-widen-20261107.css lab/beauty-gallery-20261107.css > /tmp/alter-makeup-locked.sha256
      - name: Apply scoped 16-makeup upgrade using approved portrait reference assets
        run: |
          curl --fail --silent --show-error --location 'https://at.adobe.com/qmXQCyvuMEsAIPlS' -o /tmp/alter-makeup-package.zip
          echo 'b79ea360e1e2927dbb0865666a414d647000adb7c65c5a2b5b86a8e56cdde58c  /tmp/alter-makeup-package.zip' | sha256sum --check
          mkdir -p /tmp/alter-makeup-package
          unzip -q /tmp/alter-makeup-package.zip -d /tmp/alter-makeup-package
          python3 /tmp/alter-makeup-package/apply.py
          sha256sum --check /tmp/alter-makeup-locked.sha256
          node --check lab/beauty.js
          node --check lab/beauty-approved-20261029.js
          node --check lab/beauty-settings.js
          node --check lab/beauty-look-catalog.js
          node --check tests/lab-beauty-ui.mjs
          git diff --check
      - name: All Makeup, gallery, quote, idempotency, and approved Image contracts
        run: |
          node --test tests/lab-beauty-makeup-expansion.test.mjs tests/lab-beauty-category-contract.test.mjs tests/lab-beauty-atelier.test.mjs tests/lab-beauty-gallery-twenty.test.mjs tests/lab-beauty-archive-curation.test.mjs tests/lab-beauty.test.mjs tests/lab-approved-image-ui-contract.test.mjs
          node --test --test-name-pattern='Beauty Studio binds' tests/lab-worker.test.mjs
      - name: Browser dependencies
        timeout-minutes: 3
        run: |
          npm install --prefix /tmp/pv-beauty --no-audit --no-fund playwright@1.57.0
          node /tmp/pv-beauty/node_modules/playwright/cli.js install chromium
      - name: Full desktop/mobile Beauty and Studios browser regression
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-beauty/node_modules/playwright/index.mjs
        run: |
          node tests/lab-studios-menu-ui.mjs
          node tests/lab-beauty-ui.mjs
      - name: Commit only scoped changes and new makeup photos on review branch
        run: |
          test "$GITHUB_REF" = refs/heads/feature/alter-sixteen-makeup-scroll-20261108
          git add lab/beauty.html lab/beauty-look-catalog.js lab/beauty-makeup-expansion-20261108.css lab/beauty.js lab/beauty-settings.js lab/beauty-approved-20261029.js tests/lab-beauty-ui.mjs tests/lab-beauty-atelier.test.mjs tests/lab-beauty-category-contract.test.mjs tests/lab-beauty-makeup-expansion.test.mjs lab/visuals/beauty/atelier/alter-makeup-*-20261108.webp
          python3 - <<'PY'
          import subprocess
          names=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          expected={'lab/beauty.html','lab/beauty-look-catalog.js','lab/beauty-makeup-expansion-20261108.css','lab/beauty.js','lab/beauty-settings.js','lab/beauty-approved-20261029.js','tests/lab-beauty-ui.mjs','tests/lab-beauty-atelier.test.mjs','tests/lab-beauty-category-contract.test.mjs','tests/lab-beauty-makeup-expansion.test.mjs'}
          expected|={'lab/visuals/beauty/atelier/alter-makeup-'+name+'-20261108.webp' for name in ['natural','editorial','soft-glam','bold','metallic','smoky','shimmer','rose','graphic','wet-lid','crystal','bronze','plum','nude','vinyl']}
          assert names==expected,(names-expected,expected-names)
          PY
          git diff --cached --check
          git commit -m 'Upgrade ALTER to 16 photographic makeup presets with vertical scroll'
          git push origin HEAD:refs/heads/feature/alter-sixteen-makeup-scroll-20261108
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alter-makeup-16-browser-evidence
          path: |
            test-results/beauty-fit-*.png
            test-results/beauty-category-*.png
          retention-days: 3
