name: ALTER workstation isolated review
on:
  push:
    branches: [feature/alter-editorial-workstation-20261107]
    paths: [.github/workflows/alter-workstation-source.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Reconcile current main without overwriting collaborators
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --depth=100
          git merge --no-ff --no-commit origin/main
      - name: Import exact reviewed workstation files
        run: |
          curl --fail --location --silent --show-error 'https://at.adobe.com/RosmOAbAGI79l3zE' -o /tmp/alter-reviewed.zip
          echo 'aea83dcc2837545ea2128ef04518c29157acb5eba9fb6ce8b6e0c7e0233c5519  /tmp/alter-reviewed.zip' | sha256sum --check
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('/tmp/alter-reviewed.zip') as z:
            open('/tmp/alter-apply.py','wb').write(z.read('apply.py'))
          PY
          python3 /tmp/alter-apply.py
          node --check lab/beauty-settings.js
          node --check lab/beauty.js
          node --check lab/beauty-workstation-20261107.js
          node --check tests/lab-beauty-ui.mjs
          git diff --cached --check
      - name: Existing Beauty, quote, and new workstation contracts
        run: |
          node --test tests/lab-approved-image-ui-contract.test.mjs tests/lab-beauty.test.mjs tests/lab-beauty-atelier.test.mjs tests/lab-beauty-category-contract.test.mjs tests/lab-beauty-archive-curation.test.mjs tests/lab-beauty-workstation.test.mjs
          node --test --test-name-pattern='Beauty Studio binds' tests/lab-worker.test.mjs
      - name: Install browser for real rendered geometry checks
        run: |
          npm install --prefix /tmp/pv-beauty --no-audit --no-fund playwright@1.57.0
          node /tmp/pv-beauty/node_modules/playwright/cli.js install chromium
      - name: Existing Studios menu and complete ALTER browser review
        env:
          PV_PLAYWRIGHT_MODULE: /tmp/pv-beauty/node_modules/playwright/index.mjs
        run: |
          node tests/lab-studios-menu-ui.mjs
          node tests/lab-beauty-ui.mjs
      - name: Save reviewed implementation on feature branch only
        run: |
          test "$GITHUB_REF" = refs/heads/feature/alter-editorial-workstation-20261107
          git diff --cached --check
          git commit -m 'Build ALT​ER cinematic workstation with authentic Before/After and prompt-based Light adjustments'
          git rev-parse HEAD
          git push origin HEAD:refs/heads/feature/alter-editorial-workstation-20261107
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: alter-workstation-visual-evidence
          path: |
            test-results/beauty-fit-*.png
            test-results/beauty-flow-*.png
            test-results/beauty-category-light-*.png
            test-results/beauty-missing-original-*.png
          retention-days: 3
