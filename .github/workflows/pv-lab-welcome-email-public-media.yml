name: PV LAB welcome email image delivery

on:
  pull_request:
    paths:
      - 'lab-worker/signup-welcome-email.mjs'
      - 'lab/email/**'
      - 'scripts/verify-welcome-email-media.mjs'
      - '.github/workflows/pv-lab-welcome-email-public-media.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-email-images:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify exact published editorial image bytes and links before release
        shell: bash
        run: |
          node scripts/verify-welcome-email-media.mjs --links
