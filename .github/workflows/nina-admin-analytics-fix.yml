name: Nina admin analytics fix
on:
  push:
    branches: [nina-admin-analytics-fix-20260909]
permissions:
  contents: write
jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nina-admin-analytics-fix-20260909
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repair temporary migration script quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/nina-admin-analytics-fix.mjs')
          s=p.read_text()
          s=s.replace("""detailStat("Conversation", detail.transcript.length ? `${'${detail.userMessages}'} / ${'${detail.ninaMessages}'} turns` : "No transcript"),""", """detailStat("Conversation", detail.transcript.length ? (detail.userMessages + " / " + detail.ninaMessages + " turns") : "No transcript"),""")
          s=s.replace("""const turn=document.createElement("div"); turn.className=`admin-turn is-${'${message.role}'}`;""", """const turn=document.createElement("div"); turn.className="admin-turn is-" + message.role;""")
          s=s.replace("""const item=document.createElement("div"); item.textContent=`${'${dateTime(visit.startedAt)}'} · ${'${duration(visit.connectedSeconds)}'} · ${'${String(visit.status).toUpperCase()}'}${'${visit.id === detail.session.id ? " · THIS CALL" : ""}'}`; history.append(item);""", """const item=document.createElement("div"); item.textContent=dateTime(visit.startedAt) + " · " + duration(visit.connectedSeconds) + " · " + String(visit.status).toUpperCase() + (visit.id === detail.session.id ? " · THIS CALL" : ""); history.append(item);""")
          s=s.replace("""const detailRow = elements.sessions.querySelector(`[data-detail-for="${'${CSS.escape(session.id)}'}"]`);""", """const detailRow = elements.sessions.querySelector('[data-detail-for="' + CSS.escape(session.id) + '"]');""")
          p.write_text(s)
          PY
      - name: Apply admin analytics fixes
        run: node scripts/nina-admin-analytics-fix.mjs
      - name: Install worker dependencies
        run: npm ci --prefix anam-token-worker
      - name: Syntax check
        run: npm run check --prefix anam-token-worker
      - name: Focused analytics tests
        run: node --test anam-token-worker/test/admin-analytics-fix.test.js
      - name: Existing analytics tests
        run: node --test anam-token-worker/test/analytics.test.js
      - name: Commit functional files
        run: |
          git add anam-token-worker/src/analytics.js anam-token-worker/src/index.js anam-token-worker/test/admin-analytics-fix.test.js nina-admin/index.html js/nina-admin.js css/nina-admin.css
          git config user.name 'Nina analytics checks'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Fix Nina admin speech tracking and Berlin day boundaries'
            git push origin HEAD:nina-admin-analytics-fix-20260909
          fi
      - name: Remove temporary workflow tooling
        run: |
          git rm -f scripts/nina-admin-analytics-fix.mjs .github/workflows/nina-admin-analytics-fix.yml
          git commit -m 'Remove temporary Nina analytics migration tooling'
          git push origin HEAD:nina-admin-analytics-fix-20260909
