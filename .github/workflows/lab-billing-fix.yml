name: Lab billing diagnostic fix
on:
  push:
    branches: ['fix/lab-billing-errors-20260927']
    paths: ['.github/workflows/lab-billing-fix.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            lab
            lab-worker
            tests
            js/pv-auth.js
            .github/workflows
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply narrowly scoped error-message fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lab-worker/worker.mjs')
          s=p.read_text()
          old="    else if([40201,40202].includes(code))message='Provider balance or API spending limit is insufficient. Check the provider console.';"
          new="""    else if(code===40201)message='SpicyAPI [40201]: insufficient available provider balance for this request. Check Billing, including funds held for pending jobs. '+cleanProviderDetail(result?.msg)+' This is separate from your Lab daily budget. No new generation was submitted.';
              else if(code===40202)message='SpicyAPI [40202]: a provider spending limit was reached. '+cleanProviderDetail(result?.msg)+' Check the named limit in API Keys or Team; a platform limit can only reset. This is separate from your Lab daily budget. No new generation was submitted.';"""
          assert s.count(old)==1, 'Source changed; do not patch blindly'
          assert "export const VERSION = 'pv-lab-2026-09-27.3';" in s
          s=s.replace(old,new).replace("export const VERSION = 'pv-lab-2026-09-27.3';","export const VERSION = 'pv-lab-2026-09-27.3-billing1';")
          p.write_text(s)
          t=Path('tests/lab-worker.test.mjs')
          t.write_text(t.read_text()+r'''
          test('Provider balance and spending-cap errors remain distinct and redact private details without paid requests',async()=>{
            const originalFetch=globalThis.fetch;
            for(const [code,detail,expected] of [[40201,'Available balance is insufficient','insufficient available provider balance'],[40202,'This key has reached its daily spend cap','provider spending limit']]){
              const {env}=fixture();const id=await setup(env);createCount=0;
              try{
                globalThis.fetch=async(url,options={})=>new URL(url).pathname.endsWith('/jobs/quote')?Response.json({code,msg:detail+' sk-spicy-private-test-secret https://private.example/signed-token',data:null},{status:402}):originalFetch(url,options);
                const response=await req(env,'/api/quotes',{method:'POST',data:{sourceId:id,settings:p}});
                assert.equal(response.status,422);const text=JSON.stringify(await response.json());
                assert.ok(text.includes('['+code+']'));assert.ok(text.includes(expected));assert.ok(text.includes(detail));
                assert.ok(!text.includes('sk-spicy-private-test-secret'));assert.ok(!text.includes('private.example'));
                assert.equal(createCount,0);assert.equal(env.LAB_DB.db.prepare('SELECT COUNT(*) AS n FROM jobs').get().n,0);
                assert.equal(env.LAB_DB.db.prepare('SELECT daily_limit_microusd AS n FROM settings').get().n,10000000);
              }finally{globalThis.fetch=originalFetch;}
            }
          });
          ''')
          r=Path('lab/README.md')
          r.write_text(r.read_text()+'''\n\n## Billing errors (2026-09-27)\n\nProvider errors 40201 (available provider balance) and 40202 (key, team or platform spending cap) now remain distinct in the Lab. The provider message is retained with signed URLs and credentials redacted. Neither message is confused with the Lab's separate daily budget. No retry, generation, recharge, limit change, key change, schema migration or history modification is added. Existing failed messages cannot retroactively recover a provider code that the previous implementation discarded.\n''')
          PY
      - name: Regression checks with mocked provider only
        run: |
          node --check lab-worker/worker.mjs
          node --test tests/lab*.test.mjs
      - name: Commit only verified changes; remove temporary workflow
        run: |
          git config user.name 'ParallelVision'
          git config user.email 'parallelvision.label@gmail.com'
          git rm .github/workflows/lab-billing-fix.yml
          git add lab-worker/worker.mjs tests/lab-worker.test.mjs lab/README.md
          git commit -m 'Distinguish provider balance from API spending caps in Lab'
          git push origin HEAD:fix/lab-billing-errors-20260927
