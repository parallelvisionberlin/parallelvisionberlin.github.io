name: ALTER Light Color released preview verification
on:
  push:
    branches: [verify/alter-light-color-previews-live-20261107]
    paths: [.github/workflows/alter-light-color-live-proof.yml]
permissions:
  contents: read
  checks: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ac9e579e3ac1f65eaebceb350607de40012e70de
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify exact Cloudflare release and all 16 public image hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,urllib.request,hashlib,re,os
          from pathlib import Path
          sha='ac9e579e3ac1f65eaebceb350607de40012e70de'
          endpoint=f'https://api.github.com/repos/parallelvisionberlin/parallelvisionberlin.github.io/commits/{sha}/check-runs?check_name=Cloudflare%20Pages'
          req=urllib.request.Request(endpoint,headers={'Accept':'application/vnd.github+json','Authorization':'Bearer '+os.environ['GH_TOKEN']})
          with urllib.request.urlopen(req,timeout=25) as r: runs=json.load(r)['check_runs']
          assert any(c['head_sha']==sha and c['status']=='completed' and c['conclusion']=='success' and c.get('app',{}).get('slug')=='cloudflare-workers-and-pages' for c in runs),'Exact Cloudflare release not confirmed'
          src=Path('lab/beauty.html').read_text()
          paths=sorted(set(re.findall(r'\./visuals/beauty/atelier/alter-(?:light|color)-[a-z-]+-20261107\.webp',src)))
          assert len(paths)==16,(len(paths),paths)
          def get(path):
            request=urllib.request.Request('https://pvlab.studio'+path,headers={'Cache-Control':'no-cache','User-Agent':'Mozilla/5.0 (ALTER preview release verification)'})
            with urllib.request.urlopen(request,timeout=25) as r:return r.read()
          actual=get('/beauty').decode('utf-8')
          assert all(p in actual for p in paths),'Live page has stale cards'
          for p in paths:
            local=(Path('lab')/p[2:]).read_bytes()
            served=get('/'+p[2:])
            assert hashlib.sha256(local).digest()==hashlib.sha256(served).digest(),'Live image differs: '+p
          print('LIVE VERIFIED: Cloudflare exact merge, page references and all 16 selected existing WebP images match reviewed source.')
          PY
      - name: Real guest tabs at desktop and mobile widths, no generation
        run: |
          npm install --prefix /tmp/alter-verify --no-audit --no-fund playwright@1.57.0
          node /tmp/alter-verify/node_modules/playwright/cli.js install chromium
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from '/tmp/alter-verify/node_modules/playwright/index.mjs';
          const browser=await chromium.launch({headless:true});
          try{
            for(const width of [1440,390]){
              const context=await browser.newContext({viewport:{width,height:900}});
              const page=await context.newPage();let writes=0;
              await page.route('**/api/**',route=>{if(route.request().method()!=='GET'){writes++;route.abort();}else route.continue();});
              await page.goto('https://pvlab.studio/beauty',{waitUntil:'domcontentloaded',timeout:30000});
              for(const group of ['light','color']){
                await page.locator('#beauty-tab-'+group).click();
                const values=await page.locator('#beauty-panel-'+group+' [data-beauty-choice]').evaluateAll(nodes=>nodes.map(n=>({value:n.dataset.value,style:n.querySelector('.beauty-choice-photo')?.getAttribute('style')||''})));
                assert.equal(values.length,9);
                assert.equal(values[0].value,'keep');
                assert.equal(values[0].style,'');
                const images=values.slice(1).map(x=>x.style.match(/alter-(?:light|color)-[a-z-]+-20261107\.webp/)?.[0]);
                assert.equal(images.filter(Boolean).length,8);
                assert.equal(new Set(images).size,8);
              }
              assert.equal(writes,0,'Browsing may not spend credits');
              assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth),true,'No page overflow');
              await context.close();
              console.log('LIVE GUEST TABS OK '+width);
            }
          }finally{await browser.close();}
          JS
