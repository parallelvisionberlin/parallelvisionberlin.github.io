name: Tune Nina world image

on:
  push:
    paths:
      - '.github/workflows/tune-nina-world.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine desktop world image height
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('nina-project.html')
          text = path.read_text(encoding='utf-8')
          marker = 'NINA_WORLD_DESKTOP_COMPACT_20260906'

          if marker not in text:
              override = '''
              /* NINA_WORLD_DESKTOP_COMPACT_20260906
                 Keep the Berlin 2063 image colossal in width, but reveal its archive note
                 and the beginning of the supporting copy sooner on desktop. */
              @media (min-width: 901px) {
                .n-world {
                  aspect-ratio: auto;
                  height: clamp(520px, 60vh, 620px);
                }
                .n-world-note {
                  margin: 14px 0 52px;
                  padding-top: 14px;
                }
              }
              '''
              if '</style>' not in text:
                  raise SystemExit('Could not find closing style tag in nina-project.html')
              text = text.replace('</style>', override + '\n  </style>', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit change and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/tune-nina-world.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nina-project.html .github/workflows/tune-nina-world.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Refine Nina world image height"
          git push
