name: ALTER scroll settling check
on:
  push:
    branches: [fix/alter-scroll-settle-20261106]
    paths: [.github/workflows/alter-scroll-settle.yml]
permissions:
  contents: write
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply exact reviewed three-file correction
        run: |
          curl --fail --location --silent --show-error 'https://at.adobe.com/KL1TFh10K71nxziV' -o /tmp/settle.zip
          echo '74b43cb7bf44cdb3cbc0230e118ec0e2e80b2947dae97069c06315b2192a1cc5  /tmp/settle.zip' | sha256sum --check
          python3 - <<'PY'
          import zipfile,json,pathlib,hashlib,subprocess
          with zipfile.ZipFile('/tmp/settle.zip') as z:
            entries=json.loads(z.read('manifest.json'))
            assert {e['path'] for e in entries}=={'lab/beauty-approved-20261029.js','lab/beauty.html','tests/lab-beauty-atelier.test.mjs'}
            for e in entries:
              assert hashlib.sha256(pathlib.Path(e['path']).read_bytes()).hexdigest()==e['baseline'],e['path']
              assert hashlib.sha256(z.read('files/'+e['path'])).hexdigest()==e['sha256']
            for e in entries:pathlib.Path(e['path']).write_bytes(z.read('files/'+e['path']))
            subprocess.run(['git','add','--']+[e['path'] for e in entries],check=True)
          p=pathlib.Path('lab/BEAUTY-WORK-STATE.md');s=p.read_text()
          note='\n## Scroll-settling follow-up\n\n- Final normal-motion QA found a 1px rounding tail could keep requestAnimationFrame running after the archive stopped moving. The only interaction change is a 1.5px settle tolerance instead of 0.8px. No layout, imagery, defaults, backend or generation behavior changed.\n- New regression executes the actual animation function against integer and fractional scroll positions in both directions and requires an empty frame queue. All 14 focused contracts pass. Actual isolated Chromium observation changed from 42 idle callbacks over 700ms to zero.\n- Presentation JS cache key is 20261106-flow2; other refinement assets retain flow1. Production verification follows merge.\n'
          p.write_text(s.replace('# Beauty Studio and Studios navigation\n','# Beauty Studio and Studios navigation\n'+note))
          PY
          node --check lab/beauty-approved-20261029.js
          node --test tests/lab-approved-image-ui-contract.test.mjs tests/lab-beauty.test.mjs tests/lab-beauty-atelier.test.mjs
          node --test --test-name-pattern='Beauty Studio binds' tests/lab-worker.test.mjs
          git add lab/BEAUTY-WORK-STATE.md
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stop ALTER scroll animation at pixel-rounded resting positions'
          git push origin HEAD:refs/heads/fix/alter-scroll-settle-20261106
