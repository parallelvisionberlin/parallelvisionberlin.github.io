<!doctype html>
<html lang="en">
<head>

  <title>Nina FOK / Test Call — Parallel Vision</title>
  <style>
    * { box-sizing: border-box; }

    .label { color: #aaa; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0 0 10px; font-weight: 400; font-size: clamp(28px, 5vw, 44px); letter-spacing: -.04em; }
    p { color: #aaa; font-size: 14px; line-height: 1.6; margin: 0 0 20px; max-width: 640px; }
    iframe { display: block; width: 100%; height: 70vh; height: 70svh; min-height: 440px; max-height: 760px; border: 1px solid #282828; border-radius: 4px; background: #111; }

</head>
<body>
  <main>
    <header>

    </footer>
  </main>
