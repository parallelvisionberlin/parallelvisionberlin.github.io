<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>Nina FOK / App Signal</title>
  <link rel="stylesheet" href="./fashion.css?v=20260904-media-1">
  <link rel="stylesheet" href="./css/nina-access.css?v=20260907-credit-type">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;overflow:hidden}
    body{font-family:Inter,Arial,sans-serif}
    #pv-app-boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:rgba(255,255,255,.55);font:10px/1.5 'Courier New',monospace;letter-spacing:.18em;text-transform:uppercase;z-index:99999}
    body > *:not(#pv-app-boot):not(#ninaAccess):not(#ninaOverlay):not(#openNina){display:none!important}
    #openNina{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none}
    #ninaOverlay{padding:0!important;background:#000!important}
    #ninaOverlay .nina-window{width:100%!important;height:100%!important;max-width:none!important;max-height:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}
    #ninaOverlay .nina-window-bar{display:none!important}
    #ninaOverlay .nina-stage{top:0!important;inset:0!important}
    #ninaFullscreen,#closeNina,.nina-fullscreen,.nina-close{display:none!important}
    body.nina-fullscreen-active{overflow:hidden!important}
  </style>
</head>
<body>
  <div id="pv-app-boot">Opening Nina signal</div>
  <script type="module">
    const boot = document.getElementById('pv-app-boot');
    try {
      const response = await fetch('./nina-project.html', { cache: 'no-store' });
      if (!response.ok) throw new Error(`Nina source returned ${response.status}`);
      const source = await response.text();
      const parsed = new DOMParser().parseFromString(source, 'text/html');

      for (const child of Array.from(parsed.body.children)) {
        if (child.tagName === 'SCRIPT') continue;
        document.body.appendChild(document.importNode(child, true));
      }

      const access = document.getElementById('ninaAccess');
      const overlay = document.getElementById('ninaOverlay');
      const trigger = document.getElementById('openNina') || document.querySelector('[data-nina-open]');
      if (!access || !overlay || !trigger) throw new Error('Nina live UI missing');

      await import('./js/nina-access.js?v=20260908-native-app-complete');

      const openSignal = () => {
        try { trigger.click(); } catch (error) { console.error(error); }
      };

      openSignal();
      setTimeout(openSignal, 350);
      setTimeout(() => {
        if (overlay.classList.contains('is-open')) boot.remove();
        else boot.textContent = 'Nina signal unavailable';
      }, 1400);
    } catch (error) {
      console.error(error);
      boot.textContent = 'Nina signal unavailable';
    }
  </script>
</body>
</html>
