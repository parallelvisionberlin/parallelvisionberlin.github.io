<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><title>Moods / PV Lab</title><link rel="stylesheet" href="./app-moods.css?v=4"></head>
<body>
<main id="collection">
  <button class="hero" id="featured" aria-label="Explore featured Mood"><img id="hero-image" alt="" fetchpriority="high"><span class="shade"></span><span class="hero-copy"><span class="eyebrow">A DIFFERENT REALITY AWAITS</span><h1>Find your<br><em>Mood.</em></h1><span class="hero-bottom"><span id="hero-name"></span></span></span></button>
  <section class="collection"><div class="section-heading"><h2>Choose your world.</h2><span id="count" class="eyebrow"></span></div><p class="subcopy">A look you love. A photograph that's yours.</p><div id="mood-grid" class="mood-grid" aria-label="Explore Moods"></div>
  <a class="own-mood" href="./mood-creator.html?native=1#app-create"><span class="eyebrow">YOUR OWN CREATIVE DIRECTION</span><strong>Invent a look.<br>Make it yours.</strong><span class="own-bottom">Create your Mood </span></a></section>
</main>
<dialog id="mood-detail" tabindex="-1" aria-labelledby="detail-title"><div class="detail-art"><img id="detail-image" alt=""><div class="detail-shade"></div><button id="close-detail" class="close" aria-label="Close Mood"><span class="close-mark" aria-hidden="true"></span></button><div class="detail-copy"><span class="eyebrow">EXPLORE THE LOOK</span><h2 id="detail-title"></h2><p id="detail-description"></p></div></div><div class="detail-controls"><button id="use-mood" class="primary">Use this mood </button><label id="photo-picker" class="photo-picker" hidden><input id="photo-input" type="file" accept="image/jpeg,image/png,image/webp"><span class="photo-placeholder"><b>＋ Add your photo</b><small>JPG, PNG or WebP · up to 10 MB</small></span><img id="photo-preview" alt="Your selected photograph" hidden></label><button id="remove-photo" class="quiet" hidden>Remove photo</button><p id="photo-error" role="alert"></p><button id="continue-create" class="primary" hidden>Continue to Create </button><p id="disclosure" class="fine" hidden>Adjust intensity and see the price before you generate.</p></div></dialog>
<p id="load-error" role="alert" hidden>Couldn't load the Moods. Check your connection and reopen this screen.</p>
<script type="module" src="./app-moods.js?v=4"></script>
</body></html>
