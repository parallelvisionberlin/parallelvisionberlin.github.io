name = "parallel-vision-anam-token"
main = "src/index.js"
compatibility_date = "2026-08-18"
workers_dev = true

[triggers]
crons = ["*/5 * * * *"]

[vars]
NINA_CONTINUITY_ENABLED = "true"
NINA_WORKSPACE_ENABLED = "true"
CLERK_ISSUER = "https://clerk.parallelvisionlabel.com"
# Deploy after the separate Anam folders are populated and indexed.
NINA_PUBLIC_KNOWLEDGE_FOLDER_ID = "a70c1f61-4245-4759-83ac-aa5cc4d35892"
NINA_PRIVATE_KNOWLEDGE_FOLDER_ID = "f32f5de6-0669-4113-a45f-15d974fb7859"
# Set this to the effective Anam rate for the account; 0 keeps cost reporting explicitly unconfigured.
ANAM_ESTIMATED_PRICE_PER_MINUTE_EUR = "0"

[[d1_databases]]
binding = "NINA_MEMORY_DB"
database_name = "nina-fok-memory"
database_id = "9f31c8a3-8101-408d-a002-22188c67b3b0"
migrations_dir = "migrations"

[ai]
binding = "AI"
